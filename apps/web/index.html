<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- The shared theme script (vite-theme-bootstrap.ts): data-theme before the first paint. -->
<!--theme-bootstrap-->
<!-- The language script (vite-lang-bootstrap.ts): lang of the visitor's choice, so the splash speaks it. -->
<!--lang-bootstrap-->
<meta name="description" content="%APP_DESCRIPTION%">
<title>%APP_NAME%</title>
</head>
<body>
<div id="root"></div>
<!-- Splash (mockups/auth.html#loading): shows before the bundle runs and while
     the app has nothing in #root (session check, loading the signed-in app),
     so the same animation runs on without a jump. Styled by the app's linked
     stylesheet (.brand-loader in app.css): the CSP allows no inline style. -->
<div id="splash" class="brand-loader page" role="status" aria-live="polite" aria-busy="true">
<span class="brand-logo" role="img" aria-label="%APP_NAME%">%APP_LOGO%</span>
<p class="brand-loader-text"><!--splash-text--></p>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
