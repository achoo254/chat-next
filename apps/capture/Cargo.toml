[package]
name = "tunelo-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Screenshots with region picking and annotations for tunelo (spec: docs/capture-wire.md, ADR 0031)"
publish = false

[lib]
name = "tunelo_capture"
path = "src/lib.rs"

[[bin]]
name = "tunelo-capture"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
fontdue = "0.9"
winit = "0.30"
softbuffer = "0.4"
xcap = "0.9"
arboard = { version = "3", default-features = false, features = ["image-data"] }
global-hotkey = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# The overlay goes above the menu bar: AppKit's window level, which winit does not expose.
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
