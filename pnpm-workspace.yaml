packages:
  - apps/*
  - packages/*
  - sdk/ts

# buf's and esbuild's postinstalls only link or check the platform binary
# early; both find their optional platform package without it, so no
# install script runs.
allowBuilds:
  "@bufbuild/buf": false
  esbuild: false

patchedDependencies:
  '@novnc/novnc@1.7.0': patches/@novnc__novnc@1.7.0.patch
