name: engine-flake

# Runs the Go tests (the bridge engine alone, or the whole module as ci.yml does) again and again on a runner, to catch a wait that now and then
# runs out (the `go` job of ci.yml failed on different engine tests at times). Started by hand, never
# by a push: a failing test prints the engine's log, the rows it keeps its progress in and where
# every goroutine waits (server/internal/bridge/engine/engine_test.go, dumpStall).
on:
  workflow_dispatch:
    inputs:
      count:
        description: How many times to run it
        default: "8"
        required: true
      scope:
        description: "engine = the engine package alone; module = the whole module as the go job of ci.yml runs it (packages in parallel, competing for CPU and Postgres)"
        type: choice
        options: [engine, module]
        default: module
        required: true

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('server/go.sum', 'server/internal/store/testdb/testdb.go') }}
      # Every round is run even after a failure, so a run shows how often and which tests stall.
      - name: repeat
        env:
          COUNT: ${{ inputs.count }}
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$SCOPE" = engine ]; then target=./internal/bridge/engine; else target=./...; fi
          failed=0
          for i in $(seq 1 "$COUNT"); do
            echo "::group::round $i of $COUNT ($target)"
            go test -race -count=1 -timeout 25m "$target" || { echo "::error::round $i failed"; failed=$((failed+1)); }
            echo "::endgroup::"
          done
          echo "$failed of $COUNT rounds failed"
          [ "$failed" -eq 0 ]
