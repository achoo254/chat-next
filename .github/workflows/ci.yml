# Quality gates for every push to main and every pull request: TS lint,
# typecheck and tests; the web perf gate (startup bundle size and UI timings
# in Chromium, see apps/web/test/perf); Go format, vet, race tests and
# golangci-lint; protobuf lint, breaking-change check and up-to-date
# generated code.
# The Vietnamese fold and entity helpers run in both languages against the
# shared vectors under spec/, which keeps TS and Go in step.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Budgets live in apps/web/test/perf/budgets.ts; `pnpm perf` runs the same locally.
  web-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @app/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Only Chromium's headless shell, cached per Playwright version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @app/web exec playwright install --with-deps --only-shell chromium
      # The cache holds the browser only; its system libraries come from apt.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @app/web exec playwright install-deps chromium
      - run: pnpm perf

  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      # The Go plugin runs `go tool protoc-gen-go`, so generation needs Go too.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec buf lint proto
      - name: buf breaking
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BASE:proto/buf.yaml" 2>/dev/null; then
            pnpm exec buf breaking proto --against ".git#ref=$BASE,subdir=proto"
          else
            echo "no proto baseline at '$BASE'; skipping buf breaking"
          fi
      - run: pnpm proto:gen
      - run: git diff --exit-code -- packages/proto-ts/src/gen server/gen

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # PostgreSQL binaries of the database tests (internal/store/testdb). A
      # failed download skips those tests and fails the Bot API contract
      # check, so a cached copy keeps the job off Maven Central's bad days.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('server/go.sum', 'server/internal/store/testdb/testdb.go') }}
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: server
