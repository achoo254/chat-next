# Continuous deploy of chat.hoandat.com: after `ci` passes on main, build the
# web app and the Linux server binary, upload them as the restricted
# `chat-deploy` user to /opt/chat/incoming/<id>, and activate through the one
# sudo command that user has (infra/chat/activate-incoming.sh). The server
# backs up the database, migrates, switches and rolls back on failure; the
# smoke test then checks production from outside. Building (which runs
# dependency code) happens in a job without the deploy key; the deploy job
# only downloads the artifact, uploads it and activates it.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy halfway; later runs wait their turn.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - id: release
        name: build release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          id="$(date -u +%Y%m%d-%H%M%S)-${SHA:0:12}"
          echo "id=$id" >>"$GITHUB_OUTPUT"
          mkdir -p release
          pnpm --filter @app/web build
          cp -R apps/web/dist release/web
          (cd server && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../release/server ./cmd/server)
          echo "$id" >release/RELEASE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      # The server address is a secret so the public repository does not show it.
      DEPLOY_HOST: ${{ secrets.CHAT_DEPLOY_HOST }}
      TARGET: chat-deploy@${{ secrets.CHAT_DEPLOY_HOST }}
    steps:
      # Only the smoke script is needed from the repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: infra/chat/smoke.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - name: ssh setup
        env:
          SSH_KEY: ${{ secrets.CHAT_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CHAT_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/chat_deploy
          chmod 600 ~/.ssh/chat_deploy
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          printf 'Host %s\n  Port 24700\n  IdentityFile ~/.ssh/chat_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" >~/.ssh/config
      - name: upload and activate
        run: |
          rsync -rltz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r release/ "$TARGET:/opt/chat/incoming/$RELEASE_ID/"
          ssh "$TARGET" "sudo -n /usr/local/sbin/chat-activate-incoming $RELEASE_ID"
      - run: bash infra/chat/smoke.sh
      - if: always()
        run: rm -rf ~/.ssh/chat_deploy
