# Deploy of chat.hoandat.com.
# Started on demand (`gh workflow run deploy.yml`, usually through the
# chat-ops-prod skill) rather than on every push: AI sessions push to main many
# times a day, and deploying each push kept prod restarting and the session
# waiting. The run deploys the tip of main, and only once `ci` of that commit
# has passed (it waits while that run is still going). The build job makes the
# web app and the Linux server binary without the deploy key; the deploy job
# uploads them as the restricted `chat-deploy` user to /opt/chat/incoming/<id>
# and activates through the one sudo command that user has
# (infra/chat/activate-incoming.sh). The server backs up the database,
# migrates, switches and rolls back on failure; the smoke test then checks
# production from outside.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway; later runs wait their turn.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # Only a commit whose push to main passed `ci` goes to production. A run
      # started right after a push waits for that commit's `ci` (up to 30 min).
      - name: ci passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 90); do
            state="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event push --branch main \
              --commit "$SHA" --limit 1 --json status,conclusion --jq '.[] | "\(.status) \(.conclusion)"')"
            case "$state" in
              "completed success") echo "ci passed for $SHA"; exit 0 ;;
              completed*) echo "::error::ci of $SHA ended: $state"; exit 1 ;;
            esac
            echo "waiting for ci of $SHA (${state:-not started})"
            sleep 20
          done
          echo "::error::ci of $SHA did not finish within 30 minutes"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - id: release
        name: build release
        env:
          SHA: ${{ github.sha }}
        run: |
          id="$(date -u +%Y%m%d-%H%M%S)-${SHA:0:12}"
          echo "id=$id" >>"$GITHUB_OUTPUT"
          mkdir -p release
          pnpm --filter @app/web build
          cp -R apps/web/dist release/web
          (cd server && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../release/server ./cmd/server)
          echo "$id" >release/RELEASE
          # The reviewed Zalo sidecar bundle and the firewall host list go with the release; the server checks them (infra/chat/zalo-sandbox/install-from-release.sh).
          mkdir -p release/zalo-sidecar release/zalo-sandbox
          cp server/internal/bridge/adapters/zalo/sidecar/dist/zalo-sidecar.cjs server/internal/bridge/adapters/zalo/sidecar/dist/zalo-sidecar.cjs.sha256 release/zalo-sidecar/
          cp infra/chat/zalo-sandbox/hosts.conf release/zalo-sandbox/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      # The server address and SSH port are secrets so the public repository does not show them.
      DEPLOY_HOST: ${{ secrets.CHAT_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.CHAT_DEPLOY_PORT }}
      TARGET: chat-deploy@${{ secrets.CHAT_DEPLOY_HOST }}
    steps:
      # Only the smoke script is needed from the repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: infra/chat/smoke.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - name: ssh setup
        env:
          SSH_KEY: ${{ secrets.CHAT_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CHAT_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/chat_deploy
          chmod 600 ~/.ssh/chat_deploy
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          printf 'Host %s\n  Port %s\n  IdentityFile ~/.ssh/chat_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_PORT" >~/.ssh/config
      - name: upload and activate
        run: |
          rsync -rltz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r release/ "$TARGET:/opt/chat/incoming/$RELEASE_ID/"
          ssh "$TARGET" "sudo -n /usr/local/sbin/chat-activate-incoming $RELEASE_ID"
      - run: bash infra/chat/smoke.sh
      - if: always()
        run: rm -rf ~/.ssh/chat_deploy
