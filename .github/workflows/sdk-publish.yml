# Publish one SDK package to npmjs when its release tag is pushed:
#   chat-proto-vX.Y.Z         -> packages/proto-ts      (@achoo254/chat-proto)
#   chat-platform-vX.Y.Z      -> packages/platform      (@achoo254/chat-platform)
#   chat-core-vX.Y.Z          -> packages/core          (@achoo254/chat-core)
#   chat-platform-web-vX.Y.Z  -> packages/platform-web  (@achoo254/chat-platform-web)
#   chat-bot-sdk-vX.Y.Z       -> sdk/ts                 (@achoo254/chat-bot-sdk)
# The tag must match the package's version and point at a commit on main; a
# version already on npmjs cannot be published again, so bump before
# tagging. The client packages depend on each other at the exact version
# (pnpm pack turns workspace:* into it): push the tags one at a time, in
# the order above, each after the previous run finished, so every
# dependency is on npmjs before its dependents. (GitHub starts no workflow
# at all when more than three tags arrive in one push.)
#
# Auth: npm trusted publishing (OIDC), no token anywhere. For each package,
# npmjs.com > package > Settings > Trusted Publisher: GitHub Actions, user
# achoo254, repository chat-next, workflow sdk-publish.yml. Provenance comes
# with it (public repository, GitHub-hosted runner). Each package also has
# "Require two-factor authentication and disallow tokens" on.
name: sdk-publish

on:
  push:
    tags:
      - "chat-proto-v*"
      - "chat-platform-v*"
      - "chat-core-v*"
      - "chat-platform-web-v*"
      - "chat-bot-sdk-v*"

permissions:
  contents: read
  # npm trusted publishing: npm signs in with this job's OIDC token.
  id-token: write

concurrency:
  group: sdk-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Package of the tag, and tag matches its version
        id: package
        run: |
          name="${GITHUB_REF_NAME%-v*}"
          case "$name" in
            chat-proto) dir=packages/proto-ts ;;
            chat-platform) dir=packages/platform ;;
            chat-core) dir=packages/core ;;
            chat-platform-web) dir=packages/platform-web ;;
            chat-bot-sdk) dir=sdk/ts ;;
            *) echo "unknown package in tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          version="$(node -p "require('./${dir}/package.json').version")"
          [ "${name}-v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != ${name}-v${version}"; exit 1; }
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "${GITHUB_REF_NAME} is not on main"; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:packages

      # pnpm pack replaces workspace:* ranges with real versions and applies
      # publishConfig.exports (dist/); npm publishes the tarball. Trusted
      # publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Pack
        working-directory: ${{ steps.package.outputs.dir }}
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Tarball holds only dist, README, LICENSE and package.json
        run: |
          extra="$(tar -tzf "$RUNNER_TEMP"/pack/*.tgz | grep -Ev '^package/(dist/.+|README\.md|LICENSE|package\.json)$' || true)"
          if [ -n "$extra" ]; then echo "unexpected files in the tarball:"; echo "$extra"; exit 1; fi
          tar -tzf "$RUNNER_TEMP"/pack/*.tgz | grep -q '^package/README\.md$'
          tar -tzf "$RUNNER_TEMP"/pack/*.tgz | grep -q '^package/LICENSE$'
          # The packed manifest: real versions and exports into dist/ only.
          manifest="$(tar -xzOf "$RUNNER_TEMP"/pack/*.tgz package/package.json)"
          if echo "$manifest" | grep -Eq '"workspace:|"\./src/'; then echo "$manifest"; echo "packed package.json still has workspace: ranges or src/ exports"; exit 1; fi
      - name: Publish to npmjs (trusted publishing, no token)
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --access public
