# Publishes the sample Mini App (sdk/miniapp-demo) to GitHub Pages at
# https://achoo254.github.io/chat-next/miniapp-demo/, a site of its own that
# bot owners can set as a Mini App URL to try the feature. Only that folder
# is published; nothing else of the repository goes to Pages.
name: pages

on:
  push:
    branches: [main]
    paths: [sdk/miniapp-demo/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: sdk/miniapp-demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mkdir -p _site && cp -R sdk/miniapp-demo _site/miniapp-demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}miniapp-demo/
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
