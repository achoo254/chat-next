openapi: 3.1.0
info:
  title: Chat Bot API
  version: 1.1.0
  summary: HTTP API for bots of the chat platform (release R5).
  description: |
    Bots talk to the chat server of their tenant over HTTPS with JSON.
    This API is our own and is not compatible with the Telegram Bot API.

    - Base URL: `https://chat.<domain>/bot/v1` (the tenant's chat host; any
      other host answers 404). A bot belongs to one tenant and only sees
      users and chats of that tenant.
    - Authentication: `Authorization: Bearer <bot_id>:<secret>`. The token is
      shown once in the Developer Console (BotAdminService.ResetBotToken);
      the server keeps only a hash. A reset token stops working at once.
    - Every answer is an envelope: `{"ok": true, "result": ...}` or
      `{"ok": false, "error": {"code", "description", "retry_after"}}`.
      Clients branch on `error.code`, never on `description`.
    - Ids (`chat_id`, `seq`, user ids, `update_id`, `random_id`) are integers
      below 2^53. A message is addressed by `(chat_id, seq)`.
    - Text follows ADR 0004: plain `text` plus `entities` whose `offset` and
      `length` count UTF-16 code units; length limits count code points
      (4096 for a message). Links in entities and buttons allow only `http`,
      `https`, `mailto` and the app's own scheme. `parse_mode` (`markdown`,
      `html`) is described in `format.md` next to this file.
    - Consent: a bot writes into a private chat only after the user started
      it, followed its deep link, pressed one of its buttons or wrote to it
      (`403 no_consent` otherwise). In groups it needs membership and the
      permission to send. Bots never open private chats themselves and never
      join secret chats.
    - Rate limits depend on the bot's tier (`new`, `default`, `verified`,
      `internal`, `restricted`): every call, every send, and sends into one
      chat (default tier: 30 calls/s, 30 sends/s, 1 send/s per chat with
      bursts of 20). A bot younger than 14 days that is not verified runs on
      `new` (10 calls/s, 5 sends/s, 1 send/s per chat with bursts of 10);
      the anti-abuse rules or the operators can move a bot whose users block
      or report it to `restricted` (5 calls/s, 1 send/s, one send per 5 s per
      chat with bursts of 3).
      Exceeding one answers `429 rate_limited` with `retry_after` seconds
      (also in the `Retry-After` header). After 20 failed authentications
      from one address, further failed authentications from it answer
      `429 rate_limited` (`retry_after` 60) for 60 seconds; requests with a
      valid token are never refused by this. The edge also caps one address
      at 600 requests per second (`429 rate_limited`, same envelope).
    - `503 unavailable` means the server is restarting or dropped the
      request; retry after `retry_after` seconds when given, else after a
      short pause.
    - Request bodies are `application/json`, at most 1 MiB; unknown fields
      are rejected. The file sends (`POST /messages:sendMedia`,
      `POST /messages:sendAlbum`) also take `multipart/form-data` up to
      50 MiB.
    - Bots act like a person with the same rights: what a member, an admin
      or the author may do in the app, the bot may do through the API, and
      nothing more. The bot's tier replaces the per-person rate limits;
      posts, edits, forwards, copies, media and pins count as sends.
    - Updates arrive either by long poll (`GET /updates`) or at a webhook
      (`PUT /webhook`, see the `update` webhook below), never both: while a
      webhook is set, `GET /updates` answers `409 conflict`.

    Later versions only add methods, fields and update kinds; bots must
    ignore fields and update kinds they do not know.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://chat.{domain}/bot/v1
    variables:
      domain:
        default: hoandat.com
        description: Domain of the bot's tenant.
security:
  - botToken: []
tags:
  - name: bot
    description: The bot itself.
  - name: messages
    description: Sending messages.
  - name: updates
    description: Receiving updates and answering callbacks.
  - name: chats
    description: Chats the bot is in, and their administration.
  - name: files
    description: Files of messages the bot can see.
paths:
  /me:
    get:
      tags: [bot]
      operationId: getMe
      summary: The bot's own profile.
      responses:
        '200':
          description: The bot.
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {const: true}
                  result: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Sends a text message.
      description: |
        Posts a text message into a chat the bot is in. A private chat needs
        the user's consent. With `random_id` a retry returns the first
        message instead of posting again (kept 7 days per bot; reusing it
        in another chat is an error).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMessageRequest'}
      responses:
        '200':
          description: The posted message.
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {const: true}
                  result: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:edit:
    post:
      tags: [messages]
      operationId: editMessage
      summary: Edits the text of one of the bot's messages.
      description: |
        Replaces the text (the caption of a media message) and its entities;
        the message gets `edit_date` and users see "đã sửa". A
        `reply_markup` with an `inline_keyboard` replaces the keyboard; none
        keeps it (`messages:editMarkup` removes it). Bots edit their own
        messages at any age while they may still send in the chat; reply
        keyboards cannot be edited. Counts as a send.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditMessageRequest'}
      responses:
        '200': {$ref: '#/components/responses/MessageResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:editMarkup:
    post:
      tags: [messages]
      operationId: editMessageMarkup
      summary: Replaces or removes the inline keyboard of one of the bot's messages.
      description: |
        Without `reply_markup` the keyboard is removed. Changing only the
        keyboard is not an edit for users (no "đã sửa", no
        `message_edited`). Counts as a send.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditMarkupRequest'}
      responses:
        '200': {$ref: '#/components/responses/MessageResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:delete:
    post:
      tags: [messages]
      operationId: deleteMessages
      summary: Deletes messages for everyone.
      description: |
        The bot's own messages at any time; others' where the bot is an
        admin of the group or channel, and in a private chat (either side
        may). Messages the bot may not delete stay as they are; when none of
        them may be deleted the answer is `403 forbidden`. Unknown or already
        deleted seqs are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteMessagesRequest'}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:forward:
    post:
      tags: [messages]
      operationId: forwardMessages
      summary: Forwards messages with a forward header.
      description: |
        Forwards messages of a chat the bot is in (and can see) into
        `chat_id`, in the order given; the rules of sending apply to the
        target (consent in private chats). `random_ids` (one per seq) make a
        retry return the first messages.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForwardMessagesRequest'}
      responses:
        '200': {$ref: '#/components/responses/MessagesResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:copy:
    post:
      tags: [messages]
      operationId: copyMessage
      summary: Posts a copy of a message without a forward header.
      description: |
        Copies a message of a chat the bot is in (text or media, with its
        caption); `text` (with `entities` or `parse_mode`) replaces the text
        or caption.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopyMessageRequest'}
      responses:
        '200': {$ref: '#/components/responses/MessageResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:react:
    post:
      tags: [messages]
      operationId: setReaction
      summary: Sets or removes the bot's reaction on a message.
      description: One emoji per bot and message; an empty `emoji` removes the bot's reaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReactRequest'}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:pin:
    post:
      tags: [messages]
      operationId: pinMessage
      summary: Pins a message.
      description: |
        Needs the permission to pin (admins; members where the group allows
        it; both sides of a private chat). Posts the "pinned" service
        message and counts as a send. Pinning a pinned message does nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageRef'}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:unpin:
    post:
      tags: [messages]
      operationId: unpinMessage
      summary: Unpins a message.
      description: Needs the permission to pin. Unpinning a message that is not pinned does nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageRef'}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:sendMedia:
    post:
      tags: [messages, files]
      operationId: sendMedia
      summary: Sends a photo, video, audio, voice message or document.
      description: |
        Either upload the file (`multipart/form-data`: the file in the part
        `file`, `kind` and the other fields as form fields, `entities` as a
        JSON string) or send a file the bot can see again by `file_id` (JSON
        body). Uploads are checked like the app's: the content must match
        `kind` (photos: JPEG, PNG, GIF or WebP up to 20 MiB), metadata
        (EXIF/GPS) is stripped, photos get thumbnails, and the bot's storage
        quota applies; a file is at most 50 MiB. The same bytes uploaded
        again reuse the stored file. The server never downloads a URL for a
        bot. The text is the caption (up to 1024 characters).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMediaRequest'}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/SendMediaUpload'}
      responses:
        '200': {$ref: '#/components/responses/MessageResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /messages:sendAlbum:
    post:
      tags: [messages, files]
      operationId: sendAlbum
      summary: Sends 2 to 10 files as one album.
      description: |
        Photos and videos mixed, or only documents, or only audio files.
        Each item names a `file_id` or, in a `multipart/form-data` request,
        the part holding its file (`attach`; `items` is then a JSON string
        form field). The messages share `grouped_id`. Upload rules as in
        `messages:sendMedia`; the whole request is at most 50 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendAlbumRequest'}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/SendAlbumUpload'}
      responses:
        '200': {$ref: '#/components/responses/MessagesResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /files/{file_id}:
    get:
      tags: [files]
      operationId: getFile
      summary: A file the bot can see, with a download URL.
      description: |
        The file of a message the bot can see (its own, or in a chat it is
        in, within the history it may see). `url` downloads it with a plain
        GET (Range supported) until `url_expires`, about an hour; it is
        bound to the bot and to that message, so deleting the message for
        everyone or the bot leaving the chat ends it. Ask again for a fresh
        URL.
      parameters:
        - name: file_id
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{22}$'}
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {const: true}
                  result: {$ref: '#/components/schemas/File'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /updates:
    get:
      tags: [updates]
      operationId: getUpdates
      summary: Long poll for updates.
      description: |
        Returns pending updates with `update_id >= offset`, oldest first. A
        request with `offset` acknowledges every update below it, so pass
        the last `update_id + 1`; acknowledged updates are never returned
        again, even for a lower `offset`. When none are pending the request
        waits up to `timeout` seconds for the first one. Only one poll per
        bot runs at a time: a newer request ends the older one with
        `409 conflict`; while the bot has a webhook every poll answers
        `409 conflict`, and setting a webhook ends a waiting poll with it.
        While the server restarts a waiting poll ends with
        an empty list and new polls answer `503 unavailable` with
        `retry_after`. Updates are kept 24 hours (callbacks 15 minutes).
        `update_id` strictly increases per bot.
      parameters:
        - name: offset
          in: query
          description: First update to return; every lower update is acknowledged.
          schema: {type: integer, minimum: 0, maximum: 9007199254740991, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - name: timeout
          in: query
          description: Seconds to wait for the first update; 0 answers at once.
          schema: {type: integer, minimum: 0, maximum: 50, default: 0}
        - name: allowed_updates
          in: query
          description: |
            Comma-separated update kinds to receive from now on (stored, like
            the webhook's `allowed_updates`; empty means every kind but the
            opt-in `reaction`). Absent keeps the current setting. It does not
            filter updates already queued.
          schema: {type: string}
          example: message,callback,reaction
      responses:
        '200':
          description: Pending updates (possibly none).
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {const: true}
                  result:
                    type: array
                    items: {$ref: '#/components/schemas/Update'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /webhook:
    put:
      tags: [updates]
      operationId: setWebhook
      summary: Receive updates at a webhook.
      description: |
        From now on every update is POSTed to `url` (see the `update`
        webhook), a waiting long poll ends with `409 conflict` and further
        polls get it too. The URL must be `https` on port 443, 80 or 8443
        and resolve to public addresses only; private, loopback,
        link-local, CGNAT, multicast, reserved and cloud metadata addresses
        are refused (`400 bad_request`), now and at every connection, so a
        name that later resolves to such an address (DNS rebinding) is not
        reached either. Redirects are not followed. Calling it again
        replaces every setting.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetWebhookRequest'}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [updates]
      operationId: deleteWebhook
      summary: Go back to long poll.
      description: Removes the webhook (also when none is set). Pending updates stay for `GET /updates` unless `drop_pending`.
      parameters:
        - name: drop_pending
          in: query
          description: Drop the pending updates instead of keeping them.
          schema: {type: boolean, default: false}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [updates]
      operationId: getWebhook
      summary: Webhook settings and delivery state.
      responses:
        '200':
          description: The webhook (`url` is empty when the bot polls).
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {const: true}
                  result: {$ref: '#/components/schemas/WebhookInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /callbacks/{callback_id}:answer:
    post:
      tags: [updates]
      operationId: answerCallback
      summary: Answers a button press.
      description: |
        Answers the `callback` update `callback_id`, once. The user's client
        waits up to 10 seconds for the answer and shows `text` as a toast
        (or a dialog with `show_alert`); without an answer it shows that the
        bot is not responding. A press stays answerable for 15 minutes.
      parameters:
        - name: callback_id
          in: path
          required: true
          schema: {type: string, maxLength: 64}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnswerCallbackRequest'}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /commands:
    put:
      tags: [bot]
      operationId: setCommands
      summary: Sets the command menu of one scope.
      description: |
        Replaces the commands of `scope` (default `default`); an empty list
        removes the scope. Clients show the most specific list set:
        `group_admin` (group admins), then `group` or `private`, then
        `default`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetCommandsRequest'}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /chats/{chat_id}:
    get:
      tags: [chats]
      operationId: getChat
      summary: A chat the bot is a member of.
      parameters:
        - name: chat_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200':
          description: The chat.
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {const: true}
                  result: {$ref: '#/components/schemas/Chat'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      tags: [chats]
      operationId: editChat
      summary: Changes the title and/or description of a group or channel.
      description: |
        Needs the permission to change the info (admins; members where the
        group allows it). A new title posts the "title changed" service
        message.
      parameters:
        - name: chat_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditChatRequest'}
      responses:
        '200':
          description: The chat.
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {const: true}
                  result: {$ref: '#/components/schemas/Chat'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /chats/{chat_id}:leave:
    post:
      tags: [chats]
      operationId: leaveChat
      summary: The bot leaves a group or channel.
      description: |
        Its pending updates of the chat are dropped; a `member_changed`
        with status `left` follows. A bot that owns the chat hands it to the
        longest-serving admin and cannot leave without one.
      parameters:
        - name: chat_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /chats/{chat_id}/admins:
    get:
      tags: [chats]
      operationId: getChatAdmins
      summary: The owner and admins of a group or channel.
      parameters:
        - name: chat_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200':
          description: Owner first, then admins by when they joined.
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {const: true}
                  result:
                    type: array
                    items: {$ref: '#/components/schemas/ChatMember'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /chats/{chat_id}/members/{user_id}:
    get:
      tags: [chats]
      operationId: getChatMember
      summary: One member of a group or channel.
      description: A current member, one who left or one who is banned; someone who never joined is `404`. In channels only admins see members.
      parameters:
        - name: chat_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
        - name: user_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok: {const: true}
                  result: {$ref: '#/components/schemas/ChatMember'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /chats/{chat_id}/members/{user_id}:ban:
    post:
      tags: [chats]
      operationId: banChatMember
      summary: Removes a member and bans them (admins).
      description: |
        The user cannot come back (also not by invite link; the links they
        made stop working) until unbanned. Admins can be removed by the
        owner only.
      parameters:
        - name: chat_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
        - name: user_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /chats/{chat_id}/members/{user_id}:unban:
    post:
      tags: [chats]
      operationId: unbanChatMember
      summary: Lifts a ban (admins); the user is not added back.
      parameters:
        - name: chat_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
        - name: user_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /chats/{chat_id}/members/{user_id}:restrict:
    post:
      tags: [chats]
      operationId: restrictChatMember
      summary: Sets what a member may do (admins).
      description: |
        `permissions` is a bitmask; the member's rights are these bits
        within the group's defaults. Admins have every right (demote them
        first in the app).
      parameters:
        - name: chat_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
        - name: user_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestrictRequest'}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /chats/{chat_id}/actions:
    post:
      tags: [chats]
      operationId: sendChatAction
      summary: Shows "đang gõ…" (or sending a photo, …) for the bot.
      description: |
        Users who have the chat open see the action for about 5 seconds or
        until the bot's next message; repeat it while working. The bot must
        be allowed to post there (consent in private chats). More than one
        action a second into one chat is merged. Note: the web app does not
        show actions yet; the API accepts them so bots need no change later.
      parameters:
        - name: chat_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9007199254740991}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatActionRequest'}
      responses:
        '200': {$ref: '#/components/responses/True'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
webhooks:
  update:
    post:
      tags: [updates]
      operationId: receiveUpdate
      summary: An update POSTed to the bot's webhook.
      description: |
        The server POSTs each update (the same object as one item of
        `GET /updates`) to the URL set with `PUT /webhook`.

        - Order: updates of one chat (button presses: of one user) arrive one
          at a time, in `update_id` order; different chats are delivered in
          parallel up to `max_connections`. There is no global order.
        - Success is any 2xx answer within 10 seconds. Anything else (other
          status, redirect, timeout, TLS or connection error) is retried
          after 1 s, doubling per failure up to a random 60 to 120 s, or
          after the answer's `Retry-After` (seconds or HTTP date, clamped to
          1 to 3600 s: `0` or a past date still waits 1 s). After 10 failed attempts the update is dead-lettered
          and the next update of the chat goes on; the bot's owner can
          retry or drop it in the Developer Console. Updates expire after
          24 hours (callbacks 15 minutes).
        - Delivery is at least once: an update can arrive twice (a lost
          answer, a server restart), so deduplicate by `update_id`.
        - After many failures in a row the bot's webhook gets one request at
          a time until one succeeds.
        - Verify each request: `X-Bot-Api-Secret-Token` equals your secret,
          and `X-Bot-Signature` equals `v1=` + hex(HMAC-SHA256(key = secret,
          message = X-Bot-Timestamp + "." + raw body)), compared in constant
          time; reject timestamps more than 5 minutes from your clock.
        - The answer may carry one method to run (WebhookAnswer).
      parameters:
        - name: X-Bot-Api-Secret-Token
          in: header
          required: true
          schema: {type: string}
          description: The secret set with `PUT /webhook`.
        - name: X-Bot-Timestamp
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9]+$'}
          description: Unix seconds when the request was signed.
        - name: X-Bot-Signature
          in: header
          required: true
          schema: {type: string, pattern: '^v1=[0-9a-f]{64}$'}
          description: '`v1=` + hex(HMAC-SHA256(secret, timestamp + "." + body)).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Update'}
      responses:
        '200':
          description: Delivered; the body may name a method to run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookAnswer'}
        '204':
          description: Delivered.
components:
  securitySchemes:
    botToken:
      type: http
      scheme: bearer
      description: The bot token "<bot_id>:<secret>".
  responses:
    'True':
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ok, result]
            properties:
              ok: {const: true}
              result: {const: true}
    MessageResult:
      description: The message.
      content:
        application/json:
          schema:
            type: object
            required: [ok, result]
            properties:
              ok: {const: true}
              result: {$ref: '#/components/schemas/Message'}
    MessagesResult:
      description: The messages, in seq order.
      content:
        application/json:
          schema:
            type: object
            required: [ok, result]
            properties:
              ok: {const: true}
              result:
                type: array
                items: {$ref: '#/components/schemas/Message'}
    BadRequest:
      description: The request is invalid (`bad_request`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unauthorized:
      description: Missing, malformed, unknown or revoked token (`unauthorized`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Forbidden:
      description: |
        `no_consent`: the user has not started a chat with the bot.
        `forbidden`: the bot may not send there (permissions, the user
        blocked the bot, a closed topic).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    NotFound:
      description: Unknown method, chat, message or callback, or the bot is not a member (`not_found`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: |
        A newer getUpdates request of this bot ended this one, or the bot
        has a webhook (`conflict`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    PayloadTooLarge:
      description: The body is larger than 1 MiB, or a multipart body than 50 MiB (`payload_too_large`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    UnsupportedMediaType:
      description: The body is not `application/json` (nor `multipart/form-data` where allowed) (`unsupported_media_type`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: |
        A rate limit was exceeded (`rate_limited`): the bot's tier, the
        address's failed authentications, or the per-address flood limit.
        Retry after `retry_after` seconds.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Unavailable:
      description: |
        The server is restarting or dropped the request (`unavailable`).
        Retry after `retry_after` seconds when given.
      headers:
        Retry-After:
          description: Seconds to wait, when known.
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: {const: false}
        error:
          type: object
          required: [code, description]
          properties:
            code:
              type: string
              description: Stable error code; new codes may be added.
              examples: [bad_request, unauthorized, forbidden, no_consent, not_found, method_not_allowed, conflict,
                payload_too_large, unsupported_media_type, rate_limited, internal, unavailable]
            description:
              type: string
              description: Human-readable detail; do not parse.
            retry_after:
              type: integer
              minimum: 1
              description: Seconds to wait before retrying (`rate_limited`, and `unavailable` when known).
    Id:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    User:
      type: object
      required: [id, is_bot, name]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        is_bot: {type: boolean}
        name: {type: string}
        username:
          type: string
          description: Unique in the tenant; absent when the user has none.
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [privacy, tier]
          properties:
            privacy:
              type: boolean
              description: Privacy mode in groups (default on).
            tier:
              type: string
              enum: [new, default, verified, internal, restricted]
            description: {type: string}
            about: {type: string}
    Chat:
      type: object
      required: [id, type]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        type:
          type: string
          description: New chat types may be added.
          examples: [private, group, channel]
        title:
          type: string
          description: Groups and channels.
        about: {type: string}
        member_count: {type: integer}
        forum:
          type: boolean
          description: The group has topics; messages carry topic_id.
        user:
          $ref: '#/components/schemas/User'
          description: Private chats; the user the bot talks to.
    EntityType:
      type: string
      enum: [bold, italic, underline, strike, spoiler, code, pre, text_link, mention, mention_name, hashtag, url, email,
        bot_command]
    Entity:
      type: object
      required: [type, offset, length]
      properties:
        type: {$ref: '#/components/schemas/EntityType'}
        offset:
          type: integer
          minimum: 0
          description: UTF-16 code units.
        length:
          type: integer
          minimum: 1
          description: UTF-16 code units.
        url:
          type: string
          description: text_link only.
        user_id:
          $ref: '#/components/schemas/Id'
          description: mention_name only.
        language:
          type: string
          maxLength: 32
          description: pre only.
    InlineButton:
      type: object
      required: [text]
      description: Exactly one of callback_data and url.
      properties:
        text: {type: string, minLength: 1, maxLength: 64}
        callback_data:
          type: string
          description: 1 to 64 bytes, sent back in the callback update when pressed.
        url:
          type: string
          maxLength: 2048
          description: Opened by the client (http, https, mailto or the app scheme).
    KeyboardButton:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 64
          description: Sent as the user's message when pressed.
    ReplyMarkup:
      description: Exactly one of inline_keyboard, keyboard and remove_keyboard.
      oneOf:
        - type: object
          title: InlineKeyboardMarkup
          required: [inline_keyboard]
          properties:
            inline_keyboard:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: array
                minItems: 1
                maxItems: 8
                items: {$ref: '#/components/schemas/InlineButton'}
        - type: object
          title: ReplyKeyboardMarkup
          required: [keyboard]
          properties:
            keyboard:
              type: array
              minItems: 1
              maxItems: 12
              items:
                type: array
                minItems: 1
                maxItems: 12
                items: {$ref: '#/components/schemas/KeyboardButton'}
            resize: {type: boolean}
            one_time: {type: boolean}
            placeholder: {type: string, maxLength: 64}
            selective:
              type: boolean
              description: Only for users mentioned in the text and the author of the replied-to message.
        - type: object
          title: ReplyKeyboardRemove
          required: [remove_keyboard]
          properties:
            remove_keyboard: {const: true}
            selective: {type: boolean}
    Media:
      type: object
      required: [kind]
      description: The file of a media message.
      properties:
        kind:
          type: string
          examples: [photo, video, audio, voice, document]
        file_id:
          type: string
          description: Read it with `GET /files/{file_id}` or send it again (`messages:sendMedia`).
        mime_type: {type: string}
        size: {type: integer}
        file_name: {type: string}
        width: {type: integer}
        height: {type: integer}
        duration:
          type: integer
          description: Milliseconds.
    Action:
      type: object
      required: [type]
      description: Service message.
      properties:
        type:
          type: string
          description: New types may be added; unknown ones arrive as "other".
          examples: [chat_created, members_added, member_left, member_removed, title_changed, photo_changed,
            photo_removed, message_pinned, joined_by_invite, other]
        user_ids:
          type: array
          items: {$ref: '#/components/schemas/Id'}
        title: {type: string}
        seq: {$ref: '#/components/schemas/Id'}
    ForwardFrom:
      type: object
      required: [date]
      properties:
        user_id: {$ref: '#/components/schemas/Id'}
        chat_id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        date: {type: integer}
    Message:
      type: object
      required: [chat, seq, date]
      properties:
        chat: {$ref: '#/components/schemas/Chat'}
        seq: {$ref: '#/components/schemas/Id'}
        from:
          $ref: '#/components/schemas/User'
          description: Absent for messages of incoming webhooks and the server.
        date:
          type: integer
          description: Unix seconds.
        topic_id: {$ref: '#/components/schemas/Id'}
        text:
          type: string
          description: The text, or the caption of a media message.
        entities:
          type: array
          items: {$ref: '#/components/schemas/Entity'}
        reply_to_seq: {$ref: '#/components/schemas/Id'}
        edit_date:
          type: integer
          description: Unix seconds of the last edit.
        reply_markup: {$ref: '#/components/schemas/ReplyMarkup'}
        media: {$ref: '#/components/schemas/Media'}
        action: {$ref: '#/components/schemas/Action'}
        forward_from: {$ref: '#/components/schemas/ForwardFrom'}
        integration_label:
          type: string
          description: Name of the incoming webhook that posted the message.
        random_id:
          type: integer
          description: Echoed to the sender only.
        grouped_id:
          type: integer
          description: Shared by the messages of one album.
    Callback:
      type: object
      required: [id, from, message, data]
      properties:
        id:
          type: string
          description: Pass to answerCallback.
        from: {$ref: '#/components/schemas/User'}
        message:
          $ref: '#/components/schemas/Message'
          description: The bot's message whose button was pressed.
        data:
          type: string
          description: callback_data of the pressed button.
    Update:
      type: object
      required: [update_id]
      description: |
        Exactly one update kind besides update_id. Version 1.0 sends
        `message` (new messages in private chats and groups the bot is in;
        in groups with privacy mode only commands addressed to the bot,
        replies to its messages and service messages; never the bot's own
        messages nor messages of other bots), `channel_post` (new posts of
        channels where the bot is an admin), `message_edited` (the author
        edited the message or post; server-side changes such as an attached
        link preview are not edits) and `callback` (a press of the bot's
        button on a message that still exists). Version 1.1 adds
        `member_changed` (the bot's own membership: added, also when a group
        is created with it, removed, left, promoted, demoted or restricted)
        and `reaction` (a person set, changed or removed a reaction on one of
        the bot's messages; opt-in: only when `allowed_updates` lists it).
        When the bot leaves or is removed from a chat, its pending updates
        of that chat are dropped, except the `member_changed` telling it so.
        Later versions add kinds; ignore unknown ones.
      properties:
        update_id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        message: {$ref: '#/components/schemas/Message'}
        channel_post: {$ref: '#/components/schemas/Message'}
        message_edited: {$ref: '#/components/schemas/Message'}
        callback: {$ref: '#/components/schemas/Callback'}
        member_changed: {$ref: '#/components/schemas/MemberChanged'}
        reaction: {$ref: '#/components/schemas/Reaction'}
      minProperties: 2
      maxProperties: 2
    UpdateKind:
      type: string
      enum: [message, message_edited, channel_post, callback, member_changed, reaction]
    ChatMember:
      type: object
      required: [user, status, permissions]
      properties:
        user: {$ref: '#/components/schemas/User'}
        status:
          type: string
          description: New statuses may be added.
          examples: [owner, admin, member, left, banned]
        permissions:
          type: integer
          minimum: 0
          description: |
            Effective rights as a bitmask: 1 send messages, 2 send media, 4
            add members, 8 pin messages, 16 change the chat's info, 32 manage
            topics. 0 for former members.
    MemberChanged:
      type: object
      required: [chat, date, member]
      properties:
        chat: {$ref: '#/components/schemas/Chat'}
        from:
          $ref: '#/components/schemas/User'
          description: Who made the change; absent when the moderators did.
        date:
          type: integer
          description: Unix seconds.
        member:
          $ref: '#/components/schemas/ChatMember'
          description: The bot itself, after the change.
    Reaction:
      type: object
      required: [chat, seq, user, emoji, date]
      properties:
        chat: {$ref: '#/components/schemas/Chat'}
        seq: {$ref: '#/components/schemas/Id'}
        user: {$ref: '#/components/schemas/User'}
        emoji:
          type: string
          description: |
            The user's reaction when the update was made; empty when removed.
            Quick changes may arrive as several updates with the latest state.
        date:
          type: integer
          description: Unix seconds.
    File:
      type: object
      required: [file_id, kind, size, url, url_expires]
      properties:
        file_id: {type: string}
        kind:
          type: string
          examples: [photo, video, audio, voice, document]
        mime_type: {type: string}
        size: {type: integer, minimum: 0}
        file_name: {type: string}
        width: {type: integer}
        height: {type: integer}
        duration:
          type: integer
          description: Milliseconds.
        url:
          type: string
          description: Plain GET download (Range supported), no token header needed.
        url_expires:
          type: integer
          description: Unix seconds when url stops working.
    MessageRef:
      type: object
      required: [chat_id, seq]
      additionalProperties: false
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        seq: {$ref: '#/components/schemas/Id'}
    EditMessageRequest:
      type: object
      required: [chat_id, seq, text]
      additionalProperties: false
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        seq: {$ref: '#/components/schemas/Id'}
        text:
          type: string
          description: The new text (caption of a media message; may be empty there).
        entities:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Entity'}
        parse_mode:
          type: string
          enum: [markdown, html]
        reply_markup:
          $ref: '#/components/schemas/ReplyMarkup'
          description: An inline_keyboard only; absent keeps the keyboard.
        disable_link_preview: {type: boolean}
    EditMarkupRequest:
      type: object
      required: [chat_id, seq]
      additionalProperties: false
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        seq: {$ref: '#/components/schemas/Id'}
        reply_markup:
          $ref: '#/components/schemas/ReplyMarkup'
          description: An inline_keyboard only; absent removes the keyboard.
    DeleteMessagesRequest:
      type: object
      required: [chat_id, seqs]
      additionalProperties: false
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        seqs:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/Id'}
    ForwardMessagesRequest:
      type: object
      required: [from_chat_id, seqs, chat_id]
      additionalProperties: false
      properties:
        from_chat_id: {$ref: '#/components/schemas/Id'}
        seqs:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/Id'}
        chat_id: {$ref: '#/components/schemas/Id'}
        topic_id: {$ref: '#/components/schemas/Id'}
        random_ids:
          type: array
          description: One dedupe key per seq.
          items: {type: integer, minimum: 0, maximum: 9007199254740991}
    CopyMessageRequest:
      type: object
      required: [from_chat_id, seq, chat_id]
      additionalProperties: false
      properties:
        from_chat_id: {$ref: '#/components/schemas/Id'}
        seq: {$ref: '#/components/schemas/Id'}
        chat_id: {$ref: '#/components/schemas/Id'}
        topic_id: {$ref: '#/components/schemas/Id'}
        text:
          type: string
          description: Replaces the text or caption; absent keeps it.
        entities:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Entity'}
        parse_mode:
          type: string
          enum: [markdown, html]
        reply_to_seq: {$ref: '#/components/schemas/Id'}
        random_id: {type: integer, minimum: 0, maximum: 9007199254740991}
    ReactRequest:
      type: object
      required: [chat_id, seq, emoji]
      additionalProperties: false
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        seq: {$ref: '#/components/schemas/Id'}
        emoji:
          type: string
          maxLength: 32
          description: One emoji; empty removes the bot's reaction.
    MediaKind:
      type: string
      enum: [photo, video, audio, voice, document]
    SendMediaRequest:
      type: object
      required: [chat_id, file_id]
      additionalProperties: false
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        topic_id: {$ref: '#/components/schemas/Id'}
        file_id:
          type: string
          description: A file the bot can see (Media.file_id); it keeps its kind.
        text:
          type: string
          description: Caption.
        entities:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Entity'}
        parse_mode:
          type: string
          enum: [markdown, html]
        reply_to_seq: {$ref: '#/components/schemas/Id'}
        random_id: {type: integer, minimum: 0, maximum: 9007199254740991}
    SendMediaUpload:
      type: object
      required: [chat_id, kind, file]
      additionalProperties: false
      description: Form fields; entities is a JSON string.
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        topic_id: {$ref: '#/components/schemas/Id'}
        kind: {$ref: '#/components/schemas/MediaKind'}
        file:
          type: string
          contentMediaType: application/octet-stream
          description: The file; its part's filename becomes file_name.
        text: {type: string}
        entities: {type: string}
        parse_mode:
          type: string
          enum: [markdown, html]
        reply_to_seq: {$ref: '#/components/schemas/Id'}
        random_id: {type: integer, minimum: 0, maximum: 9007199254740991}
    AlbumItem:
      type: object
      additionalProperties: false
      description: Exactly one of file_id and attach.
      properties:
        file_id: {type: string}
        attach:
          type: string
          description: Name of the multipart part holding the file.
        kind:
          $ref: '#/components/schemas/MediaKind'
          description: Required with attach.
        text: {type: string}
        entities:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Entity'}
        parse_mode:
          type: string
          enum: [markdown, html]
        random_id: {type: integer, minimum: 0, maximum: 9007199254740991}
    SendAlbumRequest:
      type: object
      required: [chat_id, items]
      additionalProperties: false
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        topic_id: {$ref: '#/components/schemas/Id'}
        reply_to_seq: {$ref: '#/components/schemas/Id'}
        items:
          type: array
          minItems: 2
          maxItems: 10
          items: {$ref: '#/components/schemas/AlbumItem'}
    SendAlbumUpload:
      type: object
      required: [chat_id, items]
      description: Form fields (items is a JSON string of AlbumItem) plus one part per attached file.
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        topic_id: {$ref: '#/components/schemas/Id'}
        reply_to_seq: {$ref: '#/components/schemas/Id'}
        items: {type: string}
    EditChatRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 128}
        about: {type: string, maxLength: 255}
    RestrictRequest:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: integer
          minimum: 0
          maximum: 63
          description: Bitmask as in ChatMember.permissions.
    ChatActionRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [typing, upload_photo, upload_video, upload_document, record_voice, cancel]
        topic_id: {$ref: '#/components/schemas/Id'}
    SetWebhookRequest:
      type: object
      required: [url, secret]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: https URL on port 443, 80 or 8443, without credentials or fragment.
        secret:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,256}$'
          description: |
            Sent back in `X-Bot-Api-Secret-Token` and the HMAC key of
            `X-Bot-Signature`. Stored encrypted; never returned.
        allowed_updates:
          type: array
          items: {$ref: '#/components/schemas/UpdateKind'}
          description: |
            Kinds to receive; empty or absent means every kind except the
            opt-in `reaction`. Applies to updates created from now on, not
            to queued ones. Removing the webhook resets it (a polling bot
            sets it with `GET /updates?allowed_updates=`).
        max_connections:
          type: integer
          minimum: 1
          maximum: 100
          default: 40
          description: Parallel requests (one per chat at a time).
        drop_pending:
          type: boolean
          description: Drop the pending updates instead of delivering them.
    WebhookInfo:
      type: object
      required: [url, pending_update_count, dead_letter_count, max_connections, allowed_updates, open_connections]
      properties:
        url:
          type: string
          description: Empty when the bot polls.
        pending_update_count: {type: integer, minimum: 0}
        dead_letter_count:
          type: integer
          minimum: 0
          description: Updates given up after 10 attempts (the bot's owner retries or drops them in the Developer Console).
        max_connections: {type: integer, minimum: 1, maximum: 100}
        allowed_updates:
          type: array
          items: {$ref: '#/components/schemas/UpdateKind'}
        open_connections:
          type: integer
          minimum: 0
          description: Requests in flight now.
        last_error:
          type: string
          description: |
            Reason of the newest failed attempt: `http_<status>`, `timeout`,
            `tls`, `connect`, `dns`, `blocked_address`, `invalid_url` or
            `secret_unreadable` (set the webhook again).
          examples: [http_502, timeout]
        last_error_message:
          type: string
          description: Human-readable last_error; do not parse.
        last_error_date:
          type: integer
          description: Unix seconds of last_error.
        last_success_date:
          type: integer
          description: Unix seconds of the newest 2xx answer.
    WebhookAnswer:
      description: |
        Optional body of the webhook's 2xx answer: a method the server runs
        as the bot right after the delivery, with the same checks and rate
        limits as calling it. Its result is not reported; errors are
        ignored. The `random_id` of `sendMessage` is replaced by one derived
        from the bot and the update, so a redelivered update never sends
        the reply twice. Any other body (empty, `{}`, `{"ok": true}`) is no
        action, and so is a body over 64 KiB (the delivery still counts).
      oneOf:
        - type: object
          required: [method, chat_id, text]
          description: '`method` plus the fields of SendMessageRequest.'
          properties:
            method: {const: sendMessage}
            chat_id: {$ref: '#/components/schemas/Id'}
            text: {type: string}
        - type: object
          required: [method, callback_id]
          additionalProperties: false
          properties:
            method: {const: answerCallback}
            callback_id: {type: string}
            text: {type: string, maxLength: 200}
            show_alert: {type: boolean}
            url: {type: string, maxLength: 2048}
    SendMessageRequest:
      type: object
      required: [chat_id, text]
      additionalProperties: false
      properties:
        chat_id: {$ref: '#/components/schemas/Id'}
        topic_id:
          $ref: '#/components/schemas/Id'
          description: Forum groups; default General.
        text:
          type: string
          description: Up to 4096 characters after parsing.
        entities:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Entity'}
          description: Exclusive with parse_mode.
        parse_mode:
          type: string
          enum: [markdown, html]
          description: See format.md.
        reply_to_seq: {$ref: '#/components/schemas/Id'}
        reply_markup: {$ref: '#/components/schemas/ReplyMarkup'}
        random_id:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Dedupe key; 0 or absent disables dedupe.
        disable_link_preview: {type: boolean}
    AnswerCallbackRequest:
      type: object
      additionalProperties: false
      properties:
        text: {type: string, maxLength: 200}
        show_alert: {type: boolean}
        url:
          type: string
          maxLength: 2048
          description: Opened by the client (http, https, mailto or the app scheme).
    Command:
      type: object
      required: [command, description]
      properties:
        command:
          type: string
          pattern: '^/?[A-Za-z0-9_]{1,32}$'
          description: Stored lowercase without the slash.
        description: {type: string, minLength: 1, maxLength: 256}
    SetCommandsRequest:
      type: object
      required: [commands]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [default, private, group, group_admin]
          default: default
        commands:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Command'}
