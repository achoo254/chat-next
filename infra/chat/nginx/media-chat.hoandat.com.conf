# media-chat.hoandat.com: the media host (downloads of message files and
# upload parts). Files live in MEDIA_ROOT (/opt/chat/media, chat:chat 0750)
# and are streamed by the app after it checks the token and that the
# message still carries the file; nginx never reads the directory (no
# X-Accel-Redirect: that would need nginx's user in the chat group and a
# second path to keep in sync, for a speed the R3 load does not need).
# Cloudflare proxied, SSL full with the Let's Encrypt certificate in
# /etc/letsencrypt/live/media-chat.hoandat.com/. A first-level host of
# hoandat.com so Cloudflare's free certificate covers it; before the public
# launch (R9) media moves to a separately registered domain (ADR 0010),
# which only changes this file, the certificate and MEDIA_PUBLIC_URL.
#
# activate-release.sh installs this file only when that certificate
# exists. The app answers here only on /f/, /u/ and /healthz (it routes by
# Host); everything else is 404 at nginx already. No cookies in either
# direction: the signed token in the path is the only credential, so it is
# redacted from the access log and the error log is off for those paths.
limit_req_zone $binary_remote_addr zone=chat_media:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=chat_media_upload:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=chat_media_conn:10m;
map $uri $chat_media_uri {
	"~^/(?<chat_media_kind>[fu])/" "/$chat_media_kind/[token]";
	default $uri;
}
log_format chat_media '$remote_addr - [$time_local] "$request_method $chat_media_uri $server_protocol" '
	'$status $body_bytes_sent $request_time "$http_range"';

server {
	listen 80;
	listen [::]:80;
	server_name media-chat.hoandat.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name media-chat.hoandat.com;

	ssl_certificate     /etc/letsencrypt/live/media-chat.hoandat.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/media-chat.hoandat.com/privkey.pem;

	access_log /var/log/nginx/media-chat.hoandat.com.access.log chat_media;
	error_log  /var/log/nginx/media-chat.hoandat.com.error.log warn;

	client_max_body_size 1k;

	# The app sets nosniff, CSP sandbox, CORP and CORS on its answers;
	# these cover nginx's own errors too.
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options nosniff always;
	add_header Content-Security-Policy "default-src 'none'; sandbox" always;
	add_header Referrer-Policy no-referrer always;

	location = /healthz {
		limit_req zone=chat_media burst=20 nodelay;
		proxy_pass http://127.0.0.1:4600;
		proxy_set_header Host $host;
		access_log off;
	}

	# Downloads: GET/HEAD with Range, streamed (no buffering to disk), a
	# 2 GB video may take a while. The app answers 403 for an expired token
	# (the client asks for a fresh URL) and 404 once access is revoked.
	location ^~ /f/ {
		limit_except GET OPTIONS { deny all; }
		limit_req zone=chat_media burst=400 nodelay;
		limit_conn chat_media_conn 64;
		error_log /dev/null;
		proxy_pass http://127.0.0.1:4600;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Cookie "";
		proxy_hide_header Set-Cookie;
		proxy_buffering off;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
	}

	# Upload parts: one part per request, 8 MiB in practice
	# (below Cloudflare's 100 MB request limit), streamed to the app.
	location ^~ /u/ {
		limit_except PUT OPTIONS { deny all; }
		limit_req zone=chat_media_upload burst=60 nodelay;
		limit_conn chat_media_conn 64;
		client_max_body_size 16m;
		client_body_timeout 120s;
		error_log /dev/null;
		proxy_pass http://127.0.0.1:4600;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Cookie "";
		proxy_hide_header Set-Cookie;
		proxy_request_buffering off;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	location / {
		return 404;
	}
}
