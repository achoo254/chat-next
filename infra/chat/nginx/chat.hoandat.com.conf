# chat.hoandat.com (Cloudflare proxied, SSL full with a Let's Encrypt
# certificate). Each release carries this file; activate-release.sh installs
# it as /etc/nginx/conf.d/chat.hoandat.com.conf. Client IPs come from the
# Cloudflare real-IP settings already at the http level on this server.
server {
	listen 80;
	listen [::]:80;
	server_name chat.hoandat.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name chat.hoandat.com;

	ssl_certificate     /etc/letsencrypt/live/chat.hoandat.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/chat.hoandat.com/privkey.pem;

	access_log /var/log/nginx/chat.hoandat.com.access.log chat;
	error_log  /var/log/nginx/chat.hoandat.com.error.log warn;

	client_max_body_size 1m;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options DENY always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self' https://auth.hoandat.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

	root /opt/chat/current/web;

	location = /healthz {
		proxy_pass http://127.0.0.1:4600;
		access_log off;
	}

	location /auth/ {
		limit_req zone=chat_auth burst=20 nodelay;
		proxy_pass http://127.0.0.1:4600;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
	}

	location /rpc/ {
		limit_req zone=chat_rpc burst=100 nodelay;
		proxy_pass http://127.0.0.1:4600;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
	}

	# Hashed build assets never change; index.html must always revalidate.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options nosniff always;
		try_files $uri =404;
	}

	location / {
		add_header Cache-Control "no-cache" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options DENY always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self' https://auth.hoandat.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
		try_files $uri /index.html;
	}
}
