# chat.hoandat.com (Cloudflare proxied, SSL full with a Let's Encrypt
# certificate). Each release carries this file; activate-release.sh installs
# it as /etc/nginx/conf.d/chat.hoandat.com.conf. Client IPs come from the
# Cloudflare real-IP settings already at the http level on this server.
#
# The CSP lets the app show, fetch and upload media on the media host
# (media-chat.hoandat.com, MEDIA_PUBLIC_URL). Moving media to S3 with
# MEDIA_UPLOAD_MODE=direct needs the storage origin in connect-src too.
#
# Realtime handshakes have their own zone, declared here (this file is
# included at the http level) so a release brings it without touching
# chat-http.conf: a reconnect storm after a deploy, or many sockets behind
# one office NAT, must not use up the sign-in budget of /auth/, nor the
# other way round. Do not declare chat_ws again in chat-http.conf.
limit_req_zone $binary_remote_addr zone=chat_ws:10m rate=10r/s;

# Incoming webhooks (POST /hook/<id>/<secret>[/<format>]) have their own zone
# too, declared here for the same reason: an alert storm from one monitoring
# server must not use up /rpc, and the other way round. The app also limits
# each hook. The path carries the hook's secret, so these requests are logged
# with the secret replaced (the chat log_format logs $uri), and nginx's error
# log, which copies the request line, is off for them (the app logs failures
# with the hook id only).
limit_req_zone $binary_remote_addr zone=chat_hook:10m rate=50r/s;
map $uri $chat_hook_uri {
	"~^/hook/(?<chat_hook_id>[A-Za-z0-9_]{1,32})/[^/]*(?<chat_hook_format>/[a-z]{1,16})?$" "/hook/$chat_hook_id/[redacted]$chat_hook_format";
	default "/hook/[redacted]";
}
log_format chat_hook '$remote_addr - [$time_local] "$request_method $chat_hook_uri $server_protocol" '
	'$status $body_bytes_sent $request_time "$http_user_agent"';

# Bot API (https://chat.hoandat.com/bot/v1/...) has its own zone too, for the
# same reason: a busy bot server must not use up /rpc, nor the other way
# round. The app limits each bot by tier (default 30, verified 100, internal
# 500 calls/s with bursts up to 1000) and refuses addresses with too many
# failed tokens. This per-address limit only stops floods: it sits above the
# highest tier so the app's per-bot limits decide, also for several bots on
# one host. Bots that together need more than 600 calls/s from one address
# need separate addresses. The token travels only in the Authorization
# header, which no log format of this server records (the chat format logs
# $uri only).
limit_req_zone $binary_remote_addr zone=chat_bot:10m rate=600r/s;
# Uploads (messages:send*, up to 51 MiB) stream to the app, which reads a
# body only after the token checks out: no unauthenticated body is spooled
# to disk, and one address holds at most this many uploads at once.
limit_conn_zone $binary_remote_addr zone=chat_bot_upload:10m;

# Back-channel logout is unauthenticated until the app verifies the logout
# token, and a token with a bad signature makes the app fetch the IdP's
# keys again: a loose per-address limit. The IdP sends a mass sign-out from
# one address, so the burst is large.
limit_req_zone $binary_remote_addr zone=chat_logout:10m rate=20r/s;

server {
	listen 80;
	listen [::]:80;
	server_name chat.hoandat.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name chat.hoandat.com;

	ssl_certificate     /etc/letsencrypt/live/chat.hoandat.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/chat.hoandat.com/privkey.pem;

	access_log /var/log/nginx/chat.hoandat.com.access.log chat;
	error_log  /var/log/nginx/chat.hoandat.com.error.log warn;

	# The visitor's address, for every per-address limit here and in the app
	# (X-Real-IP): a host proxied by Cloudflare (a tenant may be, ADR 0010)
	# is reached from Cloudflare's ranges with the visitor in
	# CF-Connecting-IP, and a Flexible SSL request reaches this block again on
	# loopback (00-tenants-http.conf of hoandat-auth). Declared here so that
	# it does not depend on other apps' http-level configuration. Ranges:
	# https://www.cloudflare.com/ips (same list as hoandat-auth's
	# src/tenants/cloudflare-ips.ts).
	set_real_ip_from 127.0.0.1;
	set_real_ip_from 173.245.48.0/20;
	set_real_ip_from 103.21.244.0/22;
	set_real_ip_from 103.22.200.0/22;
	set_real_ip_from 103.31.4.0/22;
	set_real_ip_from 141.101.64.0/18;
	set_real_ip_from 108.162.192.0/18;
	set_real_ip_from 190.93.240.0/20;
	set_real_ip_from 188.114.96.0/20;
	set_real_ip_from 197.234.240.0/22;
	set_real_ip_from 198.41.128.0/17;
	set_real_ip_from 162.158.0.0/15;
	set_real_ip_from 104.16.0.0/13;
	set_real_ip_from 104.24.0.0/14;
	set_real_ip_from 172.64.0.0/13;
	set_real_ip_from 131.0.72.0/22;
	set_real_ip_from 2400:cb00::/32;
	set_real_ip_from 2606:4700::/32;
	set_real_ip_from 2803:f800::/32;
	set_real_ip_from 2405:b500::/32;
	set_real_ip_from 2405:8100::/32;
	set_real_ip_from 2a06:98c0::/29;
	set_real_ip_from 2c0f:f248::/32;
	real_ip_header CF-Connecting-IP;

	client_max_body_size 1m;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options DENY always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://media-chat.hoandat.com; media-src 'self' blob: https://media-chat.hoandat.com; style-src 'self'; font-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' wss://chat.hoandat.com https://media-chat.hoandat.com; form-action 'self' https://auth.hoandat.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

	root /opt/chat/current/web;

	# Public, but each request pings the database: rate-limited.
	location = /healthz {
		limit_req zone=chat_rpc burst=20 nodelay;
		proxy_pass http://127.0.0.1:4600;
		access_log off;
	}

	# Called by the IdP's server, many times at once on a mass sign-out; the
	# logout token is verified by the app. The limit (chat_logout) only stops
	# floods.
	location = /auth/backchannel-logout {
		limit_req zone=chat_logout burst=1000 nodelay;
		proxy_pass http://127.0.0.1:4600;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
	}

	# Sign-in pages carry codes and states: no referrer at all. The app sets
	# its own Referrer-Policy; hide it so only this one is sent.
	location /auth/ {
		limit_req zone=chat_auth burst=20 nodelay;
		# nginx copies the request line, with the callback's code and state,
		# into the error log on an upstream error: none for these pages.
		error_log /dev/null;
		proxy_pass http://127.0.0.1:4600;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_hide_header Referrer-Policy;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options DENY always;
		add_header Referrer-Policy no-referrer always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://media-chat.hoandat.com; media-src 'self' blob: https://media-chat.hoandat.com; style-src 'self'; font-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' wss://chat.hoandat.com https://media-chat.hoandat.com; form-action 'self' https://auth.hoandat.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
	}

	# Realtime WebSocket, served by the gateway inside chat-api (same session
	# cookie and Origin checks as /rpc). Handshakes are rate limited in their
	# own zone with room for every client behind one address reconnecting
	# at once; the gateway also caps sockets per session and per user. An
	# open socket carries the app's 25 s heartbeat, so 75 s of silence means
	# a dead client. Cloudflare proxies WebSockets as is.
	location = /ws {
		limit_req zone=chat_ws burst=200 nodelay;
		proxy_pass http://127.0.0.1:4600;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_read_timeout 75s;
		proxy_send_timeout 75s;
		proxy_buffering off;
	}

	# Incoming webhooks: called by tools (Alertmanager, Grafana, GitLab,
	# Uptime Kuma, Jenkins, scripts) without cookies or Origin; the hook id
	# and secret in the path are the only credentials, and the app answers
	# only on this host. Bodies up to 64 KiB are the app's limit (it answers
	# 413 itself and counts it); nginx stops anything far larger.
	location ^~ /hook/ {
		limit_req zone=chat_hook burst=200 nodelay;
		limit_except POST { deny all; }
		client_max_body_size 128k;
		access_log /var/log/nginx/chat.hoandat.com.access.log chat_hook;
		error_log /dev/null;
		proxy_pass http://127.0.0.1:4600;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Cookie "";
		proxy_hide_header Set-Cookie;
		proxy_read_timeout 15s;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options nosniff always;
	}

	# Bot API: called by bot servers with "Authorization: Bearer <token>",
	# never with cookies. getUpdates long polls hold a request for up to 50 s,
	# so reads wait 65 s. Bodies are JSON up to 1 MiB (the app's limit).
	# The app checks methods itself (405 method_not_allowed in the JSON
	# envelope); the flood limit answers in the same envelope.
	location ^~ /bot/ {
		limit_req zone=chat_bot burst=1200 nodelay;
		limit_req_status 429;
		error_page 429 = @bot_rate_limited;
		client_max_body_size 1m;
		proxy_pass http://127.0.0.1:4600;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Cookie "";
		proxy_hide_header Set-Cookie;
		proxy_read_timeout 65s;
		proxy_send_timeout 65s;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options nosniff always;
	}

	# Bot API file sends (POST /bot/v1/messages:sendMedia and :sendAlbum):
	# the same as /bot/ but multipart bodies up to 50 MiB (the app's limit,
	# it answers 413 in its envelope; nginx stops anything far larger) and
	# more time to receive them. The longer prefix wins over /bot/.
	location ^~ /bot/v1/messages:send {
		limit_req zone=chat_bot burst=1200 nodelay;
		limit_req_status 429;
		error_page 429 = @bot_rate_limited;
		client_max_body_size 51m;
		client_body_timeout 120s;
		proxy_request_buffering off;
		limit_conn chat_bot_upload 8;
		proxy_pass http://127.0.0.1:4600;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Cookie "";
		proxy_hide_header Set-Cookie;
		proxy_read_timeout 65s;
		proxy_send_timeout 120s;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options nosniff always;
	}

	location @bot_rate_limited {
		default_type application/json;
		add_header Retry-After 1 always;
		add_header Cache-Control no-store always;
		return 429 '{"ok":false,"error":{"code":"rate_limited","description":"too many requests from this address; retry later","retry_after":1}}\n';
	}

	location /rpc/ {
		limit_req zone=chat_rpc burst=100 nodelay;
		proxy_pass http://127.0.0.1:4600;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
	}

	# Hashed build assets never change; index.html must always revalidate.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options nosniff always;
		try_files $uri =404;
	}

	# The app shell's service worker. A missing file is a 404, never
	# index.html: the browser would fail the update on the MIME type and
	# keep the worker it has. A kill-switch worker put at
	# /opt/chat/sw-override/sw.js wins over the release's own and survives
	# deploys (docs/deployment-guide.md, "Service worker: kill switch").
	# The worker runs under the CSP of this response.
	location = /sw.js {
		root /opt/chat;
		try_files /sw-override/sw.js /current/web/sw.js =404;
		add_header Cache-Control "no-cache" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options nosniff always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://media-chat.hoandat.com; media-src 'self' blob: https://media-chat.hoandat.com; style-src 'self'; font-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' wss://chat.hoandat.com https://media-chat.hoandat.com; form-action 'self' https://auth.hoandat.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
	}

	location / {
		add_header Cache-Control "no-cache" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options nosniff always;
		add_header X-Frame-Options DENY always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://media-chat.hoandat.com; media-src 'self' blob: https://media-chat.hoandat.com; style-src 'self'; font-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' wss://chat.hoandat.com https://media-chat.hoandat.com; form-action 'self' https://auth.hoandat.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
		try_files $uri /index.html;
	}
}
