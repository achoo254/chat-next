# http-level settings of chat (installed once by setup-server.sh as
# /etc/nginx/conf.d/chat-http.conf). Access log without query strings, so the
# OIDC `code`/`state` of /auth/callback never reach a log file.
log_format chat '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
	'$status $body_bytes_sent $request_time "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=chat_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chat_rpc:10m rate=50r/s;
