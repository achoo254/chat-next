# Protobuf contract between clients and server (source of truth).
# Files live under app/v1 so the import path is "app/v1/<domain>.proto".
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # Sign-in sessions are listed and ended only at the IdP (ADR 0006,
  # 13/11/2026): ListSessions, RevokeSession, RevokeOtherSessions and their
  # messages go on purpose. Remove this block in the commit after the one
  # that drops them.
  ignore_only:
    MESSAGE_NO_DELETE:
      - app/v1/auth.proto
    RPC_NO_DELETE:
      - app/v1/auth.proto
