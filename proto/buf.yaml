# Protobuf contract between clients and server (source of truth).
# Files live under app/v1 so the import path is "app/v1/<domain>.proto".
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # The per-account Zalo send switch is removed on purpose: Zalo is two-way on connect, like Telegram.
  # Drop these entries once the release that removes it is the baseline.
  ignore_only:
    FIELD_NO_DELETE:
      - app/v1/bridge.proto
    MESSAGE_NO_DELETE:
      - app/v1/bridge.proto
    RPC_NO_DELETE:
      - app/v1/bridge.proto
