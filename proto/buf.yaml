# Protobuf contract between clients and server (source of truth).
# Files live under app/v1 so the import path is "app/v1/<domain>.proto".
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # Remote protocol 2 drops the old pairing fields on purpose.
  ignore_only:
    FIELD_NO_DELETE:
      - remote/v1/remote.proto
    ENUM_VALUE_NO_DELETE:
      - remote/v1/remote.proto
