syntax = "proto3";

package app.v1;

import "app/v1/users.proto";

option go_package = "app.local/server/gen/app/v1;appv1";

// ID convention (ADR 0001): every int64 field marked [jstype = JS_NUMBER]
// always holds a value < 2^53; the server asserts the bound when serializing.
//
// Sign-in happens only at the tenant's IdP (ADR 0006): there is no password,
// email, OTP or 2FA RPC. Web signs in through HTTP routes (/auth/login,
// /auth/callback, /auth/logout, /auth/backchannel-logout) and holds its chat
// session in an HttpOnly cookie. Native apps run Code + PKCE in the system
// browser and exchange the code here. IdP tokens never reach any client.

// Chat sessions bound to an IdP grant.
service AuthService {
  // IdP parameters a native client needs to start Code + PKCE for the tenant
  // selected by Host.
  rpc GetAuthConfig(GetAuthConfigRequest) returns (GetAuthConfigResponse);
  // Exchanges a native authorization code at the tenant's token endpoint and
  // issues a chat session. redirect_uri must match the client's pattern.
  rpc ExchangeNativeCode(ExchangeNativeCodeRequest) returns (ExchangeNativeCodeResponse);
  // Ends the current session and revokes its IdP refresh token. Web signs
  // out with the HTTP route /auth/logout instead (302 to the IdP
  // end_session_endpoint), so the id_token_hint never reaches JavaScript.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // Sensitive: requires an IdP sign-in within the last 10 minutes
  // (prompt=login, max_age=600, auth_time checked).
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);
}

enum ClientPlatform {
  CLIENT_PLATFORM_UNSPECIFIED = 0;
  CLIENT_PLATFORM_WEB = 1;
  CLIENT_PLATFORM_IOS = 2;
  CLIENT_PLATFORM_ANDROID = 3;
  // Retired 20/10/2026: there is no desktop app (desktop runs the web app
  // as a PWA and signs in as WEB). Kept only so the number is never reused;
  // the server treats it like WEB and never returns it.
  CLIENT_PLATFORM_DESKTOP = 4;
}

// Why a session ended; carried by the session_revoked update and WS frame.
enum SessionRevokeReason {
  SESSION_REVOKE_REASON_UNSPECIFIED = 0;
  // The user signed out on this session.
  SESSION_REVOKE_REASON_SIGNED_OUT = 1;
  // Revoked from another session of the same user.
  SESSION_REVOKE_REASON_REVOKED_BY_USER = 2;
  // IdP back-channel logout, or refresh returned invalid_grant.
  SESSION_REVOKE_REASON_IDP_GRANT_ENDED = 3;
  // Session lifetime reached.
  SESSION_REVOKE_REASON_EXPIRED = 4;
  // Removed by tenant operators or moderation.
  SESSION_REVOKE_REASON_ADMIN = 5;
  // The same browser signed in again (for example to confirm a sensitive
  // action) and now holds the new session's cookie: clients keep their local
  // data and reconnect, which picks up the new session.
  SESSION_REVOKE_REASON_REPLACED = 6;
  // The user deleted the chat account (or it was scheduled for deletion
  // after a long time unused): every session ends and the IdP grant is
  // revoked. Clients wipe local data like for any other revocation.
  SESSION_REVOKE_REASON_ACCOUNT_DELETED = 7;
}

message GetAuthConfigRequest {
  // Selects the IdP client: IOS/ANDROID use chat-mobile, any other the web client.
  ClientPlatform platform = 1;
}

message GetAuthConfigResponse {
  string issuer = 1;
  string client_id = 2;
  string authorization_endpoint = 3;
  repeated string scopes = 4;
  // Tenant display name from the IdP (not from brand config).
  string tenant_name = 5;
}

message ExchangeNativeCodeRequest {
  // The server derives the IdP client_id from platform; clients never send it.
  reserved 4;
  reserved "client_id";

  string code = 1;
  string code_verifier = 2;
  string redirect_uri = 3;
  // IOS or ANDROID; selects the IdP client (see GetAuthConfig).
  ClientPlatform platform = 5;
  // Human-readable device label shown in ListSessions.
  string device_name = 6;
  string app_version = 7;
}

message ExchangeNativeCodeResponse {
  // Opaque 256-bit chat session token; store it in the platform secure store.
  string session_token = 1;
  int64 session_id = 2 [jstype = JS_NUMBER];
  User user = 3;
}

message SignOutRequest {}

message SignOutResponse {
  // Removed: it would hand the IdP id_token_hint to JavaScript. Web signs out
  // through the HTTP route /auth/logout, which redirects (302) to the IdP
  // end_session_endpoint server-side.
  reserved 1;
  reserved "end_session_url";
}

message Session {
  int64 id = 1 [jstype = JS_NUMBER];
  ClientPlatform platform = 2;
  string device_name = 3;
  string app_version = 4;
  // Coarse location derived from the last IP.
  string location = 5;
  int64 created_at = 6 [jstype = JS_NUMBER];
  int64 last_active_at = 7 [jstype = JS_NUMBER];
  // The session making this call.
  bool current = 8;
  // Recently signed-in device that other sessions should be warned about.
  bool new_login = 9;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  int64 session_id = 1 [jstype = JS_NUMBER];
}

message RevokeSessionResponse {}

message RevokeOtherSessionsRequest {}

message RevokeOtherSessionsResponse {
  int32 revoked_count = 1;
}
