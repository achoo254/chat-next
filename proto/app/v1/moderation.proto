syntax = "proto3";

package app.v1;

import "app/v1/bot_admin.proto";
import "app/v1/chats.proto";
import "app/v1/messages.proto";
import "app/v1/users.proto";

option go_package = "app.local/server/gen/app/v1;appv1";

// ID convention (ADR 0001): every int64 field marked [jstype = JS_NUMBER]
// always holds a value < 2^53; the server asserts the bound when serializing.
// Every report and action is scoped to the caller's tenant (ADR 0010).

// The moderation queue of the tenant. Only operator accounts (configured by
// the server operators, none by default) may call it; everyone else gets
// permission_denied. GetSelfResponse.is_operator tells clients whether to
// show it.
service ModerationService {
  // Reports, newest first.
  rpc GetReports(GetReportsRequest) returns (GetReportsResponse);
  // One report with the reported messages as filed, the messages around
  // them as they are now, and earlier actions on the reported user.
  rpc GetReport(GetReportRequest) returns (GetReportResponse);
  // Closes an open report, and every other open report about the same
  // target, with one or more actions; a closed report gives
  // failed_precondition.
  rpc ResolveReport(ResolveReportRequest) returns (ResolveReportResponse);
  // Ends an account restriction before its time.
  rpc LiftRestriction(LiftRestrictionRequest) returns (LiftRestrictionResponse);
  // Feedback users sent the tenant's assistant bot ("Góp ý" and "Báo lỗi"),
  // newest first.
  rpc GetFeedback(GetFeedbackRequest) returns (GetFeedbackResponse);
  // Marks a feedback item handled; an item already handled is returned as
  // is.
  rpc ResolveFeedback(ResolveFeedbackRequest) returns (ResolveFeedbackResponse);
  // Sends the operator's answer to the user through the assistant bot (as a
  // reply to their message) and marks the item handled. One answer per
  // item: a second gives failed_precondition "already_replied".
  rpc ReplyFeedback(ReplyFeedbackRequest) returns (ReplyFeedbackResponse);
  // Reports grouped by target (the same user, chat, or messages), the
  // groups with the most reports first; each group carries its newest
  // report. ResolveReport on that report closes the whole open group.
  rpc GetReportGroups(GetReportGroupsRequest) returns (GetReportGroupsResponse);
  // The tenant's moderation log, newest first, including the automatic
  // rules (operator_id 0).
  rpc GetModerationLog(GetModerationLogRequest) returns (GetModerationLogResponse);
  // What an operator needs to judge a bot: tier, verification, automatic
  // restriction and usage.
  rpc GetBotReview(GetBotReviewRequest) returns (GetBotReviewResponse);
  // Bots the automatic rule restricted that no operator has reviewed yet.
  rpc GetBotReviews(GetBotReviewsRequest) returns (GetBotReviewsResponse);
  // Grants or revokes a bot's verified badge (and its higher tier).
  rpc SetBotVerified(SetBotVerifiedRequest) returns (SetBotVerifiedResponse);
  // Keeps a restricted bot restricted, or restores its previous tier.
  rpc ReviewBotRestriction(ReviewBotRestrictionRequest) returns (ReviewBotRestrictionResponse);
  // Parses an announcement (Bot API markdown) as SendAnnouncement would and
  // counts its recipients, without sending; a syntax error gives
  // invalid_argument with its position.
  rpc PreviewAnnouncement(PreviewAnnouncementRequest) returns (PreviewAnnouncementResponse);
  // Sends an announcement through the assistant bot to every user of the
  // tenant who started it, in the background (a bulk send at the internal
  // tier's pace, each user once).
  rpc SendAnnouncement(SendAnnouncementRequest) returns (SendAnnouncementResponse);
  // The tenant's announcements, newest first, with their progress.
  rpc GetAnnouncements(GetAnnouncementsRequest) returns (GetAnnouncementsResponse);
  // Stops an announcement being sent; messages already sent stay.
  rpc CancelAnnouncement(CancelAnnouncementRequest) returns (CancelAnnouncementResponse);
}

enum ReportStatus {
  REPORT_STATUS_UNSPECIFIED = 0;
  REPORT_STATUS_OPEN = 1;
  // Closed with at least one action other than dismiss.
  REPORT_STATUS_RESOLVED = 2;
  // Closed without action.
  REPORT_STATUS_DISMISSED = 3;
}

enum ReportTargetKind {
  REPORT_TARGET_KIND_UNSPECIFIED = 0;
  REPORT_TARGET_KIND_USER = 1;
  REPORT_TARGET_KIND_CHAT = 2;
  REPORT_TARGET_KIND_MESSAGES = 3;
  // A report about a bot account (filed as USER).
  REPORT_TARGET_KIND_BOT = 4;
  // A report about messages an incoming webhook posted (filed as MESSAGES).
  REPORT_TARGET_KIND_WEBHOOK = 5;
}

enum ModerationAction {
  MODERATION_ACTION_UNSPECIFIED = 0;
  // Close without action; cannot be combined with other actions.
  MODERATION_ACTION_DISMISS = 1;
  // Delete the reported messages for everyone.
  MODERATION_ACTION_DELETE_MESSAGES = 2;
  // Remove and ban the authors of the reported messages from the chat (not
  // its owner). Members see member_removed with actor_id 0.
  MODERATION_ACTION_BAN_FROM_CHAT = 3;
  // Restrict the reported user (or the authors of the reported messages):
  // their chat sessions are revoked and, until the restriction ends, they
  // cannot send, react, create or join chats, add members or create invite
  // links (permission_denied, message prefix "account_restricted").
  MODERATION_ACTION_RESTRICT_ACCOUNT = 4;
  // LiftRestriction (log entries only).
  MODERATION_ACTION_LIFT_RESTRICTION = 5;
  // The assistant bot sends the reported users (or the authors of the
  // reported messages) the note as a warning.
  MODERATION_ACTION_WARN = 6;
  // WEBHOOK: turn off the hooks of the chat that posted the reported
  // messages (GetReportResponse.hooks).
  MODERATION_ACTION_DISABLE_WEBHOOK = 7;
  // Log entries only: a bot moved to the restricted tier (by the automatic
  // rule, operator_id 0), kept there or restored after review, verified or
  // unverified, and a user's new chats with strangers stopped by the
  // automatic rule.
  MODERATION_ACTION_RESTRICT_BOT = 8;
  MODERATION_ACTION_RESTORE_BOT_TIER = 9;
  MODERATION_ACTION_KEEP_BOT_RESTRICTED = 10;
  MODERATION_ACTION_VERIFY_BOT = 11;
  MODERATION_ACTION_UNVERIFY_BOT = 12;
  MODERATION_ACTION_LIMIT_STRANGER_CHATS = 13;
}

message Report {
  int64 id = 1 [jstype = JS_NUMBER];
  ReportTargetKind target_kind = 2;
  int64 reporter_id = 3 [jstype = JS_NUMBER];
  // USER: the reported user.
  int64 target_user_id = 4 [jstype = JS_NUMBER];
  // CHAT and MESSAGES: the chat.
  int64 target_chat_id = 5 [jstype = JS_NUMBER];
  // MESSAGES: the reported messages.
  repeated int64 seqs = 6 [jstype = JS_NUMBER];
  ReportReason reason = 7;
  string comment = 8;
  ReportStatus status = 9;
  int64 created_at = 10 [jstype = JS_NUMBER];
  // Closed reports: when, by which operator, with what and why.
  int64 resolved_at = 11 [jstype = JS_NUMBER];
  int64 resolved_by = 12 [jstype = JS_NUMBER];
  repeated ModerationAction actions = 13;
  string resolution_note = 14;
}

// A reported message as it was when the report was filed.
message ReportedMessage {
  int64 seq = 1 [jstype = JS_NUMBER];
  int64 from_id = 2 [jstype = JS_NUMBER];
  int64 date = 3 [jstype = JS_NUMBER];
  string text = 4;
  // Already deleted for everyone when reported.
  bool deleted = 5;
}

// One entry of the tenant's append-only moderation log.
message ModerationLogEntry {
  int64 id = 1 [jstype = JS_NUMBER];
  int64 operator_id = 2 [jstype = JS_NUMBER];
  // 0 for LiftRestriction.
  int64 report_id = 3 [jstype = JS_NUMBER];
  ModerationAction action = 4;
  int64 target_user_id = 5 [jstype = JS_NUMBER];
  int64 target_chat_id = 6 [jstype = JS_NUMBER];
  string note = 7;
  // RESTRICT_ACCOUNT: end of the restriction; 0 = until lifted.
  int64 until = 8 [jstype = JS_NUMBER];
  int64 created_at = 9 [jstype = JS_NUMBER];
  // DELETE_MESSAGES: the deleted messages of target_chat_id.
  repeated int64 seqs = 10 [jstype = JS_NUMBER];
  // DISABLE_WEBHOOK: the hook turned off, and its name.
  string hook_id = 11;
}

message AccountRestriction {
  int64 user_id = 1 [jstype = JS_NUMBER];
  // 0 = until lifted.
  int64 until = 2 [jstype = JS_NUMBER];
  string reason = 3;
  int64 created_at = 4 [jstype = JS_NUMBER];
}

message GetReportsRequest {
  // UNSPECIFIED lists open reports.
  ReportStatus status = 1;
  // Optional filters; UNSPECIFIED matches any.
  ReportReason reason = 2;
  ReportTargetKind target_kind = 3;
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 4;
  // Default 50, at most 200.
  int32 limit = 5;
}

message GetReportsResponse {
  repeated Report reports = 1;
  // Reporters, reported users and operators of these reports.
  repeated User users = 2;
  // Reported chats.
  repeated Chat chats = 3;
  // Empty when there are no more reports.
  string next_cursor = 4;
}

message GetReportRequest {
  int64 report_id = 1 [jstype = JS_NUMBER];
}

message GetReportResponse {
  Report report = 1;
  // MESSAGES: the reported messages as filed.
  repeated ReportedMessage evidence = 2;
  // MESSAGES: the reported messages and up to 5 messages before and after
  // them, as they are now (deleted ones have no content), ascending by seq.
  repeated Message context = 3;
  repeated User users = 4;
  // CHAT and MESSAGES: the chat.
  Chat chat = 5;
  // Earlier log entries about the reported user (or the authors of the
  // reported messages), newest first, at most 20.
  repeated ModerationLogEntry history = 6;
  // Active restrictions of those users.
  repeated AccountRestriction restrictions = 7;
  // The reports about the same target with the same status as this one.
  ReportGroupSummary group = 8;
  // What the reported users did lately, one entry per user.
  repeated SenderSignals signals = 9;
  // WEBHOOK: the hooks of the chat whose name is the label of the reported
  // messages, the ones DISABLE_WEBHOOK turns off.
  repeated ModeratedHook hooks = 10;
}

message ReportGroupSummary {
  int32 report_count = 1;
  // Distinct reporters.
  int32 reporter_count = 2;
  // Report counts by reason, the most frequent first.
  repeated ReasonCount reasons = 3;
  // Reporters' comments, newest first, at most 10.
  repeated string comments = 4;
}

message ReasonCount {
  ReportReason reason = 1;
  int32 count = 2;
}

message SenderSignals {
  int64 user_id = 1 [jstype = JS_NUMBER];
  // Age of the chat account.
  int64 account_age_seconds = 2 [jstype = JS_NUMBER];
  // Private chats the user started in the last 24 hours with people who do
  // not know them (not their contact, no shared group or channel).
  int32 stranger_chats_24h = 3;
  // People who blocked the user.
  int32 blocked_by = 4;
  // Groups and channels the user joined in the last 24 hours.
  int32 chats_joined_24h = 5;
  // Open reports about the user other than this report's group.
  int32 other_open_reports = 6;
}

message ModeratedHook {
  string id = 1;
  string name = 2;
  bool disabled = 3;
}

message ReportGroup {
  // The newest report of the group.
  Report report = 1;
  int32 report_count = 2;
  // The most frequent reason.
  ReportReason main_reason = 3;
}

message GetReportGroupsRequest {
  // As in GetReportsRequest.
  ReportStatus status = 1;
  ReportReason reason = 2;
  ReportTargetKind target_kind = 3;
  string cursor = 4;
  // Default 50, at most 200.
  int32 limit = 5;
}

message GetReportGroupsResponse {
  repeated ReportGroup groups = 1;
  repeated User users = 2;
  repeated Chat chats = 3;
  string next_cursor = 4;
}

message GetModerationLogRequest {
  // Optional filters: one operator (or 0 with automatic_only for the
  // automatic rules), one action, entries since a time (Unix seconds).
  int64 operator_id = 1 [jstype = JS_NUMBER];
  bool automatic_only = 2;
  ModerationAction action = 3;
  int64 since = 4 [jstype = JS_NUMBER];
  string cursor = 5;
  // Default 50, at most 500.
  int32 limit = 6;
}

message GetModerationLogResponse {
  repeated ModerationLogEntry entries = 1;
  // Operators and targets of these entries.
  repeated User users = 2;
  repeated Chat chats = 3;
  string next_cursor = 4;
}

// A bot as the operators review it.
message BotReview {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  int64 owner_id = 2 [jstype = JS_NUMBER];
  int64 created_at = 3 [jstype = JS_NUMBER];
  BotTier tier = 4;
  bool verified = 5;
  // Restricted tier: since when, why, and whether by the automatic rule.
  int64 restricted_at = 6 [jstype = JS_NUMBER];
  string restricted_reason = 7;
  bool restricted_automatically = 8;
  // An operator kept the restriction after review.
  bool restriction_reviewed = 9;
  // Users who started the bot.
  int32 users = 10;
  // Messages the bot sent in the last 7 days.
  int32 messages_7d = 11;
  // Of the users the bot wrote to in the last 24 hours, the share (per
  // thousand) who blocked it.
  int32 blocked_permille_24h = 12;
  int32 open_reports = 13;
}

message GetBotReviewRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
}

message GetBotReviewResponse {
  BotReview review = 1;
  // The bot and its owner.
  repeated User users = 2;
}

message GetBotReviewsRequest {}

message GetBotReviewsResponse {
  repeated BotReview reviews = 1;
  repeated User users = 2;
}

message SetBotVerifiedRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  bool verified = 2;
  // Why, recorded in the log; required.
  string note = 3;
}

message SetBotVerifiedResponse {
  BotReview review = 1;
}

message ReviewBotRestrictionRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // true restores the bot's tier; false keeps it restricted.
  bool restore = 2;
  string note = 3;
}

message ReviewBotRestrictionResponse {
  BotReview review = 1;
}

message ResolveReportRequest {
  int64 report_id = 1 [jstype = JS_NUMBER];
  repeated ModerationAction actions = 2;
  // Why, recorded in the log; required, up to 1000 characters.
  string note = 3;
  // RESTRICT_ACCOUNT: length in seconds, up to 366 days; 0 = until lifted.
  int32 restrict_seconds = 4;
  // The assistant bot also tells the reported users what was done and why
  // (the note); WARN always does.
  bool notify = 5;
}

message ResolveReportResponse {
  Report report = 1;
}

message LiftRestrictionRequest {
  int64 user_id = 1 [jstype = JS_NUMBER];
  // Why, recorded in the log; required, up to 1000 characters.
  string note = 2;
}

message LiftRestrictionResponse {}

enum FeedbackStatus {
  FEEDBACK_STATUS_UNSPECIFIED = 0;
  FEEDBACK_STATUS_OPEN = 1;
  FEEDBACK_STATUS_HANDLED = 2;
}

enum FeedbackKind {
  FEEDBACK_KIND_UNSPECIFIED = 0;
  // "Góp ý": an idea or a remark.
  FEEDBACK_KIND_IDEA = 1;
  // "Báo lỗi": something does not work.
  FEEDBACK_KIND_BUG = 2;
}

// One message a user sent the assistant bot as feedback.
message Feedback {
  int64 id = 1 [jstype = JS_NUMBER];
  int64 user_id = 2 [jstype = JS_NUMBER];
  FeedbackKind kind = 3;
  string text = 4;
  FeedbackStatus status = 5;
  int64 created_at = 6 [jstype = JS_NUMBER];
  // Handled items: when and by which operator.
  int64 handled_at = 7 [jstype = JS_NUMBER];
  int64 handled_by = 8 [jstype = JS_NUMBER];
  // The operator's answer sent to the user; empty when none was sent.
  string reply_text = 9;
  int64 replied_at = 10 [jstype = JS_NUMBER];
  int64 replied_by = 11 [jstype = JS_NUMBER];
}

message GetFeedbackRequest {
  // UNSPECIFIED lists open items.
  FeedbackStatus status = 1;
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 2;
  // Default 50, at most 200.
  int32 limit = 3;
}

message GetFeedbackResponse {
  repeated Feedback feedback = 1;
  // The senders and the operators of these items.
  repeated User users = 2;
  // Empty when there are no more items.
  string next_cursor = 3;
}

message ResolveFeedbackRequest {
  int64 feedback_id = 1 [jstype = JS_NUMBER];
}

message ResolveFeedbackResponse {
  Feedback feedback = 1;
}

message ReplyFeedbackRequest {
  int64 feedback_id = 1 [jstype = JS_NUMBER];
  // Required, up to 2000 characters.
  string text = 2;
}

message ReplyFeedbackResponse {
  Feedback feedback = 1;
}

enum AnnouncementState {
  ANNOUNCEMENT_STATE_UNSPECIFIED = 0;
  ANNOUNCEMENT_STATE_QUEUED = 1;
  ANNOUNCEMENT_STATE_RUNNING = 2;
  ANNOUNCEMENT_STATE_DONE = 3;
  ANNOUNCEMENT_STATE_CANCELLED = 4;
}

message Announcement {
  int64 id = 1 [jstype = JS_NUMBER];
  // As users get it.
  string text = 2;
  repeated MessageEntity entities = 3;
  AnnouncementState state = 4;
  // Why a cancelled announcement stopped: "cancelled" (an operator),
  // "bot_deleted", "bot_restricted".
  string reason = 5;
  // Recipients when it was queued, and the outcome so far: skipped users
  // blocked the assistant or were deleted.
  int32 total = 6;
  int32 sent = 7;
  int32 skipped = 8;
  int32 failed = 9;
  int64 created_at = 10 [jstype = JS_NUMBER];
  int64 finished_at = 11 [jstype = JS_NUMBER];
  // The operator who sent it.
  int64 created_by = 12 [jstype = JS_NUMBER];
}

message PreviewAnnouncementRequest {
  // Bot API markdown (*bold*, _italic_, [text](url)…), up to 4096
  // characters once parsed.
  string text = 1;
}

message PreviewAnnouncementResponse {
  string text = 1;
  repeated MessageEntity entities = 2;
  // The users who started the assistant now.
  int32 audience = 3;
}

message SendAnnouncementRequest {
  string text = 1;
}

message SendAnnouncementResponse {
  Announcement announcement = 1;
}

message GetAnnouncementsRequest {}

message GetAnnouncementsResponse {
  // The newest 50.
  repeated Announcement announcements = 1;
  // The operators who sent them.
  repeated User users = 2;
  // The users who started the assistant now.
  int32 audience = 3;
}

message CancelAnnouncementRequest {
  int64 announcement_id = 1 [jstype = JS_NUMBER];
}

message CancelAnnouncementResponse {
  Announcement announcement = 1;
}
