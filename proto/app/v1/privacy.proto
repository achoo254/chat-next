syntax = "proto3";

package app.v1;

option go_package = "app.local/server/gen/app/v1;appv1";

// ID convention (ADR 0001): every int64 field marked [jstype = JS_NUMBER]
// always holds a value < 2^53; the server asserts the bound when serializing.
//
// The user's rights over their chat data (Nghị định 13/2023/NĐ-CP): a
// downloadable export. Only chat data is concerned: the hoandat account and
// its sign-in methods belong to the IdP. An account is deleted only at the
// IdP, which tells the chat to erase it (ADR 0016); there is no RPC for it.
// Inventory and retention: docs/privacy/data-inventory.md.
service PrivacyService {
  // The latest export and when a new one may be requested.
  rpc GetDataExport(GetDataExportRequest) returns (GetDataExportResponse);
  // Starts a new export, built in the background. At most one per 7 days
  // (failed ones do not count): resource_exhausted "export_rate_limited"
  // otherwise. failed_precondition "export_unavailable" when the server has
  // no export storage.
  rpc RequestDataExport(RequestDataExportRequest) returns (RequestDataExportResponse);
  // A short-lived download URL on the media host for a ready export.
  rpc GetDataExportUrl(GetDataExportUrlRequest) returns (GetDataExportUrlResponse);
}

enum DataExportStatus {
  DATA_EXPORT_STATUS_UNSPECIFIED = 0;
  DATA_EXPORT_STATUS_PENDING = 1;
  DATA_EXPORT_STATUS_RUNNING = 2;
  DATA_EXPORT_STATUS_READY = 3;
  DATA_EXPORT_STATUS_FAILED = 4;
  // Past its 30 days: the file is gone.
  DATA_EXPORT_STATUS_EXPIRED = 5;
}

message DataExport {
  int64 id = 1 [jstype = JS_NUMBER];
  DataExportStatus status = 2;
  // 0 to 100 while RUNNING.
  int32 progress = 3;
  // Bytes of the ZIP once READY.
  int64 size = 4 [jstype = JS_NUMBER];
  // Name the download carries, e.g. chat-export-dattqh-20261016.zip.
  string file_name = 5;
  // Unix seconds; ready_at and expires_at are 0 until READY.
  int64 created_at = 6 [jstype = JS_NUMBER];
  int64 ready_at = 7 [jstype = JS_NUMBER];
  int64 expires_at = 8 [jstype = JS_NUMBER];
}

message GetDataExportRequest {}

message GetDataExportResponse {
  // The newest export; unset when the user never asked for one.
  DataExport export = 1;
  // Unix seconds from which RequestDataExport is accepted; 0 when now.
  int64 next_request_at = 2 [jstype = JS_NUMBER];
  // False when the server has no export storage (RequestDataExport fails).
  bool available = 3;
}

message RequestDataExportRequest {}

message RequestDataExportResponse {
  DataExport export = 1;
  int64 next_request_at = 2 [jstype = JS_NUMBER];
}

message GetDataExportUrlRequest {
  int64 export_id = 1 [jstype = JS_NUMBER];
}

message GetDataExportUrlResponse {
  string url = 1;
  // Unix seconds.
  int64 expires_at = 2 [jstype = JS_NUMBER];
}

// A bot of the caller, as the data export lists it.
message OwnedBot {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  string name = 2;
  string username = 3;
}
