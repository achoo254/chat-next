syntax = "proto3";

package app.v1;

option go_package = "app.local/server/gen/app/v1;appv1";

// ID convention (ADR 0001): every int64 field marked [jstype = JS_NUMBER]
// always holds a value < 2^53; the server asserts the bound when serializing.

// The Chat Bridge (ADR 0022): the user connects an account of another app
// (Telegram first) and chooses which of its conversations Chat copies in.
// Everything runs on the server; nothing here carries a message. Served
// under /rpc with the user's session like every user service. Only the two
// login calls (the grant of access to a whole account) need an IdP sign-in
// within the last 10 minutes (failed_precondition reauth_required). When the
// server runs with the bridge off, every call answers failed_precondition
// bridge_disabled.
service BridgeService {
  // What a new synced chat of the account starts with, by feature (acting on people and
  // groups and messages are not part of it).
  // Retired by the one-switch sync (ADR 0024): answers failed_precondition removed.
  rpc ListBridgeFeatureDefaults(ListBridgeFeatureDefaultsRequest) returns (ListBridgeFeatureDefaultsResponse) {
    option deprecated = true;
  }
  // Sets one default; with apply_to_all it is also written to every chat already synced.
  // Retired by the one-switch sync (ADR 0024): answers failed_precondition removed.
  rpc SetBridgeFeatureDefault(SetBridgeFeatureDefaultRequest) returns (SetBridgeFeatureDefaultResponse) {
    option deprecated = true;
  }
  // Everything Chat queued for the app that did not go through, of any feature.
  rpc ListBridgeProblems(ListBridgeProblemsRequest) returns (ListBridgeProblemsResponse);
  // Queues a problem again.
  rpc RetryBridgeProblem(RetryBridgeProblemRequest) returns (RetryBridgeProblemResponse);
  // Gives up a problem that is not a send.
  rpc DismissBridgeProblem(DismissBridgeProblemRequest) returns (DismissBridgeProblemResponse);
  // Which apps can be connected, the user's connected accounts and their
  // synced chats.
  rpc GetBridgeStatus(GetBridgeStatusRequest) returns (GetBridgeStatusResponse);
  // Turns on the account's one switch (ADR 0024): every conversation of the app
  // gets a chat, its newest 2,000 messages imported, newest conversation first, and
  // every one that appears later joins on its own; all of them sync both ways.
  // Turning it on again does nothing.
  rpc StartBridgeSync(StartBridgeSyncRequest) returns (StartBridgeSyncResponse);
  // Starts signing in to an app. The answer is the first step to show.
  // Rate limited (resource_exhausted): a login sends a code to a phone.
  rpc StartBridgeLogin(StartBridgeLoginRequest) returns (StartBridgeLoginResponse);
  // Sends the user's answers to the current step and returns the next one.
  // invalid_argument when an answer is wrong (the step stays open).
  rpc ContinueBridgeLogin(ContinueBridgeLoginRequest) returns (ContinueBridgeLoginResponse);
  // The conversations of a connected account, with which are synced.
  // Retired by the one-switch sync (ADR 0024): answers failed_precondition removed.
  rpc ListBridgeConversations(ListBridgeConversationsRequest) returns (ListBridgeConversationsResponse) {
    option deprecated = true;
  }
  // Starts copying a conversation into a new chat: its newest
  // history_window messages first (chosen here, once: older history cannot
  // be added later), then new messages as they arrive. The chat is
  // read-only (sending into it is refused) or, with direction BOTH, also
  // sends what the user writes in Chat on to the app; unspecified takes BOTH
  // when the app can be written to, else IN.
  // Retired by the one-switch sync (ADR 0024): answers failed_precondition removed.
  rpc EnableBridgeChat(EnableBridgeChatRequest) returns (EnableBridgeChatResponse) {
    option deprecated = true;
  }
  // Stops syncing a conversation and deletes its chat.
  // Retired by the one-switch sync (ADR 0024): answers failed_precondition removed.
  rpc RemoveBridgeChat(RemoveBridgeChatRequest) returns (RemoveBridgeChatResponse) {
    option deprecated = true;
  }
  // Switches a synced chat between receiving only (IN) and also sending on
  // what the user writes (BOTH). Going back to IN drops what is queued and
  // not yet sent. failed_precondition send_unsupported when the app cannot
  // be written to.
  // Retired by the one-switch sync (ADR 0024): answers failed_precondition removed.
  rpc SetBridgeChatDirection(SetBridgeChatDirectionRequest) returns (SetBridgeChatDirectionResponse) {
    option deprecated = true;
  }
  // What can be synced for a synced chat, feature by feature: only what the
  // app supports is listed, with the direction now in effect.
  rpc ListBridgeFeatures(ListBridgeFeaturesRequest) returns (ListBridgeFeaturesResponse);
  // Sets the direction of one feature of a synced chat. Fails with
  // failed_precondition (feature_unsupported) when the app cannot do it.
  // Retired by the one-switch sync (ADR 0024): answers failed_precondition removed.
  rpc SetBridgeFeature(SetBridgeFeatureRequest) returns (SetBridgeFeatureResponse) {
    option deprecated = true;
  }
  // The invite links the account made for a synced group in the app (not Chat's own links).
  rpc ListBridgeInvites(ListBridgeInvitesRequest) returns (ListBridgeInvitesResponse);
  // Asks the app for a new invite link; it shows in the list once the app made it.
  // failed_precondition feature_off when the invites feature does not send for the chat.
  rpc CreateBridgeInvite(CreateBridgeInviteRequest) returns (CreateBridgeInviteResponse);
  rpc RevokeBridgeInvite(RevokeBridgeInviteRequest) returns (RevokeBridgeInviteResponse);
  // People of the account the app has shown, who are not members of the synced group.
  rpc ListBridgeCandidates(ListBridgeCandidatesRequest) returns (ListBridgeCandidatesResponse);
  // Asks the app to add one of them to the group (members feature sending).
  rpc AddBridgeMember(AddBridgeMemberRequest) returns (AddBridgeMemberResponse);
  // Leaves the group in the app. confirm_name must be the name of the chat
  // (invalid_argument confirmation_wrong otherwise); the chat stays as a read-only copy.
  rpc LeaveBridgeGroup(LeaveBridgeGroupRequest) returns (LeaveBridgeGroupResponse);
  // First step of deleting the group in the app for everybody: checks the name and gives a
  // token that DeleteBridgeGroup accepts from usable_from_unix until expires_unix, once.
  rpc RequestBridgeGroupDelete(RequestBridgeGroupDeleteRequest) returns (RequestBridgeGroupDeleteResponse);
  // Second step: deletes the group in the app, history included. Cannot be undone.
  rpc DeleteBridgeGroup(DeleteBridgeGroupRequest) returns (DeleteBridgeGroupResponse);
  // What a chat has queued for the app and not finished: sending, waiting,
  // failed or of unknown result. A message that is not listed was sent.
  rpc ListBridgeOutbox(ListBridgeOutboxRequest) returns (ListBridgeOutboxResponse);
  // Tries a failed or unknown message again. A message deleted in Chat is
  // never sent: deleting is how a failed message is given up.
  rpc RetryBridgeMessage(RetryBridgeMessageRequest) returns (RetryBridgeMessageResponse);
  // Gives up a failed edit or delete: the message stays as it is in Chat and
  // the app keeps its older version. (A failed send is given up by deleting
  // the message.)
  rpc DismissBridgeMessage(DismissBridgeMessageRequest) returns (DismissBridgeMessageResponse);
  // Signs out of the app (the session ends there too). With delete_chats
  // the synced chats and the contacts imported with them are deleted;
  // without it they stay as read-only copies.
  rpc DisconnectBridgeAccount(DisconnectBridgeAccountRequest) returns (DisconnectBridgeAccountResponse);
}

message BridgeApp {
  // Stable id of the app ("telegram").
  string source = 1;
}

enum BridgeAccountStatus {
  BRIDGE_ACCOUNT_STATUS_UNSPECIFIED = 0;
  // Connected, or reconnecting after a failure.
  BRIDGE_ACCOUNT_STATUS_ACTIVE = 1;
  // The app ended the session: sign in again.
  BRIDGE_ACCOUNT_STATUS_NEEDS_LOGIN = 2;
  // Signed out by the user; its chats remain read-only.
  BRIDGE_ACCOUNT_STATUS_STOPPED = 3;
}

enum BridgeDirection {
  BRIDGE_DIRECTION_UNSPECIFIED = 0;
  // The app is the source; Chat sends nothing back.
  BRIDGE_DIRECTION_IN = 1;
  // What the user writes in the chat is also sent on to the app.
  BRIDGE_DIRECTION_BOTH = 2;
}

message BridgeSyncedChat {
  // The conversation id in the app (opaque).
  string conversation_id = 1;
  int64 chat_id = 2 [jstype = JS_NUMBER];
  // The first import has caught up with the newest message.
  bool caught_up = 3;
  int32 history_window = 4;
  // The conversation's name in the app when it was enabled.
  string title = 5;
  BridgeDirection direction = 6;
  // The chat is split into topics like the conversation it copies (a forum).
  bool topics_split = 7;
}

message BridgeAccount {
  int64 id = 1 [jstype = JS_NUMBER];
  string source = 2;
  BridgeAccountStatus status = 3;
  // Why the connection last failed (a short text, no secret); empty when fine.
  string last_error = 4;
  repeated BridgeSyncedChat chats = 5;
  BridgeSyncState sync_state = 6;
  BridgeSyncProgress progress = 7;
  // A per-account sending switch, removed: an app Chat can write to syncs both
  // ways as soon as the account is connected.
  reserved 8, 9;
  reserved "send_gated", "send_enabled";
}

enum BridgeSyncState {
  BRIDGE_SYNC_STATE_UNSPECIFIED = 0;
  // Not asked yet, or the user chose later.
  BRIDGE_SYNC_STATE_OFF = 1;
  // The first import of the conversations is running.
  BRIDGE_SYNC_STATE_SYNCING = 2;
  // Everything is imported; changes flow both ways as they happen.
  BRIDGE_SYNC_STATE_LIVE = 3;
}

// How far the first import went.
message BridgeSyncProgress {
  // Conversations that have a chat, and how many of them are imported.
  int32 conversations = 1;
  int32 conversations_done = 2;
  // Messages imported, of the ones expected (a chat still importing counts its whole window).
  int64 messages = 3 [jstype = JS_NUMBER];
  int64 messages_expected = 4 [jstype = JS_NUMBER];
}

message StartBridgeSyncRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
}

message StartBridgeSyncResponse {}

message GetBridgeStatusRequest {}

message GetBridgeStatusResponse {
  repeated BridgeApp apps = 1;
  repeated BridgeAccount accounts = 2;
}

enum BridgeLoginStepKind {
  BRIDGE_LOGIN_STEP_KIND_UNSPECIFIED = 0;
  // Ask for the text fields.
  BRIDGE_LOGIN_STEP_KIND_INPUT = 1;
  // Show a code to scan with the app.
  BRIDGE_LOGIN_STEP_KIND_QR = 2;
  // Wait for the user to approve in the app.
  BRIDGE_LOGIN_STEP_KIND_CONFIRM = 3;
  // Signed in: the account is connected.
  BRIDGE_LOGIN_STEP_KIND_DONE = 4;
}

message BridgeLoginField {
  string name = 1;
  string label = 2;
  // A phone number, code or password: not shown back, never stored.
  bool secret = 3;
}

message BridgeLoginStep {
  BridgeLoginStepKind kind = 1;
  // Hand it back in ContinueBridgeLogin; empty once the login is done.
  string login_id = 2;
  repeated BridgeLoginField fields = 3;
  // QR payload or instruction.
  string prompt = 4;
  // Set with DONE.
  BridgeAccount account = 5;
}

message StartBridgeLoginRequest {
  string source = 1;
}

message StartBridgeLoginResponse {
  BridgeLoginStep step = 1;
}

message ContinueBridgeLoginRequest {
  string login_id = 1;
  // Field name to the user's answer.
  map<string, string> input = 2;
}

message ContinueBridgeLoginResponse {
  BridgeLoginStep step = 1;
}

message ListBridgeConversationsRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
}

enum BridgeConversationKind {
  BRIDGE_CONVERSATION_KIND_UNSPECIFIED = 0;
  BRIDGE_CONVERSATION_KIND_PRIVATE = 1;
  BRIDGE_CONVERSATION_KIND_BOT = 2;
  BRIDGE_CONVERSATION_KIND_GROUP = 3;
  BRIDGE_CONVERSATION_KIND_CHANNEL = 4;
}

message BridgeConversation {
  string id = 1;
  BridgeConversationKind kind = 2;
  string title = 3;
  // The synced chat; 0 when not synced.
  int64 chat_id = 4 [jstype = JS_NUMBER];
  // The conversation is split into topics in the app (a forum).
  bool forum = 5;
  // The synced chat is split into topics too. A forum copied before topics were
  // read, or by an app that does not read them, is not: its topics are mixed in
  // one stream, and enabling it again (remove, then enable) splits them.
  bool topics_split = 6;
}

message ListBridgeConversationsResponse {
  repeated BridgeConversation conversations = 1;
}

message EnableBridgeChatRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  // How many of the newest messages to import, 1 to 100000; 0 takes 2000.
  int32 history_window = 3;
  BridgeDirection direction = 4;
}

message EnableBridgeChatResponse {
  int64 chat_id = 1 [jstype = JS_NUMBER];
}

message RemoveBridgeChatRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
}

message RemoveBridgeChatResponse {}

message DisconnectBridgeAccountRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  bool delete_chats = 2;
}

message DisconnectBridgeAccountResponse {}

message SetBridgeChatDirectionRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  BridgeDirection direction = 3;
}

message SetBridgeChatDirectionResponse {}

enum BridgeOutboxStatus {
  BRIDGE_OUTBOX_STATUS_UNSPECIFIED = 0;
  // Waiting its turn or for a retry.
  BRIDGE_OUTBOX_STATUS_PENDING = 1;
  // On its way to the app now.
  BRIDGE_OUTBOX_STATUS_SENDING = 2;
  // The app refused it, or it could not be sent after many tries.
  BRIDGE_OUTBOX_STATUS_FAILED = 3;
  // It was on its way when the server stopped, too long ago to repeat on
  // its own: it may or may not have arrived.
  BRIDGE_OUTBOX_STATUS_UNKNOWN = 4;
}

message BridgeOutboxItem {
  int64 seq = 1 [jstype = JS_NUMBER];
  // "send", "edit" or "delete".
  string op = 2;
  BridgeOutboxStatus status = 3;
  // Why it failed or waits, a short text without a secret; may be empty.
  string last_error = 4;
  int32 attempts = 5;
}

message ListBridgeOutboxRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
}

message ListBridgeOutboxResponse {
  repeated BridgeOutboxItem items = 1;
}

message RetryBridgeMessageRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 seq = 2 [jstype = JS_NUMBER];
}

message RetryBridgeMessageResponse {}

message DismissBridgeMessageRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 seq = 2 [jstype = JS_NUMBER];
}

message DismissBridgeMessageResponse {}

message ListBridgeFeaturesRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
}

// One feature of a synced chat. Names are strings so a new feature or app adds
// values, not schema.
message BridgeFeature {
  // "messages", "pins", "topics", ... (the list grows).
  string feature = 1;
  // "r1" the owner's own state, "r2" what other people see, "r3" acts on people
  // and groups, "re" ephemeral.
  string risk = 2;
  // "off", "in", "out" or "both".
  string direction = 3;
  // The owner never set it: it follows the messages of the chat.
  bool is_default = 4;
  // What the app can do: read its changes, and make changes from Chat.
  bool can_receive = 5;
  bool can_send = 6;
}

message ListBridgeFeaturesResponse {
  repeated BridgeFeature features = 1;
}

message SetBridgeFeatureRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  string feature = 3;
  string direction = 4;
}

message SetBridgeFeatureResponse {}

message ListBridgeInvitesRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
}

message BridgeInvite {
  string link = 1;
  string title = 2;
  bool revoked = 3;
  // How many people joined with it.
  int32 usage = 4;
}

message ListBridgeInvitesResponse {
  repeated BridgeInvite invites = 1;
}

message CreateBridgeInviteRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  string title = 3;
}

message CreateBridgeInviteResponse {}

message RevokeBridgeInviteRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  string link = 3;
}

message RevokeBridgeInviteResponse {}

message ListBridgeCandidatesRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
}

message BridgeCandidate {
  // The id of the person in the app (opaque).
  string participant_id = 1;
  string name = 2;
}

message ListBridgeCandidatesResponse {
  repeated BridgeCandidate candidates = 1;
}

message AddBridgeMemberRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  string participant_id = 3;
}

message AddBridgeMemberResponse {}

message LeaveBridgeGroupRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  string confirm_name = 3;
}

message LeaveBridgeGroupResponse {}

message RequestBridgeGroupDeleteRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  string confirm_name = 3;
}

message RequestBridgeGroupDeleteResponse {
  string token = 1;
  int64 usable_from_unix = 2 [jstype = JS_NUMBER];
  int64 expires_unix = 3 [jstype = JS_NUMBER];
}

message DeleteBridgeGroupRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  string confirm_name = 3;
  string token = 4;
}

message DeleteBridgeGroupResponse {}

message ListBridgeFeatureDefaultsRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
}

message BridgeFeatureDefault {
  string feature = 1;
  string risk = 2;
  // "off", "in", "out" or "both".
  string direction = 3;
  // The owner chose it; otherwise it is the built-in default.
  bool is_set = 4;
  bool can_receive = 5;
  bool can_send = 6;
}

message ListBridgeFeatureDefaultsResponse {
  repeated BridgeFeatureDefault defaults = 1;
}

message SetBridgeFeatureDefaultRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string feature = 2;
  string direction = 3;
  bool apply_to_all = 4;
}

message SetBridgeFeatureDefaultResponse {
  // How many synced chats were changed (0 without apply_to_all).
  int32 applied = 1;
}

message BridgeProblem {
  int64 id = 1 [jstype = JS_NUMBER];
  int64 chat_id = 2 [jstype = JS_NUMBER];
  string chat_title = 3;
  string feature = 4;
  string op = 5;
  int64 seq = 6 [jstype = JS_NUMBER];
  // "failed" or "unknown".
  string status = 7;
  // A short text without a secret; may be empty.
  string last_error = 8;
  int32 attempts = 9;
  int64 at_unix = 10 [jstype = JS_NUMBER];
}

message ListBridgeProblemsRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
}

message ListBridgeProblemsResponse {
  repeated BridgeProblem problems = 1;
}

message RetryBridgeProblemRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  int64 id = 2 [jstype = JS_NUMBER];
}

message RetryBridgeProblemResponse {}

message DismissBridgeProblemRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  int64 id = 2 [jstype = JS_NUMBER];
}

message DismissBridgeProblemResponse {}
