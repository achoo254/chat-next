syntax = "proto3";

package app.v1;

option go_package = "app.local/server/gen/app/v1;appv1";

// ID convention (ADR 0001): every int64 field marked [jstype = JS_NUMBER]
// always holds a value < 2^53; the server asserts the bound when serializing.

// The Chat Bridge (ADR 0022): the user connects an account of another app
// (Telegram first) and chooses which of its conversations Chat copies in.
// Everything runs on the server; nothing here carries a message. Served
// under /rpc with the user's session like every user service. Only the two
// login calls (the grant of access to a whole account) need an IdP sign-in
// within the last 10 minutes (failed_precondition reauth_required). When the
// server runs with the bridge off, every call answers failed_precondition
// bridge_disabled.
service BridgeService {
  // Which apps can be connected, the user's connected accounts and their
  // synced chats.
  rpc GetBridgeStatus(GetBridgeStatusRequest) returns (GetBridgeStatusResponse);
  // Starts signing in to an app. The answer is the first step to show.
  // Rate limited (resource_exhausted): a login sends a code to a phone.
  rpc StartBridgeLogin(StartBridgeLoginRequest) returns (StartBridgeLoginResponse);
  // Sends the user's answers to the current step and returns the next one.
  // invalid_argument when an answer is wrong (the step stays open).
  rpc ContinueBridgeLogin(ContinueBridgeLoginRequest) returns (ContinueBridgeLoginResponse);
  // The conversations of a connected account, with which are synced.
  rpc ListBridgeConversations(ListBridgeConversationsRequest) returns (ListBridgeConversationsResponse);
  // Starts copying a conversation into a new chat: its newest
  // history_window messages first (chosen here, once: older history cannot
  // be added later), then new messages as they arrive. The chat is
  // read-only (sending into it is refused) or, with direction BOTH, also
  // sends what the user writes in Chat on to the app; unspecified takes BOTH
  // when the app can be written to, else IN.
  rpc EnableBridgeChat(EnableBridgeChatRequest) returns (EnableBridgeChatResponse);
  // Stops syncing a conversation and deletes its chat.
  rpc RemoveBridgeChat(RemoveBridgeChatRequest) returns (RemoveBridgeChatResponse);
  // Switches a synced chat between receiving only (IN) and also sending on
  // what the user writes (BOTH). Going back to IN drops what is queued and
  // not yet sent. failed_precondition send_unsupported when the app cannot
  // be written to.
  rpc SetBridgeChatDirection(SetBridgeChatDirectionRequest) returns (SetBridgeChatDirectionResponse);
  // What a chat has queued for the app and not finished: sending, waiting,
  // failed or of unknown result. A message that is not listed was sent.
  rpc ListBridgeOutbox(ListBridgeOutboxRequest) returns (ListBridgeOutboxResponse);
  // Tries a failed or unknown message again. A message deleted in Chat is
  // never sent: deleting is how a failed message is given up.
  rpc RetryBridgeMessage(RetryBridgeMessageRequest) returns (RetryBridgeMessageResponse);
  // Gives up a failed edit or delete: the message stays as it is in Chat and
  // the app keeps its older version. (A failed send is given up by deleting
  // the message.)
  rpc DismissBridgeMessage(DismissBridgeMessageRequest) returns (DismissBridgeMessageResponse);
  // Signs out of the app (the session ends there too). With delete_chats
  // the synced chats and the contacts imported with them are deleted;
  // without it they stay as read-only copies.
  rpc DisconnectBridgeAccount(DisconnectBridgeAccountRequest) returns (DisconnectBridgeAccountResponse);
}

message BridgeApp {
  // Stable id of the app ("telegram").
  string source = 1;
}

enum BridgeAccountStatus {
  BRIDGE_ACCOUNT_STATUS_UNSPECIFIED = 0;
  // Connected, or reconnecting after a failure.
  BRIDGE_ACCOUNT_STATUS_ACTIVE = 1;
  // The app ended the session: sign in again.
  BRIDGE_ACCOUNT_STATUS_NEEDS_LOGIN = 2;
  // Signed out by the user; its chats remain read-only.
  BRIDGE_ACCOUNT_STATUS_STOPPED = 3;
}

enum BridgeDirection {
  BRIDGE_DIRECTION_UNSPECIFIED = 0;
  // The app is the source; Chat sends nothing back.
  BRIDGE_DIRECTION_IN = 1;
  // What the user writes in the chat is also sent on to the app.
  BRIDGE_DIRECTION_BOTH = 2;
}

message BridgeSyncedChat {
  // The conversation id in the app (opaque).
  string conversation_id = 1;
  int64 chat_id = 2 [jstype = JS_NUMBER];
  // The first import has caught up with the newest message.
  bool caught_up = 3;
  int32 history_window = 4;
  // The conversation's name in the app when it was enabled.
  string title = 5;
  BridgeDirection direction = 6;
}

message BridgeAccount {
  int64 id = 1 [jstype = JS_NUMBER];
  string source = 2;
  BridgeAccountStatus status = 3;
  // Why the connection last failed (a short text, no secret); empty when fine.
  string last_error = 4;
  repeated BridgeSyncedChat chats = 5;
}

message GetBridgeStatusRequest {}

message GetBridgeStatusResponse {
  repeated BridgeApp apps = 1;
  repeated BridgeAccount accounts = 2;
}

enum BridgeLoginStepKind {
  BRIDGE_LOGIN_STEP_KIND_UNSPECIFIED = 0;
  // Ask for the text fields.
  BRIDGE_LOGIN_STEP_KIND_INPUT = 1;
  // Show a code to scan with the app.
  BRIDGE_LOGIN_STEP_KIND_QR = 2;
  // Wait for the user to approve in the app.
  BRIDGE_LOGIN_STEP_KIND_CONFIRM = 3;
  // Signed in: the account is connected.
  BRIDGE_LOGIN_STEP_KIND_DONE = 4;
}

message BridgeLoginField {
  string name = 1;
  string label = 2;
  // A phone number, code or password: not shown back, never stored.
  bool secret = 3;
}

message BridgeLoginStep {
  BridgeLoginStepKind kind = 1;
  // Hand it back in ContinueBridgeLogin; empty once the login is done.
  string login_id = 2;
  repeated BridgeLoginField fields = 3;
  // QR payload or instruction.
  string prompt = 4;
  // Set with DONE.
  BridgeAccount account = 5;
}

message StartBridgeLoginRequest {
  string source = 1;
}

message StartBridgeLoginResponse {
  BridgeLoginStep step = 1;
}

message ContinueBridgeLoginRequest {
  string login_id = 1;
  // Field name to the user's answer.
  map<string, string> input = 2;
}

message ContinueBridgeLoginResponse {
  BridgeLoginStep step = 1;
}

message ListBridgeConversationsRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
}

enum BridgeConversationKind {
  BRIDGE_CONVERSATION_KIND_UNSPECIFIED = 0;
  BRIDGE_CONVERSATION_KIND_PRIVATE = 1;
  BRIDGE_CONVERSATION_KIND_BOT = 2;
  BRIDGE_CONVERSATION_KIND_GROUP = 3;
  BRIDGE_CONVERSATION_KIND_CHANNEL = 4;
}

message BridgeConversation {
  string id = 1;
  BridgeConversationKind kind = 2;
  string title = 3;
  // The synced chat; 0 when not synced.
  int64 chat_id = 4 [jstype = JS_NUMBER];
}

message ListBridgeConversationsResponse {
  repeated BridgeConversation conversations = 1;
}

message EnableBridgeChatRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  // How many of the newest messages to import, 1 to 100000; 0 takes 2000.
  int32 history_window = 3;
  BridgeDirection direction = 4;
}

message EnableBridgeChatResponse {
  int64 chat_id = 1 [jstype = JS_NUMBER];
}

message RemoveBridgeChatRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
}

message RemoveBridgeChatResponse {}

message DisconnectBridgeAccountRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  bool delete_chats = 2;
}

message DisconnectBridgeAccountResponse {}

message SetBridgeChatDirectionRequest {
  int64 account_id = 1 [jstype = JS_NUMBER];
  string conversation_id = 2;
  BridgeDirection direction = 3;
}

message SetBridgeChatDirectionResponse {}

enum BridgeOutboxStatus {
  BRIDGE_OUTBOX_STATUS_UNSPECIFIED = 0;
  // Waiting its turn or for a retry.
  BRIDGE_OUTBOX_STATUS_PENDING = 1;
  // On its way to the app now.
  BRIDGE_OUTBOX_STATUS_SENDING = 2;
  // The app refused it, or it could not be sent after many tries.
  BRIDGE_OUTBOX_STATUS_FAILED = 3;
  // It was on its way when the server stopped, too long ago to repeat on
  // its own: it may or may not have arrived.
  BRIDGE_OUTBOX_STATUS_UNKNOWN = 4;
}

message BridgeOutboxItem {
  int64 seq = 1 [jstype = JS_NUMBER];
  // "send", "edit" or "delete".
  string op = 2;
  BridgeOutboxStatus status = 3;
  // Why it failed or waits, a short text without a secret; may be empty.
  string last_error = 4;
  int32 attempts = 5;
}

message ListBridgeOutboxRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
}

message ListBridgeOutboxResponse {
  repeated BridgeOutboxItem items = 1;
}

message RetryBridgeMessageRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 seq = 2 [jstype = JS_NUMBER];
}

message RetryBridgeMessageResponse {}

message DismissBridgeMessageRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 seq = 2 [jstype = JS_NUMBER];
}

message DismissBridgeMessageResponse {}
