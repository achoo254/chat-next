syntax = "proto3";

package app.v1;

import "app/v1/media.proto";

option go_package = "app.local/server/gen/app/v1;appv1";

// ID convention (ADR 0001): every int64 field marked [jstype = JS_NUMBER]
// (user_id, chat_id, seq, pts, unix-second dates) always holds a value < 2^53
// so JavaScript clients can use a plain number; the server asserts the bound
// when serializing. Every lookup is scoped to the caller's tenant (ADR 0010).

// Profiles, usernames, blocking and privacy settings.
service UsersService {
  // The caller's own user (profile, email from the IdP).
  rpc GetSelf(GetSelfRequest) returns (GetSelfResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc SetUsername(SetUsernameRequest) returns (SetUsernameResponse);
  rpc ResolveUsername(ResolveUsernameRequest) returns (ResolveUsernameResponse);
  // Searches by username/name, and by exact email when the target allows it.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc Block(BlockRequest) returns (BlockResponse);
  rpc Unblock(UnblockRequest) returns (UnblockResponse);
  rpc GetPrivacy(GetPrivacyRequest) returns (GetPrivacyResponse);
  rpc SetPrivacy(SetPrivacyRequest) returns (SetPrivacyResponse);
  // Reports a user, a chat or messages to the tenant's moderation queue.
  rpc Report(ReportRequest) returns (ReportResponse);
  // Contacts: the caller's own list. A user's privacy audience CONTACTS
  // means the users in that user's list (being in someone else's list, or
  // sharing a chat, does not count).
  rpc AddContact(AddContactRequest) returns (AddContactResponse);
  rpc DeleteContact(DeleteContactRequest) returns (DeleteContactResponse);
  rpc GetContacts(GetContactsRequest) returns (GetContactsResponse);
  // Users the caller blocked, most recently blocked first.
  rpc GetBlockedUsers(GetBlockedUsersRequest) returns (GetBlockedUsersResponse);
  // The language the caller's app shows; the assistant bot writes to the
  // caller in it. Apps send it at every start and when the user changes it.
  rpc SetLocale(SetLocaleRequest) returns (SetLocaleResponse);

  // People (ADR 0025): the caller's own grouping of users that are the same
  // person on several apps (a Chat account and the contacts of other apps
  // synced with the bridge). Everything is scoped to the caller; a user the
  // caller has no private chat with is NotFound, the same as an unknown one.
  // The caller's people and the users in each.
  rpc ListPeople(ListPeopleRequest) returns (ListPeopleResponse);
  // Joins two or more users into one person; users already in different
  // people merge those people into one.
  rpc LinkUsers(LinkUsersRequest) returns (LinkUsersResponse);
  // Takes a user out of their person; a person left with one user is removed.
  rpc UnlinkUser(UnlinkUserRequest) returns (UnlinkUserResponse);
  // Pairs that may be the same person, computed when asked and never linked
  // automatically.
  rpc ListLinkSuggestions(ListLinkSuggestionsRequest) returns (ListLinkSuggestionsResponse);
  // The caller says two users are not the same person; the pair is not
  // suggested again.
  rpc RejectLinkSuggestion(RejectLinkSuggestionRequest) returns (RejectLinkSuggestionResponse);
}

// Presence as visible to the caller after privacy rules are applied.
enum UserStatusKind {
  // Hidden by privacy settings or never seen.
  USER_STATUS_KIND_UNSPECIFIED = 0;
  USER_STATUS_KIND_ONLINE = 1;
  // Exact last_seen is shared.
  USER_STATUS_KIND_OFFLINE = 2;
  // Coarse buckets used when the exact time is hidden.
  USER_STATUS_KIND_RECENTLY = 3;
  USER_STATUS_KIND_LAST_WEEK = 4;
  USER_STATUS_KIND_LAST_MONTH = 5;
}

message UserStatus {
  UserStatusKind kind = 1;
  // Set for OFFLINE.
  int64 last_seen = 2 [jstype = JS_NUMBER];
  // Set for ONLINE: when the status lapses to OFFLINE without a new update.
  int64 expires = 3 [jstype = JS_NUMBER];
}

message User {
  int64 id = 1 [jstype = JS_NUMBER];
  // Unique within the tenant; empty when the user has none.
  string username = 2;
  string name = 3;
  string bio = 4;
  MediaRef photo = 5;
  bool is_bot = 6;
  // True only for the caller's own user.
  bool is_self = 7;
  // The caller has blocked this user.
  bool is_blocked = 8;
  UserStatus status = 9;
  // Only for the caller's own user, or when the owner's privacy allows it.
  // Comes from the IdP and is present only while verified there.
  string email = 10;
  // Bots with inline mode enabled: placeholder shown in the input field.
  string bot_inline_placeholder = 11;
  // The account was deleted at the IdP (being erased or erased): clients
  // show it as a deleted account. username, name, bio and email are then
  // empty and nobody can write to it. Never set for the caller's own user.
  bool deleted = 12;
  // The profile picture of the caller's IdP account (an https URL of a
  // Google or GitHub avatar), set only in UsersService answers about the
  // caller (GetSelf, UpdateProfile, SetUsername); empty when the IdP has
  // none. Clients show it where the user has no chat photo.
  string idp_picture = 13;
  // The app this user stands for ("telegram"), set on the puppet users of
  // chats imported by the Chat Bridge (ADR 0022); empty for everyone else.
  // Such a user has no username to show, cannot sign in and is never found,
  // messaged or added to a group.
  string external_source = 14;
}

message GetSelfRequest {
  // A caller without a session gets a response without user instead of an
  // Unauthenticated error. The web app's start-up probe sets it, so a
  // signed-out start does not log a failed request.
  bool allow_signed_out = 1;
}

message GetSelfResponse {
  // Unset only for GetSelfRequest.allow_signed_out without a session.
  User user = 1;
  // The caller may use ModerationService.
  bool is_operator = 2;
  // The account's deletion and its grace period are gone: an account is
  // deleted only at the IdP and erased at once (ADR 0016).
  reserved 3;
  reserved "deletion";
}

message GetUsersRequest {
  repeated int64 user_ids = 1 [jstype = JS_NUMBER];
}

message GetUsersResponse {
  // Unknown or invisible ids are omitted. Visible: the caller, users who
  // share a chat the caller is a member of (current or former members of
  // it), users in the caller's contacts and users who have the caller in
  // theirs.
  repeated User users = 1;
}

message UpdateProfileRequest {
  // Unset fields are left unchanged.
  optional string name = 1;
  optional string bio = 2;
  // file_id of an uploaded photo; empty string removes the photo.
  optional string photo_file_id = 3;
}

message UpdateProfileResponse {
  User user = 1;
}

message SetUsernameRequest {
  string username = 1;
}

message SetUsernameResponse {
  User user = 1;
}

message ResolveUsernameRequest {
  // Found only when the user's find_by_username allows the caller;
  // not_found otherwise.
  string username = 1;
}

message ResolveUsernameResponse {
  User user = 1;
}

message SearchUsersRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchUsersResponse {
  repeated User users = 1;
}

message BlockRequest {
  int64 user_id = 1 [jstype = JS_NUMBER];
}

message BlockResponse {}

message UnblockRequest {
  int64 user_id = 1 [jstype = JS_NUMBER];
}

message UnblockResponse {}

// Who a privacy rule applies to.
enum PrivacyAudience {
  PRIVACY_AUDIENCE_UNSPECIFIED = 0;
  PRIVACY_AUDIENCE_EVERYONE = 1;
  PRIVACY_AUDIENCE_CONTACTS = 2;
  PRIVACY_AUDIENCE_NOBODY = 3;
}

message PrivacySettings {
  PrivacyAudience last_seen = 1;
  PrivacyAudience profile_photo = 2;
  PrivacyAudience find_by_email = 3;
  PrivacyAudience find_by_username = 4;
  PrivacyAudience add_to_groups = 5;
  PrivacyAudience send_messages = 6;
  // Show message content in push notifications.
  bool notification_preview = 7;
}

message GetPrivacyRequest {}

message GetPrivacyResponse {
  PrivacySettings settings = 1;
}

message SetPrivacyRequest {
  // Unset fields are left unchanged.
  optional PrivacyAudience last_seen = 1;
  optional PrivacyAudience profile_photo = 2;
  optional PrivacyAudience find_by_email = 3;
  optional PrivacyAudience find_by_username = 4;
  optional PrivacyAudience add_to_groups = 5;
  optional PrivacyAudience send_messages = 6;
  optional bool notification_preview = 7;
}

message SetPrivacyResponse {
  PrivacySettings settings = 1;
}

enum ReportReason {
  REPORT_REASON_UNSPECIFIED = 0;
  REPORT_REASON_SPAM = 1;
  REPORT_REASON_VIOLENCE = 2;
  REPORT_REASON_CHILD_ABUSE = 3;
  REPORT_REASON_ILLEGAL = 4;
  REPORT_REASON_PERSONAL_DATA = 5;
  REPORT_REASON_OTHER = 6;
  REPORT_REASON_SCAM = 7;
  REPORT_REASON_SEXUAL = 8;
}

message ReportedMessages {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  repeated int64 seqs = 2 [jstype = JS_NUMBER];
}

message ReportRequest {
  oneof target {
    int64 user_id = 1 [jstype = JS_NUMBER];
    int64 chat_id = 2 [jstype = JS_NUMBER];
    ReportedMessages messages = 3;
  }
  ReportReason reason = 4;
  // Free text from the reporter, up to 1000 code points.
  string comment = 5;
}

message ReportResponse {}

message AddContactRequest {
  oneof target {
    // A user the caller can already see (GetUsers rules).
    int64 user_id = 1 [jstype = JS_NUMBER];
    // Exact username, with or without the leading @. Found only when the
    // user's find_by_username allows the caller.
    string username = 2;
    // Exact email. Found only when the user's find_by_email allows the
    // caller.
    string email = 3;
  }
}

message AddContactResponse {
  User user = 1;
}

message DeleteContactRequest {
  int64 user_id = 1 [jstype = JS_NUMBER];
}

message DeleteContactResponse {}

message GetContactsRequest {
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 1;
  int32 limit = 2;
}

message GetContactsResponse {
  repeated User users = 1;
  // Empty when there are no more contacts.
  string next_cursor = 2;
  // The same contacts, in the same order, with when each was added.
  repeated Contact contacts = 3;
}

message Contact {
  int64 user_id = 1 [jstype = JS_NUMBER];
  // Unix seconds when the caller added the user.
  int64 added_at = 2 [jstype = JS_NUMBER];
}

message GetBlockedUsersRequest {
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 1;
  // Default 50, at most 200.
  int32 limit = 2;
}

message BlockedUser {
  int64 user_id = 1 [jstype = JS_NUMBER];
  int64 blocked_at = 2 [jstype = JS_NUMBER];
}

message GetBlockedUsersResponse {
  repeated BlockedUser blocked = 1;
  repeated User users = 2;
  // Empty when there are no more blocked users.
  string next_cursor = 3;
}

message SetLocaleRequest {
  // "vi", "en" or "zh-CN"; anything else is InvalidArgument.
  string locale = 1;
}

message SetLocaleResponse {}

// One identity of a person: a user of Chat or of another app, with the
// private chat the caller has with them.
message PersonMember {
  int64 user_id = 1 [jstype = JS_NUMBER];
  // The user's name now (it can change after the link).
  string name = 2;
  // The app the user belongs to: "telegram", ...; empty for a Chat account.
  string app = 3;
  // The caller's private chat with this user.
  int64 chat_id = 4 [jstype = JS_NUMBER];
}

message Person {
  int64 id = 1 [jstype = JS_NUMBER];
  // Fixed when the link is made (the name of the Chat account if one is
  // linked, else the name of the first user); it does not follow later
  // renames and cannot be edited.
  string name = 2;
  // At least two users, oldest link first.
  repeated PersonMember members = 3;
}

message ListPeopleRequest {}

message ListPeopleResponse {
  repeated Person people = 1;
}

message LinkUsersRequest {
  // Two to 20 distinct users, none of them the caller.
  repeated int64 user_ids = 1 [jstype = JS_NUMBER];
}

message LinkUsersResponse {
  Person person = 1;
}

message UnlinkUserRequest {
  int64 user_id = 1 [jstype = JS_NUMBER];
}

message UnlinkUserResponse {}

enum LinkSuggestionReason {
  LINK_SUGGESTION_REASON_UNSPECIFIED = 0;
  // The two names are equal after folding case, accents and spaces. Weak:
  // the app shows it as «same name, not verified».
  LINK_SUGGESTION_REASON_NAME = 1;
}

message LinkSuggestion {
  PersonMember first = 1;
  PersonMember second = 2;
  LinkSuggestionReason reason = 3;
}

message ListLinkSuggestionsRequest {
  // When set, only the suggestions that involve this user.
  int64 user_id = 1 [jstype = JS_NUMBER];
}

message ListLinkSuggestionsResponse {
  repeated LinkSuggestion suggestions = 1;
}

message RejectLinkSuggestionRequest {
  int64 user_a = 1 [jstype = JS_NUMBER];
  int64 user_b = 2 [jstype = JS_NUMBER];
}

message RejectLinkSuggestionResponse {}
