syntax = "proto3";

package app.v1;

import "app/v1/bot_admin.proto";
import "app/v1/chats.proto";
import "app/v1/media.proto";
import "app/v1/messages.proto";
import "app/v1/users.proto";

option go_package = "app.local/server/gen/app/v1;appv1";

// ID convention (ADR 0001): every int64 field marked [jstype = JS_NUMBER]
// always holds a value < 2^53; the server asserts the bound when serializing.
//
// A bot is a user with is_bot; bot_id is that user's id. Bots belong to one
// tenant and never see secret chats. This service is the client side of the
// bot platform; bots themselves use the HTTP Bot API.

// Client interactions with bots.
service BotsService {
  // Forwards an inline query to a bot with inline mode on (User.
  // bot_inline_placeholder not empty) and waits up to 10 s for its results.
  // The bot gets the query, the offset, the caller and the kind of chat,
  // never the chat's messages. The caller must be able to send messages in
  // chat_id. A bot that does not answer in time gives failed_precondition
  // "bot_timeout"; a bot without inline mode "inline_off".
  rpc InlineQuery(InlineQueryRequest) returns (InlineQueryResponse);
  // Returns the Mini App URL and signed init data for the container. The
  // URL must be the bot's main Mini App (url empty) or the mini_app_url of
  // an inline button of the message at chat_id/seq, which the caller can
  // see; anything else is invalid_argument.
  rpc OpenMiniApp(OpenMiniAppRequest) returns (OpenMiniAppResponse);
  // The Mini App asked to message the user (bridge request_write_access) and
  // the user agreed: records the user's consent for the bot, as pressing
  // Bắt đầu does, without sending a start message.
  rpc AllowMiniAppWrite(AllowMiniAppWriteRequest) returns (AllowMiniAppWriteResponse);
  // The Mini App sent data to its bot (bridge data_send). Posts a message
  // from the caller to the private chat with the bot carrying
  // ActionMiniAppData; the bot gets it as web_app_data. Only for a Mini App
  // opened from the bot's private chat or its profile.
  rpc SendMiniAppData(SendMiniAppDataRequest) returns (SendMiniAppDataResponse);
  // Records the user's consent, opens the private chat with the bot and
  // sends the start message (after the client confirmed a deep link).
  // Deep links have the form https://chat.<domain>/b/<username>?start=<param>:
  // the client resolves the username with UsersService.ResolveUsername
  // (User.is_bot must be set), shows GetBotInfo and asks before starting.
  rpc StartBot(StartBotRequest) returns (StartBotResponse);
  // Public profile of a bot: description, about and the command menu for
  // a chat.
  rpc GetBotInfo(GetBotInfoRequest) returns (GetBotInfoResponse);
  // The command menus of the bots in a group, for the composer's command
  // menu: one entry per bot member with commands for the caller (the
  // GROUP_ADMIN list for admins, else GROUP, then DEFAULT). Empty for chats
  // that are not groups.
  rpc GetChatBotCommands(GetChatBotCommandsRequest) returns (GetChatBotCommandsResponse);
}

enum InlineResultKind {
  INLINE_RESULT_KIND_UNSPECIFIED = 0;
  INLINE_RESULT_KIND_ARTICLE = 1;
  INLINE_RESULT_KIND_PHOTO = 2;
  INLINE_RESULT_KIND_VIDEO = 3;
  INLINE_RESULT_KIND_AUDIO = 4;
  INLINE_RESULT_KIND_VOICE = 5;
  INLINE_RESULT_KIND_DOCUMENT = 6;
}

message InlineResult {
  // Bot-chosen id, unique within the query.
  string id = 1;
  InlineResultKind kind = 2;
  string title = 3;
  string description = 4;
  // File-backed results.
  MediaRef media = 5;
  // Not used: article thumbnails come as thumbnail.
  string thumbnail_url = 6;
  // Preview image of an article (a photo of the bot); file-backed results
  // preview their media. Download with GetFileUrl in the inline_query_id
  // context of this query.
  MediaRef thumbnail = 7;
}

message InlineQueryRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // Chat the user is typing in.
  int64 chat_id = 2 [jstype = JS_NUMBER];
  string query = 3;
  // next_offset of the previous page; empty for the first page.
  string offset = 4;
}

message InlineQueryResponse {
  // Identifies the server-cached answer when a result is chosen.
  string query_id = 1;
  repeated InlineResult results = 2;
  // Empty when there are no more results.
  string next_offset = 3;
  // Show results as a media grid instead of a list.
  bool gallery = 4;
  int32 cache_time_seconds = 5;
}

message OpenMiniAppRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // Chat the Mini App is opened from; 0 when opened from the bot profile.
  int64 chat_id = 2 [jstype = JS_NUMBER];
  // Message whose inline button opened it; 0 otherwise.
  int64 seq = 3 [jstype = JS_NUMBER];
  // Button URL; empty opens the bot's main Mini App.
  string url = 4;
  string start_param = 5;
  // Client theme colours passed to the Mini App.
  map<string, string> theme_params = 6;
}

message OpenMiniAppResponse {
  // The https URL to load, on the bot owner's domain (validated when the bot
  // set it); the container talks only to this URL's origin.
  string url = 1;
  // Init data for the Mini App, a query string (user, chat_type, chat_instance,
  // start_param, auth_date, bot_id, tenant_id) signed with Ed25519 in
  // `signature` (base64url) over "<bot_id>:WebAppData\n" followed by the
  // other fields as sorted key=value lines; verify with the platform public
  // key (Bot API getMiniAppKey) and the SDK helpers.
  string init_data = 2;
}

message AllowMiniAppWriteRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
}

message AllowMiniAppWriteResponse {}

message SendMiniAppDataRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // Up to 4096 bytes.
  string data = 2;
  // Text of the button that opened the Mini App ("" for the main one).
  string button_text = 3;
}

message SendMiniAppDataResponse {}

message StartBotRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // Deep-link start parameter; may be empty. Up to 64 characters of
  // A-Z, a-z, 0-9, _ and -. The bot receives "/start <param>" (or "/start").
  string start_param = 2;
  // Client-generated (< 2^53) dedupe key for the start message.
  int64 random_id = 3 [jstype = JS_NUMBER];
}

message StartBotResponse {
  Chat chat = 1;
  Message message = 2;
  repeated User users = 3;
  SyncAck ack = 4;
}

message GetBotInfoRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // Chat the menu is for: 0 (or the private chat with the bot) for the
  // private scope, a group for the group scopes.
  int64 chat_id = 2 [jstype = JS_NUMBER];
}

message GetBotInfoResponse {
  User user = 1;
  string description = 2;
  string about = 3;
  // The command menu for the caller in chat_id: the most specific list set
  // (GROUP_ADMIN for admins, GROUP or PRIVATE, then DEFAULT).
  repeated BotCommand commands = 4;
  // The caller owns the bot (Developer Console manages it).
  bool is_owner = 5;
  // Owner only: Unix seconds when the bot last asked for updates (long poll
  // getUpdates), kept to within about 30 seconds; 0 when it never did or
  // the caller is not the owner.
  int64 last_update_at = 6 [jstype = JS_NUMBER];
  // Owner only: the bot has not asked for updates in the last 2 minutes (or
  // never did), judged by the server's clock; false for anyone else.
  bool not_running = 7;
  // The bot's main Mini App ("Mở app" in its chat and profile); "" without one.
  string mini_app_url = 8;
}

message GetChatBotCommandsRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
}

// One bot's command menu in a group.
message ChatBotCommands {
  // The bot (is_bot set; username always present).
  User bot = 1;
  repeated BotCommand commands = 2;
}

message GetChatBotCommandsResponse {
  // Bots in the order they joined; bots without commands for the caller
  // are left out.
  repeated ChatBotCommands bots = 1;
  // Every bot in the group, with or without commands. With more than one
  // the client sends a picked command as "/command@username", so only that
  // bot takes it.
  int32 bot_count = 2;
}
