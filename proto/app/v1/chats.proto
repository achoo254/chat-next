syntax = "proto3";

package app.v1;

import "app/v1/media.proto";
import "app/v1/messages.proto";
import "app/v1/users.proto";

option go_package = "app.local/server/gen/app/v1;appv1";

// ID convention (ADR 0001): every int64 field marked [jstype = JS_NUMBER]
// (user_id, chat_id, seq, pts, unix-second dates) always holds a value < 2^53
// so JavaScript clients can use a plain number; the server asserts the bound
// when serializing. Every chat, including 1-1, has its own chat_id; chats and
// members never cross tenants (ADR 0010).

// Chats, members, permissions and the dialog list.
service ChatsService {
  // Returns the existing private chat with the user when there is one.
  rpc CreatePrivate(CreatePrivateRequest) returns (CreatePrivateResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc GetDialogs(GetDialogsRequest) returns (GetDialogsResponse);
  rpc GetChat(GetChatRequest) returns (GetChatResponse);
  // Channels: admins only.
  rpc GetMembers(GetMembersRequest) returns (GetMembersResponse);
  // Banned users (see RemoveMember) come back in failed_user_ids unless the
  // caller is an admin; an admin adding them lifts the ban.
  rpc AddMembers(AddMembersRequest) returns (AddMembersResponse);
  // Removes a member, by default also banning them (ban unset or true): a
  // banned user cannot rejoin through any invite link, nor be added back by
  // a non-admin, until an admin unbans them, and the invite links they
  // created in the chat are revoked. ban = false only removes.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // The owner leaving hands ownership to the longest-serving admin. When
  // other members remain but none is an admin, it fails with
  // failed_precondition (message prefix "owner_needs_admin"); only this
  // case returns failed_precondition here.
  rpc LeaveChat(LeaveChatRequest) returns (LeaveChatResponse);
  // Lifts a ban (admins). The user is not added back.
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse);
  // Users banned from the chat, by user id (admins).
  rpc GetBannedMembers(GetBannedMembersRequest) returns (GetBannedMembersResponse);
  // Sets one member's permission bitmask.
  rpc SetMemberPermissions(SetMemberPermissionsRequest) returns (SetMemberPermissionsResponse);
  rpc SetAdmin(SetAdminRequest) returns (SetAdminResponse);
  // Creates an invite link (>= 128 bits of entropy).
  rpc ExportInviteLink(ExportInviteLinkRequest) returns (ExportInviteLinkResponse);
  // Joins after the user confirmed in the client. A link works only while
  // its creator is still a member allowed to invite; a banned user gets
  // permission_denied.
  rpc JoinByInvite(JoinByInviteRequest) returns (JoinByInviteResponse);
  rpc SetHistoryVisibility(SetHistoryVisibilityRequest) returns (SetHistoryVisibilityResponse);
  rpc UpdateChatInfo(UpdateChatInfoRequest) returns (UpdateChatInfoResponse);
  // The caller's dialogs of the given chats (read state, top message), e.g.
  // to refresh a few chats without reloading the whole list.
  rpc GetPeerDialogs(GetPeerDialogsRequest) returns (GetPeerDialogsResponse);
  // Previews the chat behind an invite link before the user confirms.
  rpc CheckInvite(CheckInviteRequest) returns (CheckInviteResponse);
  rpc GetInviteLinks(GetInviteLinksRequest) returns (GetInviteLinksResponse);
  rpc RevokeInviteLink(RevokeInviteLinkRequest) returns (RevokeInviteLinkResponse);
  // Forum topics of a group (Chat.forum). A topic is metadata of the group:
  // its messages carry topic_id inside the group's single seq, and sync stays
  // per chat.
  rpc GetForumTopics(GetForumTopicsRequest) returns (GetForumTopicsResponse);
  rpc CreateForumTopic(CreateForumTopicRequest) returns (CreateForumTopicResponse);
  rpc EditForumTopic(EditForumTopicRequest) returns (EditForumTopicResponse);
  // Only admins post in a closed topic.
  rpc CloseForumTopic(CloseForumTopicRequest) returns (CloseForumTopicResponse);
  // A hidden topic leaves the topic list; its messages stay readable and
  // searchable by members.
  rpc HideForumTopic(HideForumTopicRequest) returns (HideForumTopicResponse);
  // Mutes or unmutes the caller's notifications of a chat (Dialog.mute_until).
  // The caller's other sessions get dialog_mute.
  rpc SetDialogMute(SetDialogMuteRequest) returns (SetDialogMuteResponse);
  // Pins a chat on top of the caller's list or unpins it, at most 5 chats;
  // one more fails with failed_precondition
  // (message prefix "pinned_dialogs_limit"). The caller's sessions get
  // pinned_dialogs.
  rpc SetDialogPinned(SetDialogPinnedRequest) returns (SetDialogPinnedResponse);
  // Reorders the caller's pinned chats; chat_ids must be exactly the pinned
  // chats.
  rpc ReorderPinnedDialogs(ReorderPinnedDialogsRequest) returns (ReorderPinnedDialogsResponse);
  // Groups and channels: the owner deletes the chat for every member (each
  // gets chat_deleted with for_everyone; messages are purged from the server
  // within the hour). Private chats: removes the chat and its history for
  // the caller only; it comes back with the next message.
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
  // Groups both the caller and the user are current members of, and
  // channels where the user is a member and the caller an admin (channel
  // members are visible to admins only).
  rpc GetCommonChats(GetCommonChatsRequest) returns (GetCommonChatsResponse);
  // Marks a chat as unread for the caller (Dialog.unread_mark) or clears
  // the mark; reading the chat (ReadHistory) clears it too. The caller's
  // sessions get dialog_unread_mark.
  rpc SetDialogUnreadMark(SetDialogUnreadMarkRequest) returns (SetDialogUnreadMarkResponse);
  // How many members of a group are online now, counted on the server
  // (approximate: cached briefly, capped). Members whose last-seen privacy
  // hides their status from the caller are not counted. Channels: admins
  // only.
  rpc GetChatOnlineCount(GetChatOnlineCountRequest) returns (GetChatOnlineCountResponse);
  // The caller's notification settings (defaults until changed).
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse);
  // Changes the given settings; the caller's sessions get
  // notification_settings.
  rpc SetNotificationSettings(SetNotificationSettingsRequest) returns (SetNotificationSettingsResponse);
}

// Why a user was not added to a chat (AddMembers, CreateGroup).
enum AddMemberFailureReason {
  ADD_MEMBER_FAILURE_REASON_UNSPECIFIED = 0;
  // No such user in the tenant.
  ADD_MEMBER_FAILURE_REASON_NOT_FOUND = 1;
  // The user's add_to_groups privacy setting refuses the caller.
  ADD_MEMBER_FAILURE_REASON_PRIVACY_ADD_TO_GROUPS = 2;
  // The user blocked the caller.
  ADD_MEMBER_FAILURE_REASON_BLOCKED = 3;
  // Banned from the chat; only an admin may add them back.
  ADD_MEMBER_FAILURE_REASON_BANNED = 4;
  // Already a member; nothing to do.
  ADD_MEMBER_FAILURE_REASON_ALREADY_MEMBER = 5;
  // The chat reached its member limit.
  ADD_MEMBER_FAILURE_REASON_TOO_MANY = 6;
}

message AddMemberFailure {
  int64 user_id = 1 [jstype = JS_NUMBER];
  AddMemberFailureReason reason = 2;
}

// Same name `type` and values in DB, proto and JSON.
enum ChatType {
  CHAT_TYPE_UNSPECIFIED = 0;
  CHAT_TYPE_PRIVATE = 1;
  CHAT_TYPE_GROUP = 2;
  CHAT_TYPE_CHANNEL = 3;
  // End-to-end chat: never indexed, no bots, no multi-device sync.
  CHAT_TYPE_SECRET = 4;
}

// How updates of a chat are synced (ADR 0002). The switch SMALL -> LARGE is
// one-way and announced by the chat_mode_changed update.
enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0;
  // Fan-out on write into every member's per-user log (pts).
  SYNC_MODE_SMALL = 1;
  // Per-chat log (chat_pts) pulled with GetChatDifference.
  SYNC_MODE_LARGE = 2;
}

enum HistoryVisibility {
  HISTORY_VISIBILITY_UNSPECIFIED = 0;
  // New members can read history from before they joined (default).
  HISTORY_VISIBILITY_SHARED = 1;
  // New members only see messages sent after they joined.
  HISTORY_VISIBILITY_SINCE_JOIN = 2;
}

enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_MEMBER = 1;
  MEMBER_ROLE_ADMIN = 2;
  MEMBER_ROLE_OWNER = 3;
}

// Bit values combined into the uint32 `permissions` fields.
enum ChatPermission {
  CHAT_PERMISSION_UNSPECIFIED = 0;
  CHAT_PERMISSION_SEND_MESSAGES = 1;
  CHAT_PERMISSION_SEND_MEDIA = 2;
  CHAT_PERMISSION_ADD_MEMBERS = 4;
  CHAT_PERMISSION_PIN_MESSAGES = 8;
  CHAT_PERMISSION_CHANGE_INFO = 16;
  // Create forum topics and edit the ones the member created.
  CHAT_PERMISSION_MANAGE_TOPICS = 32;
}

message Chat {
  int64 id = 1 [jstype = JS_NUMBER];
  ChatType type = 2;
  // Empty for private and secret chats (clients show the peer's name).
  string title = 3;
  string about = 4;
  MediaRef photo = 5;
  // PRIVATE and SECRET: the other participant.
  int64 peer_user_id = 6 [jstype = JS_NUMBER];
  SyncMode sync_mode = 7;
  HistoryVisibility history_visibility = 8;
  int32 member_count = 9;
  // ChatPermission bits granted to ordinary members.
  uint32 default_permissions = 10;
  // Newest pinned message (highest seq); 0 when none. Dialog carries the
  // caller's view (pinned_message_seq, pinned_message_count).
  int64 pinned_seq = 11 [jstype = JS_NUMBER];
  int64 created_at = 12 [jstype = JS_NUMBER];
  // Caller-specific view.
  MemberRole my_role = 13;
  // Effective ChatPermission bits of the caller.
  uint32 my_permissions = 14;
  // The caller is no longer a member (left or removed).
  bool left = 15;
  // GROUP only: messages are organised in forum topics (ForumTopic). Once on
  // it stays on.
  bool forum = 16;
}

message ChatMember {
  int64 user_id = 1 [jstype = JS_NUMBER];
  MemberRole role = 2;
  uint32 permissions = 3;
  int64 joined_at = 4 [jstype = JS_NUMBER];
  int64 inviter_id = 5 [jstype = JS_NUMBER];
}

// One entry of the caller's chat list.
message Dialog {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 top_seq = 2 [jstype = JS_NUMBER];
  // Highest seq the caller has read.
  int64 read_inbox_max_seq = 3 [jstype = JS_NUMBER];
  // Highest seq of the caller's own messages read by others.
  int64 read_outbox_max_seq = 4 [jstype = JS_NUMBER];
  // Counted up to 1000; clients show 1000 as "999+".
  int32 unread_count = 5;
  // Unread messages that mention the caller (@username or a mention by
  // id) or reply to them; counted up to 1000.
  int32 unread_mentions_count = 6;
  // sync_mode=large only: chat_pts to pass to GetChatDifference.
  int64 chat_pts = 7 [jstype = JS_NUMBER];
  // Notifications muted until this unix second; 0 when not muted (or the
  // mute ended). 2147483647 means until unmuted (muted forever). Clients
  // leave muted chats out of the total unread badge by default.
  int64 mute_until = 8 [jstype = JS_NUMBER];
  // Pinned on top of the caller's list (order in GetDialogsResponse
  // .pinned_chat_ids and UpdatePinnedDialogs).
  bool pinned = 9;
  // Pinned messages of the chat the caller can see (history visibility,
  // not hidden for them), and the newest of them (0 when none).
  int32 pinned_message_count = 10;
  int64 pinned_message_seq = 11 [jstype = JS_NUMBER];
  // The caller marked the chat as unread (SetDialogUnreadMark).
  bool unread_mark = 12;
}

message InviteLink {
  string link = 1;
  int64 creator_id = 2 [jstype = JS_NUMBER];
  // 0 = never expires.
  int64 expires_at = 3 [jstype = JS_NUMBER];
  // 0 = unlimited.
  int32 usage_limit = 4;
  int32 usage_count = 5;
  bool revoked = 6;
}

// Topic of a forum group. Topic 1 is the default "General" topic, created
// when the forum is turned on; messages sent without a topic land there.
message ForumTopic {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 id = 2 [jstype = JS_NUMBER];
  string title = 3;
  // 0xRRGGBB of the topic icon.
  int32 icon_color = 4;
  int64 creator_id = 5 [jstype = JS_NUMBER];
  int64 created_at = 6 [jstype = JS_NUMBER];
  bool pinned = 7;
  bool closed = 8;
  bool hidden = 9;
  // Newest message of the topic; 0 when it has none.
  int64 top_seq = 10 [jstype = JS_NUMBER];
  // Caller-specific read state (GetForumTopics only; 0 in updates).
  int64 read_inbox_max_seq = 11 [jstype = JS_NUMBER];
  // Counted up to 1000.
  int32 unread_count = 12;
  // Name of the topic's icon glyph from the client's icon set (lowercase
  // letters, digits and '-', at most 32); empty for the default.
  string icon = 13;
  // Messages in the topic that are not deleted, service messages included.
  int32 message_count = 14;
  // Caller-specific (GetForumTopics only): unread messages that mention the
  // caller or reply to them, counted up to 1000.
  int32 unread_mentions_count = 15;
}

// A user removed from a chat by an admin.
message BannedMember {
  int64 user_id = 1 [jstype = JS_NUMBER];
  int64 banned_by = 2 [jstype = JS_NUMBER];
  int64 banned_at = 3 [jstype = JS_NUMBER];
}

message CreatePrivateRequest {
  int64 user_id = 1 [jstype = JS_NUMBER];
}

message CreatePrivateResponse {
  Chat chat = 1;
  repeated User users = 2;
}

message CreateGroupRequest {
  string title = 1;
  repeated int64 user_ids = 2 [jstype = JS_NUMBER];
  // Create the group with forum topics on.
  bool forum = 3;
}

message CreateGroupResponse {
  Chat chat = 1;
  repeated User users = 2;
  // Users not added because of their privacy settings or blocks.
  repeated int64 failed_user_ids = 3 [jstype = JS_NUMBER];
  SyncAck ack = 4;
  // Every user not added, with the reason.
  repeated AddMemberFailure failures = 5;
}

message CreateChannelRequest {
  string title = 1;
  string about = 2;
}

message CreateChannelResponse {
  Chat chat = 1;
  SyncAck ack = 2;
}

message GetDialogsRequest {
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 1;
  int32 limit = 2;
}

message GetDialogsResponse {
  // The first page starts with every pinned dialog (pinned order), followed
  // by up to limit other dialogs, newest activity first; later pages hold
  // unpinned dialogs only. A private chat the caller deleted for themselves
  // is left out until a new message arrives.
  repeated Dialog dialogs = 1;
  // Top message of each dialog.
  repeated Message messages = 2;
  repeated Chat chats = 3;
  repeated User users = 4;
  // Empty when there are no more dialogs.
  string next_cursor = 5;
  // First page only: the caller's pinned chats, top first.
  repeated int64 pinned_chat_ids = 6 [jstype = JS_NUMBER];
}

message GetChatRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
}

message GetChatResponse {
  Chat chat = 1;
  // The peer of a private chat.
  repeated User users = 2;
}

message GetMembersRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  // Optional name/username filter.
  string query = 2;
  string cursor = 3;
  int32 limit = 4;
}

message GetMembersResponse {
  repeated ChatMember members = 1;
  repeated User users = 2;
  string next_cursor = 3;
}

message AddMembersRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  repeated int64 user_ids = 2 [jstype = JS_NUMBER];
}

message AddMembersResponse {
  // Users not added for privacy, blocks, bans or the member limit (already
  // members are not listed here; see failures).
  repeated int64 failed_user_ids = 1 [jstype = JS_NUMBER];
  SyncAck ack = 2;
  // Every user not added, already members included, with the reason.
  repeated AddMemberFailure failures = 3;
}

message RemoveMemberRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 user_id = 2 [jstype = JS_NUMBER];
  // Unset or true: remove and ban (see RemoveMember). false: remove only;
  // the user may rejoin through a valid invite link and keeps their links.
  optional bool ban = 3;
}

message RemoveMemberResponse {
  SyncAck ack = 1;
}

message LeaveChatRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  // Owner only: the admin who becomes the owner; 0 picks the
  // longest-serving admin. Not a current admin: invalid_argument.
  int64 new_owner_id = 2 [jstype = JS_NUMBER];
}

message LeaveChatResponse {
  SyncAck ack = 1;
}

message SetMemberPermissionsRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 user_id = 2 [jstype = JS_NUMBER];
  uint32 permissions = 3;
}

message SetMemberPermissionsResponse {
  SyncAck ack = 1;
}

message SetAdminRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 user_id = 2 [jstype = JS_NUMBER];
  // false demotes back to member.
  bool admin = 3;
}

message SetAdminResponse {
  SyncAck ack = 1;
}

message ExportInviteLinkRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  // 0 = never expires.
  int64 expires_at = 2 [jstype = JS_NUMBER];
  // 0 = unlimited.
  int32 usage_limit = 3;
}

message ExportInviteLinkResponse {
  InviteLink invite = 1;
}

message JoinByInviteRequest {
  // The full link or its token part.
  string link = 1;
}

message JoinByInviteResponse {
  Chat chat = 1;
  repeated User users = 2;
  SyncAck ack = 3;
}

message SetHistoryVisibilityRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  HistoryVisibility history_visibility = 2;
}

message SetHistoryVisibilityResponse {
  SyncAck ack = 1;
}

message UpdateChatInfoRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  // Unset fields are left unchanged.
  optional string title = 2;
  optional string about = 3;
  // Empty string removes the photo.
  optional string photo_file_id = 4;
  optional uint32 default_permissions = 5;
  // GROUP only; true turns forum topics on (it cannot be turned off).
  optional bool forum = 6;
}

message UpdateChatInfoResponse {
  Chat chat = 1;
  SyncAck ack = 2;
}

message GetPeerDialogsRequest {
  repeated int64 chat_ids = 1 [jstype = JS_NUMBER];
}

message GetPeerDialogsResponse {
  // Only chats the caller is a member of; unknown ids are omitted.
  repeated Dialog dialogs = 1;
  repeated Message messages = 2;
  repeated Chat chats = 3;
  repeated User users = 4;
}

message CheckInviteRequest {
  // The full link or its token part.
  string link = 1;
}

message CheckInviteResponse {
  string title = 1;
  string about = 2;
  ChatType type = 3;
  int32 member_count = 4;
  // Set when the caller is already a member: open this chat instead.
  Chat chat = 5;
  // Groups only: a few members to show (admins first), with their users.
  repeated int64 member_ids = 6 [jstype = JS_NUMBER];
  repeated User users = 7;
  // Whether new members can read the history from before they join.
  HistoryVisibility history_visibility = 8;
}

message GetInviteLinksRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
}

message GetInviteLinksResponse {
  // Active links first, newest first.
  repeated InviteLink invites = 1;
}

message RevokeInviteLinkRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  string link = 2;
}

message RevokeInviteLinkResponse {
  InviteLink invite = 1;
}

message GetForumTopicsRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 2;
  // Default 100, at most 500. A forum has at most 1000 topics.
  int32 limit = 3;
}

message GetForumTopicsResponse {
  // Pinned topics first, then by newest message. Hidden topics are included
  // with hidden set; clients leave them out of the list.
  repeated ForumTopic topics = 1;
  // Top message of each topic.
  repeated Message messages = 2;
  repeated User users = 3;
  // Empty when there are no more topics.
  string next_cursor = 4;
}

message CreateForumTopicRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  string title = 2;
  int32 icon_color = 3;
  // See ForumTopic.icon.
  string icon = 4;
}

message CreateForumTopicResponse {
  ForumTopic topic = 1;
  SyncAck ack = 2;
}

message EditForumTopicRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 topic_id = 2 [jstype = JS_NUMBER];
  // Unset fields are left unchanged.
  optional string title = 3;
  optional int32 icon_color = 4;
  // Admins only.
  optional bool pinned = 5;
  // See ForumTopic.icon.
  optional string icon = 6;
}

message EditForumTopicResponse {
  ForumTopic topic = 1;
  SyncAck ack = 2;
}

message CloseForumTopicRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 topic_id = 2 [jstype = JS_NUMBER];
  bool closed = 3;
}

message CloseForumTopicResponse {
  ForumTopic topic = 1;
  SyncAck ack = 2;
}

message HideForumTopicRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 topic_id = 2 [jstype = JS_NUMBER];
  bool hidden = 3;
}

message HideForumTopicResponse {
  ForumTopic topic = 1;
  SyncAck ack = 2;
}

message UnbanMemberRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  int64 user_id = 2 [jstype = JS_NUMBER];
}

message UnbanMemberResponse {}

message GetBannedMembersRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 2;
  int32 limit = 3;
}

message GetBannedMembersResponse {
  repeated BannedMember members = 1;
  repeated User users = 2;
  // Empty when there are no more banned users.
  string next_cursor = 3;
}

message SetDialogMuteRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  // Mute for this many seconds from now, 1 to 31622400 (366 days). 0 with
  // forever unset unmutes.
  int32 duration_seconds = 2;
  // Mute until unmuted; duration_seconds is then ignored.
  bool forever = 3;
}

message SetDialogMuteResponse {
  // As Dialog.mute_until.
  int64 mute_until = 1 [jstype = JS_NUMBER];
  SyncAck ack = 2;
}

message SetDialogPinnedRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  // true pins on top of the list; false unpins.
  bool pinned = 2;
}

message SetDialogPinnedResponse {
  // The caller's pinned chats after the change, top first.
  repeated int64 pinned_chat_ids = 1 [jstype = JS_NUMBER];
  SyncAck ack = 2;
}

message ReorderPinnedDialogsRequest {
  // Every pinned chat of the caller, top first.
  repeated int64 chat_ids = 1 [jstype = JS_NUMBER];
}

message ReorderPinnedDialogsResponse {
  repeated int64 pinned_chat_ids = 1 [jstype = JS_NUMBER];
  SyncAck ack = 2;
}

message DeleteChatRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
}

message DeleteChatResponse {
  SyncAck ack = 1;
}

message SetDialogUnreadMarkRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
  // true marks the chat as unread; false clears the mark.
  bool unread = 2;
}

message SetDialogUnreadMarkResponse {
  SyncAck ack = 1;
}

message GetChatOnlineCountRequest {
  int64 chat_id = 1 [jstype = JS_NUMBER];
}

message GetChatOnlineCountResponse {
  // Members online now, the caller included when online. Counting stops
  // at 10000 (clients show "10000+").
  int32 online_count = 1;
}

// Notification sound of the user's devices.
enum NotificationSound {
  NOTIFICATION_SOUND_UNSPECIFIED = 0;
  NOTIFICATION_SOUND_DEFAULT = 1;
  NOTIFICATION_SOUND_SOFT = 2;
  NOTIFICATION_SOUND_OFF = 3;
}

// Per-user notification settings, kept on the server and synced to every
// session. Per chat type: notify at all (enabled) and show the message text
// (preview). A muted chat (Dialog.mute_until) never notifies.
message NotificationSettings {
  bool private_enabled = 1;
  bool private_preview = 2;
  bool groups_enabled = 3;
  bool groups_preview = 4;
  bool channels_enabled = 5;
  bool channels_preview = 6;
  NotificationSound sound = 7;
  // Count muted chats in the unread badge (default false).
  bool badge_muted = 8;
}

message GetNotificationSettingsRequest {}

message GetNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

message SetNotificationSettingsRequest {
  // Unset fields are left unchanged.
  optional bool private_enabled = 1;
  optional bool private_preview = 2;
  optional bool groups_enabled = 3;
  optional bool groups_preview = 4;
  optional bool channels_enabled = 5;
  optional bool channels_preview = 6;
  optional NotificationSound sound = 7;
  optional bool badge_muted = 8;
}

message SetNotificationSettingsResponse {
  NotificationSettings settings = 1;
  SyncAck ack = 2;
}

message GetCommonChatsRequest {
  int64 user_id = 1 [jstype = JS_NUMBER];
  // Opaque cursor from a previous response; empty for the first page.
  string cursor = 2;
  // Default 50, at most 100.
  int32 limit = 3;
}

message GetCommonChatsResponse {
  // Ascending by chat id.
  repeated Chat chats = 1;
  // All common chats, not only this page.
  int32 count = 2;
  // Empty when there are no more chats.
  string next_cursor = 3;
}
