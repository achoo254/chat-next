syntax = "proto3";

package app.v1;

import "app/v1/users.proto";

option go_package = "app.local/server/gen/app/v1;appv1";

// ID convention (ADR 0001): every int64 field marked [jstype = JS_NUMBER]
// always holds a value < 2^53; the server asserts the bound when serializing.
//
// Bot management for the Developer Console. A bot is a user with is_bot
// owned by the caller, in the caller's tenant; it has no IdP account and
// talks to the server through the HTTP Bot API
// (https://chat.<domain>/bot/v1/..., spec/bot-api/openapi.yaml) with a token
// "<bot_id>:<secret>". The server keeps only a hash of the secret, so a token
// is shown once, by ResetBotToken, and can never be read again.
//
// Errors besides the usual codes:
// - failed_precondition "reauth_required: ...": ResetBotToken, DeleteBot and
//   SetBotWebhook need an IdP sign-in within the last 10 minutes (ADR 0006).
//   The web sends the browser to /auth/login?reauth=1&return_to=<path> (the
//   IdP asks for the password again) and retries after it comes back.
// - failed_precondition "bots_limit: ...": the owner already has 20 bots.
// - already_exists "username_taken: ...": the username belongs to a user or
//   bot of the tenant.
// - not_found: the bot does not exist, is deleted or belongs to someone else.
// - invalid_argument "<code>: ..." from SetBotWebhook, code one of
//   url_invalid, url_blocked (private, local or reserved address),
//   url_unresolved, secret_invalid, secret_required,
//   allowed_updates_invalid, max_connections_invalid.

// Developer Console: the caller's own bots.
service BotAdminService {
  // The caller's bots, oldest first.
  rpc ListMyBots(ListMyBotsRequest) returns (ListMyBotsResponse);
  // Creates a bot without a token; ResetBotToken issues the first one.
  rpc CreateBot(CreateBotRequest) returns (CreateBotResponse);
  // Changes the fields that are set; commands, when set, replace every
  // command list of the bot.
  rpc UpdateBot(UpdateBotRequest) returns (UpdateBotResponse);
  // Issues a new token and returns it once; the previous token stops
  // working at once. Needs a recent sign-in.
  rpc ResetBotToken(ResetBotTokenRequest) returns (ResetBotTokenResponse);
  // Deletes the bot: its token stops working and its pending updates are
  // dropped; its messages stay. Its username is released for another bot.
  // Needs a recent sign-in.
  rpc DeleteBot(DeleteBotRequest) returns (DeleteBotResponse);
  // How the bot receives updates (webhook or long poll), the delivery
  // state and the counters of the last 24 hours.
  rpc GetBotDelivery(GetBotDeliveryRequest) returns (GetBotDeliveryResponse);
  // Sets the bot's webhook (the same as PUT /bot/v1/webhook): updates are
  // POSTed to it and long polls get 409 conflict. Needs a recent sign-in:
  // the webhook gets all of the bot's updates and may answer as the bot.
  rpc SetBotWebhook(SetBotWebhookRequest) returns (SetBotWebhookResponse);
  // Removes the webhook; the bot fetches updates by long poll again.
  rpc DeleteBotWebhook(DeleteBotWebhookRequest) returns (DeleteBotWebhookResponse);
  // Updates given up after 10 failed attempts, newest first (at most 100),
  // kept until they expire (24 hours; callbacks 15 minutes).
  rpc ListBotDeadLetters(ListBotDeadLettersRequest) returns (ListBotDeadLettersResponse);
  // Gives dead letters one more attempt each; a failure dead-letters them
  // again.
  rpc RetryBotDeadLetters(RetryBotDeadLettersRequest) returns (RetryBotDeadLettersResponse);
  // Drops dead letters for good.
  rpc DiscardBotDeadLetters(DiscardBotDeadLettersRequest) returns (DiscardBotDeadLettersResponse);
}

// Rate limit tier of a bot; only the operations team changes it.
enum BotTier {
  BOT_TIER_UNSPECIFIED = 0;
  BOT_TIER_DEFAULT = 1;
  BOT_TIER_VERIFIED = 2;
  BOT_TIER_INTERNAL = 3;
  // Lowered by the automatic anti-abuse rule or an operator.
  BOT_TIER_RESTRICTED = 4;
  // A bot younger than 14 days.
  BOT_TIER_NEW = 5;
}

// Where a command list applies. A client shows the most specific list
// that is set: GROUP_ADMIN (group admins), then GROUP (groups) or PRIVATE
// (the private chat with the bot), then DEFAULT.
enum BotCommandScope {
  BOT_COMMAND_SCOPE_UNSPECIFIED = 0;
  BOT_COMMAND_SCOPE_DEFAULT = 1;
  BOT_COMMAND_SCOPE_PRIVATE = 2;
  BOT_COMMAND_SCOPE_GROUP = 3;
  BOT_COMMAND_SCOPE_GROUP_ADMIN = 4;
}

message BotCommand {
  // 1 to 32 characters of a-z, 0-9 and _, without the leading slash.
  string command = 1;
  // 1 to 256 characters.
  string description = 2;
}

message BotCommandSet {
  BotCommandScope scope = 1;
  // Up to 100 commands, unique within the set, in menu order.
  repeated BotCommand commands = 2;
}

message BotCommandSets {
  // At most one set per scope; an empty list removes every command.
  repeated BotCommandSet sets = 1;
}

message Bot {
  // The bot's user (is_bot set).
  User user = 1;
  // Shown in the empty chat before the user starts the bot; up to 512
  // characters.
  string description = 2;
  // Profile text; up to 120 characters.
  string about = 3;
  // Privacy mode (default on): in groups the bot only receives commands,
  // replies to its own messages and service messages.
  bool privacy = 4;
  repeated BotCommandSet commands = 5;
  BotTier tier = 6;
  // A token was issued and is valid (ResetBotToken shows a new one).
  bool has_token = 7;
  // Unix seconds.
  int64 created_at = 8 [jstype = JS_NUMBER];
  // Unix seconds when the current token was issued; 0 without a token.
  int64 token_issued_at = 9 [jstype = JS_NUMBER];
  // Unix seconds when the bot last asked for updates (long poll getUpdates),
  // kept to within about 30 seconds; 0 when it never did.
  int64 last_update_at = 10 [jstype = JS_NUMBER];
  // Updates are POSTed to a webhook (GetBotDelivery has the details);
  // false when the bot fetches them by long poll.
  bool webhook = 11;
}

message ListMyBotsRequest {}

message ListMyBotsResponse {
  repeated Bot bots = 1;
}

message CreateBotRequest {
  // 5 to 32 characters of a-z, 0-9 and _ ending in "bot" (any case; stored
  // lowercase), unique among the users and bots of the tenant.
  string username = 1;
  // Display name, 1 to 64 characters.
  string name = 2;
}

message CreateBotResponse {
  Bot bot = 1;
}

message UpdateBotRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  optional string name = 2;
  optional string description = 3;
  optional string about = 4;
  optional bool privacy = 5;
  // Set to replace every command list.
  BotCommandSets commands = 6;
}

message UpdateBotResponse {
  Bot bot = 1;
}

message ResetBotTokenRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
}

message ResetBotTokenResponse {
  Bot bot = 1;
  // "<bot_id>:<secret>", shown once. Bots send it as
  // "Authorization: Bearer <token>".
  string token = 2;
}

message DeleteBotRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
}

message DeleteBotResponse {}

message GetBotDeliveryRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
}

// The bot's webhook as set; the secret is never returned.
message BotWebhook {
  // https URL; "" when the bot fetches updates by long poll.
  string url = 1;
  // Update kinds stored for the bot ("message", "message_edited",
  // "channel_post", "callback"); empty means every kind.
  repeated string allowed_updates = 2;
  // Parallel requests, 1 to 100.
  int32 max_connections = 3;
}

message BotDeliveryStatus {
  // Updates not delivered yet (neither dead-lettered nor expired).
  int64 pending_count = 1 [jstype = JS_NUMBER];
  int64 dead_letter_count = 2 [jstype = JS_NUMBER];
  // Reason of the newest failed attempt: "http_<status>", "timeout",
  // "tls", "connect", "dns", "blocked_address", "invalid_url",
  // "secret_unreadable" (the webhook must be set again); "" for none.
  string last_error = 3;
  // Unix seconds of last_error; 0 for none.
  int64 last_error_date = 4 [jstype = JS_NUMBER];
  // Unix seconds of the newest successful request; 0 for none.
  int64 last_success_date = 5 [jstype = JS_NUMBER];
  // Duration of that request in milliseconds.
  int32 last_success_ms = 6;
  // Requests in flight now.
  int32 open_connections = 7;
}

// Delivery numbers of the last 24 hours: the larger of the hourly counters
// and what the stored updates show (counters started with webhook delivery;
// stored updates are kept 24 hours, callbacks 15 minutes).
message BotDeliveryStats {
  // Updates stored for the bot.
  int64 received = 1 [jstype = JS_NUMBER];
  // Acknowledged by a 2xx answer of the webhook or by a long poll.
  int64 delivered = 2 [jstype = JS_NUMBER];
  // Failed webhook attempts.
  int64 failed = 3 [jstype = JS_NUMBER];
  int64 dead_lettered = 4 [jstype = JS_NUMBER];
}

message GetBotDeliveryResponse {
  BotWebhook webhook = 1;
  BotDeliveryStatus status = 2;
  BotDeliveryStats stats = 3;
}

message SetBotWebhookRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // https URL on port 443, 80 or 8443 resolving to public addresses only;
  // redirects are not followed.
  string url = 2;
  // 1 to 256 characters of A-Z, a-z, 0-9, _ and -, sent in the
  // X-Bot-Api-Secret-Token header and keying the X-Bot-Signature HMAC.
  // Empty keeps the current secret, only when the webhook stays at the same
  // URL (secret_required when no webhook is set or the URL changes, so a
  // new URL never receives the secret the previous one trusts).
  string secret = 3;
  repeated string allowed_updates = 4;
  // 1 to 100; 0 is 40.
  int32 max_connections = 5;
  // Drop the pending updates instead of delivering them.
  bool drop_pending = 6;
}

message SetBotWebhookResponse {
  BotWebhook webhook = 1;
}

message DeleteBotWebhookRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // Drop the pending updates instead of keeping them for long poll.
  bool drop_pending = 2;
}

message DeleteBotWebhookResponse {}

message BotDeadLetter {
  int64 update_id = 1 [jstype = JS_NUMBER];
  // "message", "message_edited", "channel_post" or "callback".
  string kind = 2;
  int64 chat_id = 3 [jstype = JS_NUMBER];
  // The chat's title, or the user's name for a private chat.
  string chat_title = 4;
  // Reason of the last attempt, as BotDeliveryStatus.last_error.
  string last_error = 5;
  // Unix seconds of the last attempt.
  int64 last_error_date = 6 [jstype = JS_NUMBER];
  int32 attempts = 7;
}

message ListBotDeadLettersRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
}

message ListBotDeadLettersResponse {
  repeated BotDeadLetter dead_letters = 1;
  // All dead letters of the bot (the list holds the newest 100).
  int64 total = 2 [jstype = JS_NUMBER];
}

message RetryBotDeadLettersRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // 1 to 100 update ids.
  repeated int64 update_ids = 2 [jstype = JS_NUMBER];
}

message RetryBotDeadLettersResponse {
  // How many of update_ids were dead letters (others are skipped).
  int32 retried = 1;
}

message DiscardBotDeadLettersRequest {
  int64 bot_id = 1 [jstype = JS_NUMBER];
  // 1 to 100 update ids.
  repeated int64 update_ids = 2 [jstype = JS_NUMBER];
}

message DiscardBotDeadLettersResponse {
  int32 discarded = 1;
}
