syntax = "proto3";

package remote.v1;

option go_package = "app.local/server/gen/remote/v1;remotev1";

// Wire contract between a user's device (A: web, PWA, phone) and the
// background agent on their own machine (B), carried over a Tunelo
// WebSocket relay. The relay and the chat server never see plaintext:
// `Plain` messages only carry public keys and proofs, everything after the
// handshake is a `Frame` sealed with the session keys (ADR 0013).
//
// Nothing here is specific to one AI: B runs adapters (Claude Code first)
// that map their own events and tool names onto the generic shapes below.

// ---------------------------------------------------------------------------
// Before the handshake: sent in clear, one WebSocket binary message each.

message Plain {
  oneof body {
    Hello hello = 1;
    Ready ready = 2;
    PakeStart pake_start = 3;
    PakeReply pake_reply = 4;
    PakeFinish pake_finish = 5;
    HandshakeError error = 6;
  }
}

// A → B: opens a session.
message Hello {
  uint32 protocol_version = 1;
  uint32 min_protocol_version = 2;
  // X25519 public keys, 32 bytes each.
  bytes ephemeral_key = 3;
  bytes static_key = 4;
  // 32 random bytes.
  bytes nonce = 5;
  reserved 6;
  reserved "pair_proof";
  // Shown on B's device list; at most 64 characters.
  string device_name = 7;
}

// B → A: answers a Hello.
message Ready {
  uint32 protocol_version = 1;
  uint32 min_protocol_version = 2;
  bytes ephemeral_key = 3;
  bytes static_key = 4;
  bytes nonce = 5;
  // First connection after the one-command install only:
  // HMAC-SHA256(install secret, "install" ‖ A static ‖ B static). A pins B's
  // static key only after checking it; it never takes B's key from the server.
  bytes install_proof = 6;
  // Key confirmation: the transcript hash sealed as B → A frame 0.
  bytes confirm = 7;
}

// Pairing a new device with the machine's authenticator code (TOTP, RFC
// 6238, set from an already paired device with TotpSet). The 6-digit code is
// the password of CPace on ristretto255: a wrong guess costs one online
// attempt and reveals nothing that allows an offline search. B counts every
// PakeStart as an attempt and locks pairing for 15 minutes after 5 that did
// not pair; the device reconnects with a normal Hello once paired.
message PakeStart {
  bytes share = 1;
  bytes static_key = 2;
  string device_name = 3;
  // 16 random bytes chosen by A: the CPace session id.
  bytes sid = 4;
}

// B does not know which 30-second step the device's code belongs to, so it
// answers with one candidate per step it accepts (previous, current, next),
// each a CPace run of its own keyed by that step's code. A uses the one whose
// tag checks; none checking means the code was wrong.
message PakeReply {
  reserved 1, 3;
  reserved "share", "tag";
  bytes static_key = 2;
  repeated PakeCandidate candidates = 4;
}

message PakeCandidate {
  bytes share = 1;
  // HMAC-SHA256(ISK, "B" ‖ transcript) of this candidate.
  bytes tag = 2;
}

message PakeFinish {
  // HMAC-SHA256(ISK, "A" ‖ transcript) of the candidate A used; B tries every
  // candidate it sent and answers nothing that tells them apart.
  bytes tag = 1;
}

message HandshakeError {
  HandshakeErrorCode code = 1;
  // The sender's supported range, so the peer can say which side must update.
  uint32 protocol_version = 2;
  uint32 min_protocol_version = 3;
}

enum HandshakeErrorCode {
  HANDSHAKE_ERROR_CODE_UNSPECIFIED = 0;
  // A's static key is not paired with this machine.
  HANDSHAKE_ERROR_CODE_UNKNOWN_DEVICE = 1;
  HANDSHAKE_ERROR_CODE_VERSION_UNSUPPORTED = 2;
  HANDSHAKE_ERROR_CODE_BAD_PROOF = 3;
  reserved 4;
  reserved "HANDSHAKE_ERROR_CODE_PAIRING_EXPIRED";
  // Pairing is locked after 5 attempts that did not pair, for 15 minutes.
  HANDSHAKE_ERROR_CODE_TOO_MANY_ATTEMPTS = 5;
  HANDSHAKE_ERROR_CODE_REVOKED = 6;
  HANDSHAKE_ERROR_CODE_BUSY = 7;
  HANDSHAKE_ERROR_CODE_MALFORMED = 8;
  // PakeStart to a machine without an authenticator secret: a paired device
  // sets one first (TotpSet). Not counted as an attempt.
  HANDSHAKE_ERROR_CODE_TOTP_NOT_SET = 9;
}

// ---------------------------------------------------------------------------
// After the handshake: every WebSocket message is one sealed Frame.

message Frame {
  // Set by A on requests; B echoes it on the direct answer or error.
  string id = 1;
  oneof body {
    // A → B
    ThreadList thread_list = 10;
    ThreadCreate thread_create = 11;
    ThreadSend thread_send = 12;
    ThreadSubscribe thread_subscribe = 13;
    ThreadRespond thread_respond = 14;
    ThreadInterrupt thread_interrupt = 15;
    ThreadSetModel thread_set_model = 16;
    ThreadSwitch thread_switch = 17;
    ThreadFetchFull thread_fetch_full = 18;
    MachineInfoRequest machine_info_request = 19;
    Ping ping = 20;
    DirList dir_list = 21;
    AuditList audit_list = 22;
    ThreadClose thread_close = 23;
    ThreadSetPermissionMode thread_set_permission_mode = 24;
    ThreadSetEffort thread_set_effort = 25;
    ProfileList profile_list = 26;
    ProfileSelect profile_select = 27;
    ProfileSignInBegin profile_sign_in_begin = 28;
    ProfileSignInCode profile_sign_in_code = 29;
    ProfileSignInCancel profile_sign_in_cancel = 30;
    ProfileRemove profile_remove = 31;
    UsageRefresh usage_refresh = 32;
    MachineSettingsSet machine_settings_set = 33;
    FileList file_list = 34;
    OpenDiskAccessSettings open_disk_access_settings = 35;
    SessionList session_list = 36;
    SessionOpen session_open = 37;
    AttachmentUpload attachment_upload = 38;
    AttachmentCancel attachment_cancel = 39;

    // B → A
    ThreadListResult thread_list_result = 40;
    ThreadCreated thread_created = 41;
    ThreadItems thread_items = 42;
    ThreadStatus thread_status = 43;
    ThreadReset thread_reset = 44;
    FullItem full_item = 45;
    MachineInfo machine_info = 46;
    Pong pong = 47;
    DirListResult dir_list_result = 48;
    AuditListResult audit_list_result = 49;
    Ack ack = 50;
    Error error = 51;
    ThreadInfo thread_info = 52;
    ProfileListResult profile_list_result = 53;
    ProfileSignInPrompt profile_sign_in_prompt = 54;
    ProfileSignInResult profile_sign_in_result = 55;
    FileListResult file_list_result = 56;
    MachineProfile machine_profile = 57;
    SessionListResult session_list_result = 58;
    AttachmentData attachment_data = 59;

    ThreadDeleted thread_deleted = 60;
    ProjectListResult project_list_result = 61;
    ProjectCloneProgress project_clone_progress = 62;

    // A → B, continued
    AttachmentFetch attachment_fetch = 70;
    ThreadDelete thread_delete = 71;
    ThreadSetArchived thread_set_archived = 72;
    ProjectList project_list = 73;
    ProjectAdd project_add = 74;
    ProjectCreate project_create = 75;
    ProjectClone project_clone = 76;
    ProjectCloneCancel project_clone_cancel = 77;
    ProjectUpdate project_update = 78;
    ProjectReorder project_reorder = 79;
    ProjectRemove project_remove = 80;
    SecretProvide secret_provide = 81;
    SecretDecline secret_decline = 82;
    SecretList secret_list = 83;
    SecretRemove secret_remove = 84;
    ThreadGitChanges thread_git_changes = 85;
    GitFileDiff git_file_diff = 86;
    // The tunelo browser (tunelo 2.0.12+); see "the tunelo browser" below.
    BrowserControl browser_control = 87;
    BrowserView browser_view = 88;
    BrowserInput browser_input = 89;
    BrowserTakeoverEnd browser_takeover_end = 90;
    // The machine's own screen (tunelo 2.0.13+); see "the machine's screen" below.
    ScreenShareStatusRequest screen_share_status_request = 94;
    ScreenShareOpen screen_share_open = 95;
    // Both ways: A → B answered with Ack; B → A unasked.
    ScreenShareData screen_share_data = 96;
    ScreenShareClose screen_share_close = 97;
    // Deletes the tunelo browser's profile (as `tunelo browser clear`). Answered with MachineInfo.
    BrowserClear browser_clear = 98;
    // Pairing by authenticator code; see "pairing by authenticator" below.
    TotpSet totp_set = 102;
    TotpStatusRequest totp_status_request = 103;
    // Updating tunelo itself (tunelo 2.3.0+); see "updating tunelo" below.
    AgentUpdateCheck agent_update_check = 105;
    AgentUpdateStart agent_update_start = 106;

    // B → A, continued
    SecretPrompt secret_prompt = 63;
    SecretPromptEnded secret_prompt_ended = 64;
    SecretListResult secret_list_result = 65;
    // Answers ThreadGitChanges, and is sent unasked to devices following the
    // thread whenever one of its turns ends.
    GitChanges git_changes = 66;
    GitFileDiffResult git_file_diff_result = 67;
    BrowserTakeover browser_takeover = 68;
    BrowserTakeoverEnded browser_takeover_ended = 69;
    BrowserFrame browser_frame = 91;
    BrowserState browser_state = 92;
    PasskeyNotice passkey_notice = 93;
    ScreenShareStatus screen_share_status = 99;
    ScreenShareOpened screen_share_opened = 100;
    ScreenShareClosed screen_share_closed = 101;
    TotpStatus totp_status = 104;
    AgentUpdateProgress agent_update_progress = 107;

    // The machine's terminal (tunelo 2.4.0+); see "the machine's terminal" below.
    // A → B
    TermListRequest term_list_request = 108;
    TermOpen term_open = 109;
    TermClose term_close = 110;
    TermResize term_resize = 111;
    // Both ways.
    TermSignal term_signal = 112;
    TermData term_data = 113;
    // B → A
    TermListResult term_list_result = 114;
    TermOpened term_opened = 115;
    TermClosed term_closed = 116;
    TermStatus term_status = 117;

    // What a running turn is doing (tunelo 2.5.0+). B → A, unasked, to
    // devices following the thread.
    ThreadActivity thread_activity = 118;
  }
}

// --- requests (A → B) ------------------------------------------------------

message ThreadList {}

message ThreadCreate {
  // Adapter id from MachineInfo.providers, e.g. "claude".
  string provider = 1;
  // Empty: the adapter's default model.
  string model = 2;
  // Absolute working directory on B.
  string dir = 3;
  // First user message. Empty opens the session with none: it waits, parked,
  // for the first message typed in it, which also names it (tunelo 2.0.9+;
  // earlier machines refuse it as an empty message).
  string text = 4;
  Consent consent = 5;
  // One of the AI's permission_modes to start in (a project's default);
  // empty follows the machine's own AI settings. Machines before tunelo 2.0.7
  // ignore it.
  string permission_mode = 6;
}

// What the user confirmed on A before opening the session.
message Consent {
  // The directory is sensitive (home, root, ~/.ssh, …) and the user agreed.
  bool sensitive = 1;
  // Load the project's own agent settings (for Claude: .claude/settings.json
  // and hooks). Off by default; B logs it when on.
  bool project_settings = 2;
  // With project_settings: the user agreed to trust this directory's project
  // settings on B from now on (as `tunelo trust` on the machine does). B logs
  // it. B refuses it for a sensitive directory: that is trusted on the
  // machine itself. Without it, an untrusted directory is refused with
  // ERROR_REASON_PROJECT_SETTINGS_UNTRUSTED.
  bool trust_project = 3;
}

message ThreadSend {
  string thread_id = 1;
  // May be empty when attachment_ids is not.
  string text = 2;
  // Client-generated; B drops a repeat of an id it already accepted.
  string client_msg_id = 3;
  // Uploads (AttachmentUpload) for this thread that arrived whole and go with
  // this message, in order; each is used once. An unknown, unfinished or
  // spent id refuses the message with ERROR_REASON_ATTACHMENT_NOT_FOUND.
  // Machines before tunelo 2.0.5 ignore the field: send none to them.
  repeated string attachment_ids = 4;
}

message ThreadSubscribe {
  string thread_id = 1;
  // Zero cursor: from the start.
  Cursor cursor = 2;
}

message ThreadRespond {
  string thread_id = 1;
  string item_id = 2;
  // The approval/question revision the user saw; a stale answer is refused.
  uint32 expected_revision = 3;
  oneof answer {
    Decision decision = 4;
    Answers answers = 5;
  }
  // With DECISION_DENY only: what the user tells the AI instead, at most
  // 4000 characters. The AI reads it as the tool's answer in the same turn
  // and goes on. Empty: a plain refusal. B refuses it with any other answer.
  string deny_message = 6;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  // Allow this tool for the rest of the session (never written to settings).
  DECISION_ALLOW_SESSION = 2;
  DECISION_DENY = 3;
}

message Answers {
  // One entry per question, in order; each holds the chosen option labels or
  // free text.
  repeated Answer answers = 1;
}

message Answer {
  repeated string values = 1;
}

message ThreadInterrupt {
  string thread_id = 1;
}

message ThreadClose {
  string thread_id = 1;
}

// Deletes a thread for good: B stops its AI session, moves the AI's own
// transcript of each of its sessions (Claude: projects/<folder>/<id>.jsonl
// and the <id>/ folder beside it) and the files sent with its messages
// (.tunelo-attachments/… in its folder, only those) to the operating
// system's trash, where the user can restore them, then drops the thread's
// journal and tells every device with ThreadDeleted. Nothing outside those
// files is touched; B writes it to the consent log. Answered with
// ThreadDeleted. A thread in the middle of a turn (or waiting for the user)
// is refused with ERROR_REASON_THREAD_RUNNING unless stop_running is set; a
// session that seems open elsewhere with ERROR_REASON_SESSION_OPEN_ELSEWHERE
// unless open_anyway is set. Machines before tunelo 2.0.6 answer
// UNSUPPORTED_REQUEST.
message ThreadDelete {
  string thread_id = 1;
  // The user agreed to stop the running turn first.
  bool stop_running = 2;
  // The user was told the session may be open elsewhere and goes on.
  bool open_anyway = 3;
}

// Hides a thread from the list on every device (ThreadSummary.archived) or
// shows it again; nothing on disk changes and the session opens as before.
// Answered with Ack. Machines before tunelo 2.0.6 answer UNSUPPORTED_REQUEST.
message ThreadSetArchived {
  string thread_id = 1;
  bool archived = 2;
}

message ThreadSetModel {
  string thread_id = 1;
  string model = 2;
}

// Changes the session's permission mode. B accepts only the modes listed in
// ThreadInfo.permission_modes: a device can never turn on bypassPermissions
// unless the machine's own AI settings already start sessions in it.
message ThreadSetPermissionMode {
  string thread_id = 1;
  string mode = 2;
}

// Changes the session's reasoning effort (one of the AI's effort_levels);
// empty goes back to the AI's own default.
message ThreadSetEffort {
  string thread_id = 1;
  string effort = 2;
}

message ThreadSwitch {
  string thread_id = 1;
  string provider = 2;
  string model = 3;
}

message ThreadFetchFull {
  string thread_id = 1;
  string item_id = 2;
}

// What is not committed in the thread's folder, as git sees it (GitChanges).
message ThreadGitChanges {
  string thread_id = 1;
}

// One file of the thread's GitChanges with its whole diff (GitFileDiffResult).
// Only a path GitChanges lists now is answered.
message GitFileDiff {
  string thread_id = 1;
  string path = 2;
}

message MachineInfoRequest {}

// Every 10 s while A shows the machine: B pushes a notification only when no
// device pinged recently.
message Ping {}

message DirList {
  // Absolute path; empty for the home directory.
  string path = 1;
  bool show_hidden = 2;
}

message AuditList {
  uint32 limit = 1;
}

// Files and folders inside a session's working directory, for @-mentions.
// Answered with FileListResult. B never lists outside that directory, never
// follows a symbolic link to a folder, and skips .git, node_modules and
// sensitive paths.
message FileList {
  string thread_id = 1;
  // A path relative to the working directory, "/"-separated; entries whose
  // relative path starts with it match, and so do those whose name starts
  // with it when it has no "/". Case-insensitive. Empty: everything.
  string prefix = 2;
  // At most this many entries; 0 means 50, B caps it at 200.
  uint32 limit = 3;
}

// --- sessions kept on the machine -------------------------------------------
//
// The AI's own transcripts on B, whatever started them: a terminal, an IDE,
// Claude Desktop or tunelo itself (Claude Code keeps every session under
// ~/.claude/projects). They only ever go to paired devices, end-to-end
// encrypted, like the rest of a thread.

// Answered with SessionListResult, newest first.
message SessionList {
  // Adapter id; empty: "claude".
  string provider = 1;
  // Only sessions started in this folder or below it; empty: every folder.
  string dir = 2;
  // Words (case-insensitive) that must all appear in the title, the first
  // message or the folder; empty: every session.
  string query = 3;
  uint32 offset = 4;
  // 0 means 30; B caps it at 100.
  uint32 limit = 5;
}

message LocalSession {
  // The AI's own session id (resumed as is).
  string session_id = 1;
  // The working directory the session started in, as its transcript records it.
  string dir = 2;
  // The session's title as the AI named it, else its first user message: one
  // line, at most 120 characters.
  string title = 3;
  // Unix milliseconds: the last change of its transcript.
  int64 updated_at = 4;
  // User messages and AI replies; 0 when not counted (B counts only as much
  // as it can read quickly, the rest on a later page or request).
  uint32 messages = 5;
  // What started it, as the transcript says (Claude: "cli" for a terminal or
  // an IDE running claude, "sdk-ts" for an app on the Agent SDK such as
  // tunelo, "claude-desktop", …); empty when unknown.
  string entrypoint = 6;
  // The thread that holds this session already; empty when none does.
  string thread_id = 7;
  // The session seems open elsewhere on the machine: its transcript changed
  // in the last minute, or a running claude says it holds it.
  bool busy_elsewhere = 8;
  // The folder is sensitive: opening it needs Consent.sensitive.
  bool sensitive = 9;
}

message SessionDir {
  string dir = 1;
  uint32 sessions = 2;
}

message SessionListResult {
  repeated LocalSession sessions = 1;
  // Sessions that match dir and query in all.
  uint32 total = 2;
  // Folders of the sessions that match query (whatever dir says), most
  // sessions first; at most 50.
  repeated SessionDir dirs = 3;
}

// Opens a session from SessionList as a thread: B reads its transcript into
// the thread (shown at once) and resumes the same session in its folder with
// the next message. Consent works as for ThreadCreate. Answered like
// ThreadCreate (ThreadCreated, then ThreadInfo and ThreadItems); a session a
// thread holds already answers with that thread. A session that seems open
// elsewhere is refused with ERROR_REASON_SESSION_OPEN_ELSEWHERE unless
// open_anyway is set.
message SessionOpen {
  // Adapter id; empty: "claude".
  string provider = 1;
  string session_id = 2;
  Consent consent = 3;
  // The user was told the session may be open elsewhere and goes on.
  bool open_anyway = 4;
}

// --- attachments ------------------------------------------------------------
//
// Files a device sends with a message, end-to-end encrypted like the rest:
// the relay and the chat server never see them. A file goes up in pieces
// (AttachmentUpload) before the message that names it (ThreadSend.
// attachment_ids). B keeps an unsent upload for an hour at most. With the
// message, B hands an image (PNG, JPEG, GIF or WebP, told by its bytes, at
// most AttachmentLimits.image_max_bytes) to an AI whose capabilities say
// `images` as an image; it saves any other file in the session's folder,
// under .tunelo-attachments/<yyyy-mm-dd>/ (kept out of git through
// .git/info/exclude, never .gitignore), and tells the AI its path. A
// sensitive target is refused with ERROR_REASON_SENSITIVE_FOLDER.

// One piece of a file, in order: the first at offset 0 names the file, each
// one after it starts where the one before ended. Answered with Ack. Pieces
// may be sent without waiting for the Ack of the one before (B handles them
// in order); after an Error, the upload is gone: start it again or drop it.
message AttachmentUpload {
  // Chosen by A: 8-64 characters, letters, digits, "-" and "_".
  string upload_id = 1;
  // First piece only: the thread the file goes with.
  string thread_id = 2;
  // First piece only: the file's name on the device (B keeps its last path
  // part, made safe for any file system).
  string name = 3;
  // First piece only: the type the device reports; B goes by the bytes.
  string mime_type = 4;
  // First piece only: the whole size in bytes, at most
  // AttachmentLimits.file_max_bytes.
  uint64 size = 5;
  uint64 offset = 6;
  // At most AttachmentLimits.piece_max_bytes; may be empty only for an empty file.
  bytes data = 7;
}

// Drops an upload (whole or not) that is not sent yet. Answered with Ack,
// also for an id B does not know.
message AttachmentCancel {
  string upload_id = 1;
}

// An image a message of the thread carried (Attachment.image), for showing
// it again. Answered with AttachmentData.
message AttachmentFetch {
  string thread_id = 1;
  string attachment_id = 2;
}

message AttachmentData {
  string thread_id = 1;
  string attachment_id = 2;
  string mime_type = 3;
  bytes data = 4;
}

// A file that went with a user message (TextItem.attachments).
message Attachment {
  // The upload id; AttachmentFetch takes it for an image.
  string id = 1;
  string name = 2;
  string mime_type = 3;
  uint64 size = 4;
  // The AI got it as an image; B keeps it with the thread.
  bool image = 5;
  // Saved in the session's folder: its path relative to that folder,
  // "/"-separated; empty for an image.
  string path = 6;
}

// What a machine takes (MachineInfo.attachments); unset before tunelo 2.0.5,
// which takes no attachments.
message AttachmentLimits {
  uint64 file_max_bytes = 1;
  // All files of one message together.
  uint64 message_max_bytes = 2;
  uint32 message_max_files = 3;
  // An image larger than this goes as a file; a device shrinks it first.
  uint64 image_max_bytes = 4;
  uint32 piece_max_bytes = 5;
}

// --- projects ---------------------------------------------------------------
//
// Folders the user keeps as projects on a machine (tunelo 2.0.7+), stored in
// the machine's tunelo config: a name, the folder, pinned or not, an order,
// and what a new session there starts with. Removing one only drops it from
// the list; its folder stays. Every change is sent unasked to every connected
// device as ProjectListResult (frame id empty). Machines before tunelo 2.0.7
// answer UNSUPPORTED_REQUEST.

// Answered with ProjectListResult.
message ProjectList {}

// Adds an existing folder. A sensitive folder needs Consent.sensitive (B logs
// it); a folder that is a project already is refused with
// ERROR_REASON_PROJECT_EXISTS. Answered with ProjectListResult.
message ProjectAdd {
  // Absolute.
  string dir = 1;
  // Empty: the folder's name.
  string name = 2;
  Consent consent = 3;
}

// Makes a new folder `name` in `parent` (refused when it exists or is
// sensitive), runs `git init` in it when asked, and adds it. Answered with
// ProjectListResult.
message ProjectCreate {
  string parent = 1;
  // A folder name: one path part, made safe by B.
  string name = 2;
  bool git_init = 3;
}

// Clones a repository into `parent`/`name` (refused when it exists or is
// sensitive) and adds it. Only https:// and ssh (ssh://, user@host:path)
// URLs, without a password in them; no hooks run beyond git's own defaults.
// Answered with Ack at once; ProjectCloneProgress follows, unasked, to the
// device that asked, until it says done.
message ProjectClone {
  string url = 1;
  string parent = 2;
  // Empty: the repository's name.
  string name = 3;
  // Chosen by A (8-64 letters, digits, "-", "_"); names the clone in its
  // progress and in ProjectCloneCancel.
  string clone_id = 4;
}

// Stops a clone and removes what it wrote. Answered with Ack.
message ProjectCloneCancel {
  string clone_id = 1;
}

message ProjectCloneProgress {
  string clone_id = 1;
  // git's phase in English ("Receiving objects", …); empty before the first.
  string phase = 2;
  // 0-100 of the phase.
  uint32 percent = 3;
  bool done = 4;
  // When done: the new project, or empty when it failed or was cancelled.
  string project_id = 5;
  // When it failed: why (UNSPECIFIED when cancelled or done well) and git's
  // own last line, in English.
  ErrorReason reason = 6;
  string message = 7;
}

// Changes what is set; the rest stays. Answered with ProjectListResult.
message ProjectUpdate {
  string id = 1;
  optional string name = 2;
  optional bool pinned = 3;
  ProjectDefaults defaults = 4;
}

// The projects in this order (every id once). Answered with ProjectListResult.
message ProjectReorder {
  repeated string ids = 1;
}

// Drops a project from the list; its folder is not touched. Answered with
// ProjectListResult.
message ProjectRemove {
  string id = 1;
}

// What a new session of a project starts with.
message ProjectDefaults {
  // Empty: the AI's default.
  string model = 1;
  // One of the AI's permission_modes; empty: the machine's own settings.
  string permission_mode = 2;
  // Load the project's own .claude settings (still asked to trust once).
  bool project_settings = 3;
}

message GitStatus {
  // The folder is in a git work tree.
  bool git = 1;
  string branch = 2;
  // Files changed, staged or not, and untracked ones.
  uint32 changed = 3;
  // Commits ahead of and behind the upstream; both 0 without one.
  uint32 ahead = 4;
  uint32 behind = 5;
  bool upstream = 6;
}

message Project {
  string id = 1;
  string name = 2;
  string dir = 3;
  bool pinned = 4;
  ProjectDefaults defaults = 5;
  // Unset when not read yet (or not readable quickly).
  GitStatus git = 6;
  // The folder is not there any more.
  bool missing = 7;
  bool sensitive = 8;
}

// A folder that has sessions but is no project yet.
message ProjectSuggestion {
  string dir = 1;
  uint32 sessions = 2;
}

message ProjectListResult {
  // Pinned first, then in the user's order.
  repeated Project projects = 1;
  // At most 8, most sessions first.
  repeated ProjectSuggestion suggestions = 2;
}

// --- AI accounts (Claude profiles) ------------------------------------------
//
// A machine may hold several Claude accounts. Each one is a profile: a folder
// of its own that the machine's `claude` signs in to. The default profile is
// the machine's own Claude folder. The selected profile is the machine's: every
// session moves to it. A parked session opens with it next time; an open, idle
// one restarts at once on it (resumed, same conversation); one in the middle
// of a turn moves when that turn ends. B announces every change to every
// connected device with MachineProfile. B never reads, keeps or sends a Claude
// credential: the account shown is what `claude auth status` reports.

// Answered with ProfileListResult.
message ProfileList {}

// Picks the machine's profile; every session moves to it (see above).
// Answered with ProfileListResult. B writes it to the consent log.
message ProfileSelect {
  // Empty: the default profile.
  string id = 1;
}

// Starts signing in a new account. B answers with ProfileSignInPrompt, or
// with ProfileSignInResult carrying an error. A new attempt cancels the one
// before it; an attempt left alone ends after 10 minutes.
message ProfileSignInBegin {}

// The code the sign-in page showed. B hands it to `claude` and forgets it; it
// is never stored or logged. Answered with ProfileSignInResult.
message ProfileSignInCode {
  string attempt_id = 1;
  string code = 2;
}

// Answered with Ack.
message ProfileSignInCancel {
  string attempt_id = 1;
}

// Signs the profile out and deletes its folder. Answered with
// ProfileListResult. The default profile cannot be removed.
message ProfileRemove {
  string id = 1;
}

// Reads the plan usage of a profile without sending a message. Answered with
// ProfileListResult.
message UsageRefresh {
  // Empty: the default profile.
  string id = 1;
}

// --- machine settings -------------------------------------------------------

// Changes a setting of the machine; fields left unset stay as they are.
// Answered with MachineInfo. B writes each change to the consent log.
message MachineSettingsSet {
  // Lets Localman send requests to localhost on the machine (see
  // MachineSettings.local_forward).
  optional bool local_forward = 1;
}

// macOS only: B opens System Settings at Full Disk Access and a Finder window
// with its own binary selected, on the machine's screen, for the owner sitting
// there. Answered with Ack; UNSUPPORTED_REQUEST elsewhere.
message OpenDiskAccessSettings {}

// --- answers and events (B → A) --------------------------------------------

message Ack {}

// What the user's own terminal statusline shows, for one thread: sent when a
// device subscribes and whenever it changes.
message ThreadInfo {
  string thread_id = 1;
  // The session's permission mode (Claude: default, acceptEdits, plan,
  // bypassPermissions, auto). Starts from the machine's own AI settings;
  // devices change it with ThreadSetPermissionMode.
  string permission_mode = 2;
  string git_branch = 3;
  uint32 lines_added = 4;
  uint32 lines_removed = 5;
  // Slash commands and skills the AI offers in this folder.
  repeated SlashCommand commands = 6;
  // Plan usage of the AI account on this machine; unset when unknown.
  RateLimits rate_limits = 7;
  // The session's reasoning effort; empty when the AI's default applies.
  string effort = 8;
  // The AI account signed in on this machine; unset when unknown.
  AccountInfo account = 9;
  // Permission modes a device may pick for this session.
  repeated string permission_modes = 10;
  // The Claude profile the session runs with; empty for the default one. A
  // parked session shows the profile it opens with next.
  string profile_id = 11;
  // The profile picked on the machine; empty for the default one. Unset by
  // tunelo before 2.0.2 (then profile_id is all there is).
  string machine_profile_id = 12;
  // The session runs on another profile than the machine's and moves to it
  // when its current turn ends (or, waiting for an approval, once that turn
  // is over).
  bool profile_switch_pending = 13;
  // The account of machine_profile_id while profile_switch_pending, for
  // "moves to <email> after this turn"; unset otherwise.
  AccountInfo next_account = 14;
  // The session hit its profile's usage limit and another profile of the
  // machine has room: offer to move the whole machine there. Only a hint; B
  // never switches by itself. Unset otherwise.
  ProfileSuggestion profile_suggestion = 15;
}

// Another profile to move the machine to when a session's profile is out of
// usage.
message ProfileSuggestion {
  // Empty: the default profile.
  string profile_id = 1;
  string email = 2;
  // Percent of usage left, 0-100: the tighter of its 5-hour and weekly windows.
  uint32 remaining = 3;
}

// Who the AI on the machine is signed in as, as the AI's CLI reports it.
// Never a credential.
message AccountInfo {
  string email = 1;
  string organization = 2;
  // The plan, e.g. "max" or "pro"; empty for API-key or cloud-provider logins.
  string plan = 3;
}

message SlashCommand {
  // Without the leading slash.
  string name = 1;
  string description = 2;
  string argument_hint = 3;
  // The AI's own command, as opposed to a user, project or plugin skill.
  bool builtin = 4;
}

message RateLimits {
  RateWindow five_hour = 1;
  RateWindow seven_day = 2;
}

message RateWindow {
  // Percent of the window used, 0-100.
  uint32 utilization = 1;
  // Unix milliseconds when the window resets; 0 when unknown.
  int64 resets_at = 2;
}

message ClaudeProfile {
  // Empty: the default profile (the machine's own Claude folder).
  string id = 1;
  // As `claude auth status` reports it; for an added profile, the account it
  // was added with even when it needs to sign in again.
  string email = 2;
  string organization = 3;
  // The plan, e.g. "max" or "pro".
  string plan = 4;
  // Last `claude auth status` of the profile: signed in and not past
  // login_expires_at. False means it needs to sign in again.
  bool signed_in = 5;
  // Last known plan usage; unset when unknown.
  RateLimits last_usage = 6;
  // Unix milliseconds of last_usage; 0 when unknown.
  int64 usage_updated_at = 7;
  // Unix milliseconds; 0 for the default profile.
  int64 created_at = 8;
  // Unix milliseconds when the sign-in ends, as claude reports it; 0 when unknown.
  int64 login_expires_at = 9;
}

message ProfileListResult {
  repeated ClaudeProfile profiles = 1;
  // Empty: the default profile.
  string selected_id = 2;
}

// Sent unasked to every connected device whenever the machine's profile
// changes, a session finishes moving to another profile, or a profile's usage
// is read again. Each one is the whole picture: a device replaces what it had.
message MachineProfile {
  // Profiles with accounts and usage, and the machine's pick (as ProfileList
  // answers it).
  ProfileListResult profiles = 1;
  // Every session of the machine and the profile it runs with.
  repeated SessionProfile sessions = 2;
}

message SessionProfile {
  string thread_id = 1;
  // The profile the session runs with (a parked one: opens with next); empty
  // for the default one.
  string profile_id = 2;
  // Moves to the machine's profile when its current turn ends.
  bool switch_pending = 3;
}

message ProfileSignInPrompt {
  string attempt_id = 1;
  // The Claude sign-in page; it shows a code to paste back.
  string url = 2;
  // Unix milliseconds.
  int64 expires_at = 3;
}

message ProfileSignInResult {
  bool ok = 1;
  string email = 2;
  string organization = 3;
  // The new profile on success.
  string id = 4;
  // On failure: code-rejected, duplicate, expired, cancelled, busy,
  // sign-in-on-machine (this machine's claude cannot sign in from a device;
  // run `tunelo claude profiles add` on the machine), or failed.
  string error = 5;
}

message Pong {}

message Error {
  ErrorCode code = 1;
  // In English, for logs and for devices that do not know the reason.
  string message = 2;
  // What went wrong, for devices to say in the user's language. Unspecified
  // (older machines) or unknown to the device: show message instead.
  ErrorReason reason = 3;
  // The one variable part the reason names, when it has one: a folder, an
  // AI's name, a mode, an effort level, a profile id, or the AI's own error.
  string subject = 4;
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // The working directory does not exist or is not a folder.
  ERROR_REASON_FOLDER_NOT_FOUND = 1;
  ERROR_REASON_EMPTY_MESSAGE = 2;
  // Consent.sensitive is missing for a sensitive folder.
  ERROR_REASON_SENSITIVE_FOLDER = 3;
  // Project settings asked for in a folder not trusted on B (subject: the
  // folder). Asking again with Consent.trust_project trusts it.
  ERROR_REASON_PROJECT_SETTINGS_UNTRUSTED = 4;
  // The folder can be trusted on the machine only: it is sensitive, or B
  // cannot trust from a device (subject: the folder).
  ERROR_REASON_TRUST_ON_MACHINE = 5;
  // Subject: the AI's name.
  ERROR_REASON_AI_NOT_INSTALLED = 6;
  // Subject: the AI's name.
  ERROR_REASON_AI_NEEDS_LOGIN = 7;
  // Subject: the AI id.
  ERROR_REASON_UNKNOWN_AI = 8;
  ERROR_REASON_SAME_AI = 9;
  // The AI could not start (subject: its own error, in English).
  ERROR_REASON_AI_START_FAILED = 10;
  // The Claude account picked on B cannot be used (subject: why, in English).
  ERROR_REASON_PROFILE_UNUSABLE = 11;
  ERROR_REASON_THREAD_NOT_FOUND = 12;
  ERROR_REASON_ITEM_NOT_FOUND = 13;
  // The approval or question changed or was answered elsewhere.
  ERROR_REASON_PROMPT_STALE = 14;
  // ThreadRespond.deny_message with an answer other than deny, or too long.
  ERROR_REASON_DENY_MESSAGE_INVALID = 15;
  // Subject: the effort level.
  ERROR_REASON_UNKNOWN_EFFORT = 16;
  // Subject: the mode.
  ERROR_REASON_PERMISSION_MODE_NOT_ALLOWED = 17;
  ERROR_REASON_NO_PROFILES = 18;
  ERROR_REASON_PROFILE_NOT_FOUND = 19;
  ERROR_REASON_DEFAULT_PROFILE_PERMANENT = 20;
  ERROR_REASON_PROFILE_IN_USE = 21;
  // claude could not sign the account out, so nothing was deleted (subject:
  // the profile id, for `tunelo claude profiles remove <id> --force`).
  ERROR_REASON_PROFILE_SIGN_OUT_FAILED = 22;
  // B's list of Claude profiles cannot be read; repair it on the machine.
  ERROR_REASON_PROFILES_DAMAGED = 23;
  ERROR_REASON_AI_CLI_MISSING = 24;
  // B does not forward to localhost.
  ERROR_REASON_NO_LOCAL_FORWARD = 25;
  // B does not know this request (an older version).
  ERROR_REASON_UNSUPPORTED_REQUEST = 26;
  // The operating system refused access to the path.
  ERROR_REASON_ACCESS_DENIED = 27;
  // FileList.prefix leaves the session's working directory.
  ERROR_REASON_PATH_OUTSIDE_FOLDER = 28;
  // macOS refused the path because tunelo has no Full Disk Access; the
  // owner grants it on the machine (see MachineInfo.needs_full_disk_access).
  ERROR_REASON_FULL_DISK_ACCESS_NEEDED = 29;
  // SessionOpen: the machine keeps no such session (any more).
  ERROR_REASON_SESSION_NOT_FOUND = 30;
  // SessionOpen: the session seems open elsewhere on the machine (see
  // LocalSession.busy_elsewhere); ask the user, then send open_anyway.
  ERROR_REASON_SESSION_OPEN_ELSEWHERE = 31;
  // A file is larger than AttachmentLimits.file_max_bytes, or the files of a
  // message than message_max_bytes (subject: the file's name, when one).
  ERROR_REASON_ATTACHMENT_TOO_LARGE = 32;
  // More files with a message than AttachmentLimits.message_max_files, or too
  // many uploads waiting on the machine.
  ERROR_REASON_TOO_MANY_ATTACHMENTS = 33;
  // ThreadSend names an upload B does not hold whole (unknown, unfinished,
  // expired or sent already), AttachmentUpload continues one B does not
  // know or at the wrong offset, or AttachmentFetch names nothing kept.
  ERROR_REASON_ATTACHMENT_NOT_FOUND = 34;
  // ThreadDelete: the thread runs a turn or waits for the user; ask, then
  // send stop_running.
  ERROR_REASON_THREAD_RUNNING = 35;
  // ThreadDelete: the operating system's trash cannot take the files, so
  // nothing was deleted (subject: why, in English).
  ERROR_REASON_TRASH_UNAVAILABLE = 36;
  ERROR_REASON_PROJECT_NOT_FOUND = 37;
  // The folder is a project already, or the folder to create or clone into
  // exists (subject: the folder).
  ERROR_REASON_PROJECT_EXISTS = 38;
  // Not an https or ssh URL, or one with a password in it.
  ERROR_REASON_CLONE_URL_INVALID = 39;
  // git could not clone (subject: its last line, in English).
  ERROR_REASON_CLONE_FAILED = 40;
  ERROR_REASON_GIT_NOT_INSTALLED = 41;
  // A project name or folder name that cannot be used.
  ERROR_REASON_NAME_INVALID = 42;
  // SecretProvide or SecretDecline names a prompt that is no longer open
  // (answered on another device, expired, or its session ended).
  ERROR_REASON_SECRET_PROMPT_GONE = 43;
  // SecretProvide: an empty value, one too long, or one with control characters.
  ERROR_REASON_SECRET_INVALID = 44;
  // SecretRemove: the machine keeps no such secret (any more).
  ERROR_REASON_SECRET_NOT_FOUND = 45;
  // No Chrome, Chromium or Edge was found on the machine for the tunelo browser.
  ERROR_REASON_BROWSER_UNAVAILABLE = 46;
  // BrowserView, BrowserInput or BrowserTakeoverEnd names a takeover that is
  // no longer open (given back, expired, or its session ended).
  ERROR_REASON_TAKEOVER_GONE = 47;
  // BrowserControl while the tunelo browser is not running.
  ERROR_REASON_BROWSER_NOT_RUNNING = 48;
  // ScreenShareOpen while nothing answers on the machine's Screen Sharing port
  // (the owner turns Screen Sharing on in System Settings on the machine).
  ERROR_REASON_SCREEN_SHARING_OFF = 49;
  // ScreenShareOpen while another session is open.
  ERROR_REASON_SCREEN_SHARE_BUSY = 50;
  // ScreenShareData or ScreenShareClose names a session that is no longer open.
  ERROR_REASON_SCREEN_SHARE_GONE = 51;
  // TotpSet with a secret that is not 20 bytes.
  ERROR_REASON_TOTP_SECRET_INVALID = 52;
  // AgentUpdateStart on a machine that cannot replace its own file (tunelo
  // run from source, or not installed as the single binary).
  ERROR_REASON_UPDATE_UNAVAILABLE = 53;
  // AgentUpdateStart while an update is already running.
  ERROR_REASON_UPDATE_BUSY = 54;
  // A Term* request while the machine's terminal process is missing, of
  // another major version, or does not start (see MachineInfo.terminal).
  ERROR_REASON_TERMINAL_UNAVAILABLE = 55;
  // TermOpen while the machine already runs its 20 terminal sessions.
  ERROR_REASON_TERMINAL_SESSION_LIMIT = 56;
  // TermClose or TermResize names a terminal session that is gone.
  ERROR_REASON_TERMINAL_SESSION_NOT_FOUND = 57;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID = 1;
  ERROR_CODE_NOT_FOUND = 2;
  // ThreadCreate on a sensitive directory without Consent.sensitive.
  ERROR_CODE_NEEDS_CONSENT = 3;
  // ThreadRespond with a revision that is no longer current.
  ERROR_CODE_STALE = 4;
  // All session slots are busy; the thread is queued.
  ERROR_CODE_QUEUED = 5;
  ERROR_CODE_PROVIDER_UNAVAILABLE = 6;
  ERROR_CODE_NEEDS_LOGIN = 7;
  ERROR_CODE_INTERNAL = 8;
}

message Cursor {
  // Bumped each time the agent restarts; a cursor from another epoch resets.
  uint64 epoch = 1;
  // Last item seq the device has applied.
  uint64 seq = 2;
}

message ThreadSummary {
  string id = 1;
  string title = 2;
  string dir = 3;
  string provider = 4;
  string model = 5;
  ThreadState state = 6;
  // Approvals and questions waiting for the user.
  uint32 pending = 7;
  // Unix milliseconds.
  int64 updated_at = 8;
  // The session is open (counts against the limit) or parked.
  bool open = 9;
  // One line of the thread's last message, for a chat-style session list: the
  // last text of the AI or the user (markdown dropped, at most 140
  // characters, cut with "…"). Never thinking, never more than the thread
  // itself shows. Empty before the first message and from tunelo before 2.0.2.
  string preview = 10;
  // The tool running right now (its name, e.g. "Bash"); a device shows
  // "Running: <tool>" instead of preview. Empty when none runs.
  string preview_tool = 11;
  // Hidden from the list (ThreadSetArchived); unset before tunelo 2.0.6.
  bool archived = 12;
  // The thread's session is running a turn somewhere else on the machine (a
  // terminal, an IDE, another app), not in a session the machine runs for
  // devices; state stays IDLE. Cleared once the session goes quiet. Never set
  // while the machine itself runs the thread. preview_tool names the tool
  // running there when the AI's records tell it. Unset before tunelo 2.5.0.
  bool busy_elsewhere = 13;
  // With busy_elsewhere: Unix milliseconds of the last activity seen there.
  int64 elsewhere_active_at = 14;
}

// What a turn the machine runs is doing right now (tunelo 2.5.0+), for a
// line under the last message. Sent to devices following the thread when
// the turn starts, then at most about once a second while something changes,
// never after it ended (the thread's state says it ended). A device counts
// the elapsed time itself from turn_started_at.
message ThreadActivity {
  string thread_id = 1;
  ActivityPhase phase = 2;
  // The tool running, by its name, with ACTIVITY_PHASE_TOOL; "" otherwise.
  string tool = 3;
  // Unix milliseconds when the turn started.
  int64 turn_started_at = 4;
  // Output tokens the AI produced in this turn so far; unset when the AI
  // does not report them (a device then shows no count).
  optional uint64 output_tokens = 5;
}

enum ActivityPhase {
  ACTIVITY_PHASE_UNSPECIFIED = 0;
  // Reasoning, or waiting for the AI's first output.
  ACTIVITY_PHASE_THINKING = 1;
  // Writing its answer.
  ACTIVITY_PHASE_WRITING = 2;
  // Running a tool (ThreadActivity.tool).
  ACTIVITY_PHASE_TOOL = 3;
  // Waiting for the user (an approval, a question, a secret).
  ACTIVITY_PHASE_WAITING = 4;
}

enum ThreadState {
  THREAD_STATE_UNSPECIFIED = 0;
  THREAD_STATE_IDLE = 1;
  THREAD_STATE_RUNNING = 2;
  THREAD_STATE_WAITING = 3;
  THREAD_STATE_QUEUED = 4;
  THREAD_STATE_ERROR = 5;
}

message ThreadListResult {
  repeated ThreadSummary threads = 1;
  uint32 open_sessions = 2;
  uint32 max_sessions = 3;
}

message ThreadCreated {
  ThreadSummary thread = 1;
}

// A thread was deleted (ThreadDelete): the answer to the request, and sent
// unasked to every connected device.
message ThreadDeleted {
  string thread_id = 1;
  // How many files went to the trash on the machine.
  uint32 trashed = 2;
}

message ThreadStatus {
  ThreadSummary thread = 1;
}

message ThreadItems {
  string thread_id = 1;
  repeated Item items = 2;
  // Where the device is after applying these items.
  Cursor cursor = 3;
}

message ThreadReset {
  string thread_id = 1;
  ResetReason reason = 2;
}

enum ResetReason {
  RESET_REASON_UNSPECIFIED = 0;
  RESET_REASON_EPOCH_CHANGED = 1;
  RESET_REASON_CURSOR_AHEAD = 2;
  RESET_REASON_CURSOR_COMPACTED = 3;
  RESET_REASON_JOURNAL_GAP = 4;
  RESET_REASON_SCHEMA_UNREADABLE = 5;
}

message FullItem {
  string thread_id = 1;
  Item item = 2;
}

// One journal entry. Devices merge by id and keep the highest revision.
message Item {
  string id = 1;
  uint64 seq = 2;
  uint32 revision = 3;
  // Unix milliseconds.
  int64 at = 4;
  // Which adapter/model produced it.
  string provider = 5;
  string model = 6;
  oneof body {
    TextItem text = 10;
    ToolCallItem tool_call = 11;
    ToolResultItem tool_result = 12;
    DiffItem diff = 13;
    TodoItem todo = 14;
    QuestionItem question = 15;
    ApprovalItem approval = 16;
    StatusItem status = 17;
    TurnItem turn = 18;
    SubagentItem subagent = 19;
    CompactionItem compaction = 20;
    ErrorItem error = 21;
    ModelChangeItem model_change = 22;
    AgentHandoffItem agent_handoff = 23;
  }
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ASSISTANT = 2;
  ROLE_THINKING = 3;
}

message TextItem {
  Role role = 1;
  string text = 2;
  // Still streaming: later revisions replace the text.
  bool partial = 3;
  // Echo of ThreadSend.client_msg_id for user messages.
  string client_msg_id = 4;
  // User messages: the files that went with it, in order.
  repeated Attachment attachments = 5;
}

enum ToolKind {
  TOOL_KIND_UNSPECIFIED = 0;
  TOOL_KIND_READ = 1;
  TOOL_KIND_EDIT = 2;
  TOOL_KIND_SHELL = 3;
  TOOL_KIND_SEARCH = 4;
  TOOL_KIND_WEB = 5;
  TOOL_KIND_MCP = 6;
  TOOL_KIND_SUBAGENT = 7;
  TOOL_KIND_TODO = 8;
  TOOL_KIND_OTHER = 9;
}

message ToolCallItem {
  string tool_id = 1;
  ToolKind kind = 2;
  // The adapter's own tool name, for display only.
  string name = 3;
  // One line: command, path or query.
  string summary = 4;
  // JSON input, shortened when large.
  string input = 5;
  bool sensitive = 6;
}

message ToolResultItem {
  string tool_id = 1;
  bool ok = 2;
  string output = 3;
  // Output was shortened; ThreadFetchFull returns the whole item.
  bool truncated = 4;
}

message DiffItem {
  string tool_id = 1;
  string path = 2;
  // Unified diff, at most 120 lines unless fetched in full.
  string unified = 3;
  uint32 added = 4;
  uint32 removed = 5;
  bool truncated = 6;
  // An edit made inside a subagent: the subagent's tool id (SubagentItem).
  // Devices show it with the subagent, not as a card of its own.
  string parent_tool_id = 7;
}

message TodoItem {
  repeated TodoEntry entries = 1;
}

message TodoEntry {
  string text = 1;
  TodoState state = 2;
}

enum TodoState {
  TODO_STATE_UNSPECIFIED = 0;
  TODO_STATE_PENDING = 1;
  TODO_STATE_IN_PROGRESS = 2;
  TODO_STATE_DONE = 3;
}

enum PromptState {
  PROMPT_STATE_UNSPECIFIED = 0;
  PROMPT_STATE_PENDING = 1;
  PROMPT_STATE_ANSWERED = 2;
  // The agent restarted while it was pending.
  PROMPT_STATE_EXPIRED = 3;
  // The turn was interrupted or the thread switched AI.
  PROMPT_STATE_CANCELLED = 4;
}

message ApprovalItem {
  string tool_id = 1;
  ToolKind kind = 2;
  string name = 3;
  string summary = 4;
  string input = 5;
  // Touches a sensitive path: shown in red, no "allow for the session".
  bool sensitive = 6;
  // Why the adapter asked, when it says.
  string reason = 7;
  PromptState state = 8;
  Decision decision = 9;
  // What the user told the AI when denying (ThreadRespond.deny_message).
  string deny_message = 10;
  // The sign-in secrets a command reads ($TUNELO_SECRET_<NAME>), each with
  // the site it belongs to; empty before tunelo 2.0.11, where devices take
  // the names from the input.
  repeated ApprovalSecret secrets = 11;
}

message ApprovalSecret {
  string name = 1;
  // https://host[:port]; "" when the session holds no secret of that name.
  string origin = 2;
}

message QuestionItem {
  repeated Question questions = 1;
  PromptState state = 2;
  Answers answers = 3;
}

message Question {
  string question = 1;
  string header = 2;
  repeated QuestionOption options = 3;
  bool multi_select = 4;
}

message QuestionOption {
  string label = 1;
  string description = 2;
}

message StatusItem {
  string text = 1;
}

enum TurnState {
  TURN_STATE_UNSPECIFIED = 0;
  TURN_STATE_RUNNING = 1;
  TURN_STATE_COMPLETED = 2;
  TURN_STATE_INTERRUPTED = 3;
  TURN_STATE_FAILED = 4;
}

message TurnItem {
  TurnState state = 1;
  uint64 duration_ms = 2;
  // Context window use after the turn, when the adapter reports it.
  uint64 context_tokens = 3;
  uint64 context_window = 4;
  // What the adapter reports about the finished turn; each one 0 or empty
  // when it does not (other AIs, tunelo before 2.0.11, a failed start).
  // The model that answered.
  string model = 5;
  // Tokens of the turn's own conversation (not of its subagents).
  uint64 input_tokens = 6;
  uint64 output_tokens = 7;
  uint64 cache_read_tokens = 8;
  uint64 cache_write_tokens = 9;
  // Time spent waiting on the AI's API during the turn.
  uint64 duration_api_ms = 10;
  // Model round trips of the turn.
  uint32 num_turns = 11;
  // What the turn would cost at the AI's API prices, subagents included, in
  // US dollars. Only an estimate: a subscription plan is not charged by it.
  double cost_usd_estimate = 12;
}

message SubagentItem {
  string tool_id = 1;
  string description = 2;
  bool done = 3;
}

message CompactionItem {
  uint64 tokens_before = 1;
}

message ErrorItem {
  string message = 1;
}

message ModelChangeItem {
  string from = 1;
  string to = 2;
}

message AgentHandoffItem {
  string from = 1;
  string to = 2;
  // The handoff text the new AI received as its first message.
  string summary = 3;
  repeated string files_changed = 4;
}

message ProviderCapabilities {
  bool interrupt = 1;
  bool resume = 2;
  bool session_allow = 3;
  bool questions = 4;
  bool todo = 5;
  bool context_usage = 6;
  bool compaction = 7;
  bool diff = 8;
  bool images = 9;
  repeated ModelOption models = 10;
  // Reasoning effort levels the AI accepts, lowest first; empty when it has none.
  repeated string effort_levels = 11;
}

message ModelOption {
  string id = 1;
  string name = 2;
}

enum LoginState {
  LOGIN_STATE_UNSPECIFIED = 0;
  LOGIN_STATE_OK = 1;
  LOGIN_STATE_NEEDS_LOGIN = 2;
  LOGIN_STATE_UNKNOWN = 3;
}

message ProviderInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  LoginState login_state = 4;
  ProviderCapabilities capabilities = 5;
  // The installed CLI is outside the range this agent was tested with.
  bool untested_version = 6;
}

message MachineInfo {
  string name = 1;
  string os = 2;
  string arch = 3;
  string agent_version = 4;
  uint32 protocol_version = 5;
  repeated ProviderInfo providers = 6;
  string home = 7;
  repeated string recent_dirs = 8;
  repeated string pinned_dirs = 9;
  uint32 open_sessions = 10;
  uint32 max_sessions = 11;
  // Resident memory of the agent and its sessions, in megabytes.
  uint32 memory_mb = 12;
  // Devices paired with this machine, for revoking one from another device.
  repeated PairedDevice devices = 13;
  // Unset on machines that have no settings to change from a device.
  MachineSettings settings = 14;
  // macOS only: tunelo lacks Full Disk Access, so its sessions cannot read
  // Desktop, Documents, Downloads, iCloud Drive and other protected folders,
  // and macOS may stop them on a prompt nobody at the machine answers. The
  // owner grants it in System Settings on the machine. B checks every few
  // seconds while it is missing and sends MachineInfo unasked to every
  // connected device once it is granted.
  bool needs_full_disk_access = 15;
  // The machine takes files with a message; unset before tunelo 2.0.5.
  AttachmentLimits attachments = 16;
  // The machine asks devices for sign-in secrets (SecretPrompt) and keeps
  // saved ones (SecretList); false before tunelo 2.0.8.
  bool secrets = 17;
  // The machine answers ThreadGitChanges and GitFileDiff; false before
  // tunelo 2.0.11.
  bool git_changes = 18;
  // The tunelo browser; unset before tunelo 2.0.12.
  RemoteBrowserInfo browser = 19;
  // The machine can bridge its own Screen Sharing (macOS) to a device
  // (ScreenShareStatusRequest, ScreenShareOpen); false before tunelo 2.0.13
  // and on other systems.
  bool screen_share = 20;
  // The machine has an authenticator secret: new devices can pair with its
  // code (see TotpSet).
  bool totp_enabled = 21;
  // Unset before tunelo 2.3.0.
  AgentUpdateInfo agent_update = 22;
  // The machine's terminal; unspecified before tunelo 2.4.0.
  TerminalAvailability terminal = 23;
}

enum TerminalAvailability {
  // An older machine: no terminal.
  TERMINAL_AVAILABILITY_UNSPECIFIED = 0;
  // Term* requests work (the terminal process starts on first use).
  TERMINAL_AVAILABILITY_AVAILABLE = 1;
  // The terminal process is not installed on the machine yet.
  TERMINAL_AVAILABILITY_MISSING = 2;
  // A terminal process of another major version runs, or the machine cannot
  // supervise one (no launchd/systemd/Run entry); `tunelo install` again.
  TERMINAL_AVAILABILITY_INCOMPATIBLE = 3;
}

message RemoteBrowserInfo {
  // A Chrome, Chromium or Edge was found for it.
  bool available = 1;
  // Its profile runs now: a device may open it (BrowserControl). B sends
  // MachineInfo unasked to every connected device when this changes.
  bool running = 2;
  // A device may delete its profile (BrowserClear); false before tunelo 2.0.13.
  bool clearable = 3;
}

message MachineSettings {
  // Localman (the owner's own account only) may send requests to
  // localhost:<port> on the machine through its tunnel. On by default.
  bool local_forward = 1;
  // The machine's tunnel server carries those requests now; when false,
  // nothing is forwarded whatever local_forward says.
  bool local_forward_available = 2;
}

message PairedDevice {
  // X25519 public key, 32 bytes (RevokeDevice takes it as is).
  bytes public_key = 1;
  string name = 2;
  // Unix milliseconds.
  int64 added_at = 3;
}

message DirListResult {
  string path = 1;
  repeated DirEntry entries = 2;
  // Parent path; empty at the filesystem root.
  string parent = 3;
  bool sensitive = 4;
}

message DirEntry {
  string name = 1;
  bool git = 2;
  string branch = 3;
  bool sensitive = 4;
}

message FileListResult {
  string thread_id = 1;
  // Sorted: shallower paths first, then by name.
  repeated FileEntry entries = 2;
  // More entries matched than were returned, or B stopped looking.
  bool truncated = 3;
}

message FileEntry {
  // Relative to the session's working directory, "/"-separated.
  string path = 1;
  bool dir = 2;
}

message AuditListResult {
  repeated AuditEntry entries = 1;
}

message AuditEntry {
  // Unix milliseconds.
  int64 at = 1;
  string device = 2;
  // open_sensitive, project_settings (detail "trust" when a device trusted
  // the folder), approve_sensitive, pair (detail: "install" or "totp"), revoke,
  // permission_mode, profile_add, profile_select, profile_remove,
  // delete_session (path: the folder; detail: the session ids),
  // project_add (a sensitive folder added as a project),
  // secret_add (path: the site; detail: the name, "saved" or "once"),
  // secret_use (path: the site; detail: the name and "fill" or "env"),
  // secret_remove (path: the site; detail: the name),
  // browser_control (a device gave the tunelo browser back or closed it;
  // path: the site it showed; detail: "claude" or "user"),
  // browser_clear (the tunelo browser's profile was deleted),
  // screen_share (a device opened the machine's Screen Sharing; never what it showed or what was typed),
  // totp_set (a device set or replaced the authenticator secret; never the secret),
  // agent_update (a device started an update of tunelo; detail: the version)
  string action = 3;
  string path = 4;
  string detail = 5;
}

// --- sign-in secrets ----------------------------------------------------------
//
// Claude asks for a password or a token with the request_secret tool of
// tunelo's MCP. When B keeps none for that site and name, every connected
// device gets a SecretPrompt; the user types the value on one of them and it
// reaches B end-to-end encrypted, never through the server. B seals a saved
// value with the OS key store (Keychain, DPAPI) or keeps a one-time value in
// memory for the session. Claude only ever gets a reference: tunelo fills the
// value into a page of that site or into the environment of a command, and
// hides it from every tool result, log and transcript. No frame from B ever
// carries a value. Prompts are no thread items: they never enter a journal.

// A → B: the value for an open prompt. Answered with Ack.
message SecretProvide {
  string request_id = 1;
  // At most 4096 characters, no control characters.
  string value = 2;
  // Keep it sealed on the machine for later sessions; false: this session only.
  bool remember = 3;
}

// A → B: the user will not give it. Answered with Ack.
message SecretDecline {
  string request_id = 1;
}

// A → B: the saved secrets, without their values. Answered with SecretListResult.
message SecretList {}

// A → B: forget a saved secret. Answered with SecretListResult.
message SecretRemove {
  string id = 1;
}

// B → A, unasked: Claude waits for a secret. Sent to every connected device,
// and again to a device that connects while it is open.
message SecretPrompt {
  string request_id = 1;
  string thread_id = 2;
  // What Claude calls it, e.g. "GITHUB_PASSWORD" (letters, digits, "_").
  string name = 3;
  // Why Claude needs it, in Claude's words (at most 300 characters).
  string purpose = 4;
  // The site it is for: scheme and host (and port), e.g. "https://github.com".
  string origin = 5;
  // Unix milliseconds: B stops waiting then.
  int64 expires_at = 6;
}

// B → A, unasked: a prompt is closed (answered, declined, expired or its
// session ended); every device drops its card.
message SecretPromptEnded {
  string request_id = 1;
}

message SecretListResult {
  // By site, then name.
  repeated SavedSecret secrets = 1;
}

message SavedSecret {
  string id = 1;
  string name = 2;
  string origin = 3;
  // Unix milliseconds.
  int64 created_at = 4;
  // Unix milliseconds; 0 when never used since it was saved.
  int64 last_used_at = 5;
}

// --- uncommitted changes of a thread's folder --------------------------------

// What git reports as not committed in the thread's folder (and below it):
// changed, staged, deleted and untracked files, with a short diff of each.
message GitChanges {
  string thread_id = 1;
  // The folder is in a git work tree; false: nothing else is set.
  bool git = 2;
  // Paths relative to the thread's folder, at most 200.
  repeated GitFileChange files = 3;
  // More files changed than listed.
  bool truncated = 4;
  // git did not answer in time or failed: the list may be incomplete.
  bool partial = 5;
}

enum GitFileState {
  GIT_FILE_STATE_UNSPECIFIED = 0;
  GIT_FILE_STATE_MODIFIED = 1;
  GIT_FILE_STATE_ADDED = 2;
  GIT_FILE_STATE_DELETED = 3;
  GIT_FILE_STATE_UNTRACKED = 4;
  GIT_FILE_STATE_TYPE_CHANGED = 5;
  GIT_FILE_STATE_CONFLICTED = 6;
}

message GitFileChange {
  string path = 1;
  GitFileState state = 2;
  uint32 added = 3;
  uint32 removed = 4;
  // Unified diff against the last commit, at most 120 lines unless fetched
  // with GitFileDiff; empty for a binary or sensitive file.
  string unified = 5;
  bool truncated = 6;
  bool binary = 7;
  // A sensitive path: listed without its content.
  bool sensitive = 8;
}

message GitFileDiffResult {
  string thread_id = 1;
  GitFileChange file = 2;
}

// --- the tunelo browser --------------------------------------------------------
//
// tunelo keeps one Chrome (or Chromium, Edge) profile of its own for Claude,
// apart from the user's browsers, so sign-ins stay between sessions. Claude
// opens it with the open_browser tool and drives it over the Chrome DevTools
// Protocol (Playwright's connectOverCDP). When a page needs a person (a
// sign-in, a captcha, a passkey), Claude calls request_takeover and waits:
// every device gets a BrowserTakeover; the user views the tab live and
// clicks, types and scrolls on it from the device, then gives it back
// (BrowserTakeoverEnd) and Claude gets the page's address and title. A user
// may also open the running browser from the machine's page
// (BrowserControl). Frames and input travel only over this end-to-end
// encrypted link; B keeps none of them, logs no key or text, and puts none in
// a journal. A takeover nobody uses for 10 minutes ends by itself.

// A → B: the user opens the running browser from the machine's page.
// Answered with BrowserTakeover (thread_id empty), or ERROR_REASON_BROWSER_NOT_RUNNING.
message BrowserControl {}

// A → B: show a takeover's tab on this device (on), or stop (off). B sends
// BrowserState, then BrowserFrame whenever the tab's picture changes, and
// only while at least one device views it. Answered with Ack.
message BrowserView {
  string takeover_id = 1;
  // The tab to show; empty: the one shown last (or the one Claude used).
  string target_id = 2;
  bool on = 3;
  // The largest picture this device wants, in pixels; 0: B's default. B caps
  // both at 1600.
  uint32 max_width = 4;
  uint32 max_height = 5;
}

// A → B: one action of the user on the tab shown. Only while the takeover is
// open; answered with Ack. B never logs it.
message BrowserInput {
  string takeover_id = 1;
  string target_id = 2;
  oneof action {
    BrowserMouse mouse = 3;
    BrowserKey key = 4;
    // Typed text (a phone's keyboard, a paste), at most 1000 characters.
    string text = 5;
  }
}

enum BrowserMouseType {
  BROWSER_MOUSE_TYPE_UNSPECIFIED = 0;
  BROWSER_MOUSE_TYPE_MOVE = 1;
  BROWSER_MOUSE_TYPE_DOWN = 2;
  BROWSER_MOUSE_TYPE_UP = 3;
  BROWSER_MOUSE_TYPE_WHEEL = 4;
}

message BrowserMouse {
  BrowserMouseType type = 1;
  // In CSS pixels of the page (BrowserFrame.page_width, page_height).
  double x = 2;
  double y = 3;
  // 0 left, 1 middle, 2 right.
  uint32 button = 4;
  uint32 click_count = 5;
  // WHEEL: CSS pixels to scroll.
  double delta_x = 6;
  double delta_y = 7;
  // Alt 1, Control 2, Meta 4, Shift 8.
  uint32 modifiers = 8;
}

// A key pressed and released: `key` as KeyboardEvent.key ("Enter", "a"),
// `code` as KeyboardEvent.code, `text` what it types (empty for Enter,
// arrows, shortcuts).
message BrowserKey {
  string key = 1;
  string code = 2;
  string text = 3;
  uint32 modifiers = 4;
}

// A → B: give the tab back to Claude (a takeover Claude asked for) or close
// the user's own. Answered with Ack.
message BrowserTakeoverEnd {
  string takeover_id = 1;
}

// B → A, unasked: a takeover is open. Sent to every device, again to a device
// that connects while it is open, and again when its expiry moves.
message BrowserTakeover {
  string takeover_id = 1;
  // The session whose Claude waits; empty when a device opened it.
  string thread_id = 2;
  // Why Claude needs the user, in Claude's words (at most 300 characters).
  string reason = 3;
  // The page it was opened on.
  string url = 4;
  // Unix milliseconds: it ends by itself then unless the user acts.
  int64 expires_at = 5;
  // Claude says a dialog of the operating system (a passkey sheet, a
  // Keychain prompt) waits on the machine's screen: the machine's whole
  // screen (ScreenShareOpen) is what the user needs. tunelo 2.0.13+.
  bool os_dialog = 6;
}

// B → A, unasked: a takeover ended; every device closes its view and card.
message BrowserTakeoverEnded {
  string takeover_id = 1;
}

// B → A, unasked, to a device viewing: the tab's picture.
message BrowserFrame {
  string takeover_id = 1;
  string target_id = 2;
  // JPEG.
  bytes jpeg = 3;
  // The page's viewport in CSS pixels, which the picture shows whole.
  double page_width = 4;
  double page_height = 5;
}

// B → A, unasked, to a device viewing: the tabs and the one shown, when they change.
message BrowserState {
  string takeover_id = 1;
  repeated BrowserTab tabs = 2;
  string target_id = 3;
  // The field the user types into is a password field: A should not let its
  // keyboard learn or suggest what is typed.
  bool password_focused = 4;
}

message BrowserTab {
  string target_id = 1;
  string url = 2;
  string title = 3;
}

// B → A, unasked: a page of the tunelo browser asked for a passkey
// (navigator.credentials) while no virtual authenticator was on. The OS
// passkey dialog needs someone at the machine; Claude is told too.
message PasskeyNotice {
  // The page's site.
  string origin = 1;
  // A new passkey (create) rather than a sign-in (get).
  bool create = 2;
  // The session that drove the browser last; empty when none.
  string thread_id = 3;
  // Unix milliseconds.
  int64 at = 4;
}

// --- the machine's screen -------------------------------------------------------
//
// A dialog of the operating system (a passkey sheet, a Keychain prompt) is no
// browser page. On macOS the owner may turn on the system's own Screen
// Sharing; tunelo never turns it on or changes any setting. When a device asks
// (ScreenShareOpen, only on the user's tap), tunelo opens one TCP stream to
// 127.0.0.1:5900 and relays its bytes over this end-to-end encrypted link:
// the VNC client on the device speaks to the system's service directly, so
// the Mac account's password (Apple's VNC authentication) is never read,
// kept or logged by tunelo. One session at a time; it ends after 10 minutes
// without anything from the device, when either side closes, or when the
// device's link closes.

// A → B: is Screen Sharing on, and is it reachable from the network?
// Answered with ScreenShareStatus.
message ScreenShareStatusRequest {}

message ScreenShareStatus {
  // macOS: the system has Screen Sharing.
  bool supported = 1;
  // A VNC service answers on 127.0.0.1:5900.
  bool enabled = 2;
  // It also listens beyond loopback and the firewall does not block all
  // incoming connections: anyone on the network can reach its sign-in.
  bool exposed = 3;
  // The macOS firewall is on.
  bool firewall_on = 4;
}

// A → B: open the session. Answered with ScreenShareOpened, or
// ERROR_REASON_SCREEN_SHARING_OFF / ERROR_REASON_SCREEN_SHARE_BUSY.
message ScreenShareOpen {}

message ScreenShareOpened {
  string stream_id = 1;
  // It closes after this long without anything from the device.
  uint32 idle_ms = 2;
}

// Bytes of the VNC stream, in order; at most 256 KiB each.
message ScreenShareData {
  string stream_id = 1;
  bytes data = 2;
}

// A → B: the device closes the session. Answered with Ack.
message ScreenShareClose {
  string stream_id = 1;
}

enum ScreenShareEnd {
  SCREEN_SHARE_END_UNSPECIFIED = 0;
  // The device closed it.
  SCREEN_SHARE_END_CLOSED = 1;
  // Nothing came from the device for too long.
  SCREEN_SHARE_END_IDLE = 2;
  // The system's service closed the stream (or could not be reached).
  SCREEN_SHARE_END_SERVICE = 3;
  // tunelo stopped.
  SCREEN_SHARE_END_STOPPED = 4;
}

// B → A, unasked, to the device that opened it: the session is over.
message ScreenShareClosed {
  string stream_id = 1;
  ScreenShareEnd reason = 2;
}

// A → B: delete the tunelo browser's profile. Answered with MachineInfo.
message BrowserClear {}

// --- pairing by authenticator ---------------------------------------------------
// The machine keeps a TOTP secret (RFC 6238: HMAC-SHA1, 6 digits, 30-second
// steps) that new devices pair with (PakeStart). A paired device makes the
// secret, shows it once as an otpauth:// QR for the user's authenticator app,
// checks the first code the user types, then sends it here; it reaches the
// machine end-to-end sealed and never the chat server. Sending a new one
// replaces it. B writes each change to the consent log.

// A → B: set or replace the secret. Answered with TotpStatus;
// ERROR_REASON_TOTP_SECRET_INVALID when it is not 20 bytes.
message TotpSet {
  bytes secret = 1;
}

// A → B: answered with TotpStatus.
message TotpStatusRequest {}

message TotpStatus {
  // The machine has a secret: new devices can pair with its code.
  bool enabled = 1;
}

// --- updating tunelo ----------------------------------------------------------
// A device can ask a machine to update itself, as `tunelo update` does at the
// machine: B fetches the newest tunelo release, checks its minisign signature
// against the key built into the running binary, replaces its own file and
// restarts. Devices reconnect to the new version on their own. B writes each
// update to the consent log.

message AgentUpdateInfo {
  // B can replace its own file; false when tunelo runs from source.
  bool supported = 1;
  // The newest release when it is newer than this tunelo; empty when this is
  // the newest or B could not reach the release list.
  string latest_version = 2;
  // An update is running now (progress follows as AgentUpdateProgress).
  bool updating = 3;
}

// A → B: look for a newer release now (B also looks every few hours).
// Answered with MachineInfo.
message AgentUpdateCheck {}

// A → B: update to the newest release. Answered with Ack at once;
// AgentUpdateProgress follows, to every connected device.
// ERROR_REASON_UPDATE_UNAVAILABLE / ERROR_REASON_UPDATE_BUSY.
message AgentUpdateStart {}

enum AgentUpdatePhase {
  AGENT_UPDATE_PHASE_UNSPECIFIED = 0;
  AGENT_UPDATE_PHASE_DOWNLOADING = 1;
  AGENT_UPDATE_PHASE_VERIFYING = 2;
  AGENT_UPDATE_PHASE_INSTALLING = 3;
  // The new file is in place and B is restarting; the connection ends here.
  AGENT_UPDATE_PHASE_RESTARTING = 4;
  // Nothing was installed: message says why, in English.
  AGENT_UPDATE_PHASE_FAILED = 5;
  // Already the newest; nothing to do.
  AGENT_UPDATE_PHASE_UP_TO_DATE = 6;
}

// B → A, unasked, to every connected device.
message AgentUpdateProgress {
  AgentUpdatePhase phase = 1;
  // The version being installed.
  string version = 2;
  // While DOWNLOADING, in bytes; total is 0 when the size is not known.
  uint64 received = 3;
  uint64 total = 4;
  string message = 5;
}

// --- the machine's terminal ------------------------------------------------------
// Real terminals (PTYs) held on the machine by tunelo's terminal process,
// open to the owner's paired devices like chat sessions. The terminal's own
// bytes are frames of docs/terminal-wire.md ("terminal frames"): on the
// direct path they go device ⟷ terminal process over WebRTC and never pass
// here; on the relay path each one is one TermData. Signaling (SDP, ICE) goes
// here, end-to-end sealed, so the DTLS fingerprints in it are authentic.
//
// A link is one terminal client of a device (one page): the device names it
// with a link id it picks (non-zero), scoped to the end-to-end connection it
// sends it on. A device sends TermSignal and TermData of a link on one
// connection, normally a second connection it keeps for the terminal only
// (its own counter and queue, so chat requests never hold keystrokes back).
// A link is made on its first TermSignal(OFFER) or TermData and ends when
// that connection closes or B sends TermStatus(CLOSED); the same id then
// names a new link, which starts again with a Hello terminal frame.
// TermListRequest, TermOpen, TermClose and TermResize name no link and work
// on any connection. B writes each terminal opened, closed or refused to the
// consent log, never a typed byte.

// A → B: the machine's terminal sessions. Answered with TermListResult.
message TermListRequest {}

message TermSessionInfo {
  uint32 session = 1;
  // The title the program set (OSC 0/2); may be empty.
  string title = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  // Unix milliseconds.
  int64 created_at = 5;
  // A link of some device is attached to it now.
  bool attached = 6;
  // Its program ended; it stays listed until TermClose.
  bool exited = 7;
  // With exited: the exit code (-1 when a signal ended it) and the signal (0 when none).
  int32 exit_code = 8;
  uint32 exit_signal = 9;
}

message TermListResult {
  repeated TermSessionInfo sessions = 1;
  // Sessions the machine keeps at most (exited ones count until closed).
  uint32 max_sessions = 2;
}

// A → B: start a login shell in a new session. Answered with TermOpened, or
// ERROR_REASON_TERMINAL_SESSION_LIMIT / ERROR_REASON_TERMINAL_UNAVAILABLE /
// ERROR_REASON_FOLDER_NOT_FOUND (cwd).
message TermOpen {
  // 1 to 1000 each.
  uint32 cols = 1;
  uint32 rows = 2;
  // An absolute folder of the machine; empty for the user's home.
  string cwd = 3;
}

message TermOpened {
  uint32 session = 1;
}

// A → B: hang up the session's shell (and its foreground programs) and drop
// it. Answered with TermClosed; ERROR_REASON_TERMINAL_SESSION_NOT_FOUND.
message TermClose {
  uint32 session = 1;
}

message TermClosed {
  uint32 session = 1;
}

// A → B: resize a session (also possible with a Resize terminal frame).
// Answered with Ack; ERROR_REASON_TERMINAL_SESSION_NOT_FOUND.
message TermResize {
  uint32 session = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

enum TermSignalKind {
  TERM_SIGNAL_KIND_UNSPECIFIED = 0;
  // A → B: the device's SDP offer (with its data channels term-in and
  // term-out); a new offer replaces the link's peer.
  TERM_SIGNAL_KIND_OFFER = 1;
  // B → A: the terminal process's SDP answer, with its host candidates.
  TERM_SIGNAL_KIND_ANSWER = 2;
  // Both ways: one ICE candidate line (`candidate:...`).
  TERM_SIGNAL_KIND_CANDIDATE = 3;
  // A → B: drop the link's peer (the relay stays). B → A: the peer ended (reason).
  TERM_SIGNAL_KIND_END = 4;
}

// WebRTC signaling of a link. A → B is answered with Ack (or an error by
// id); B → A comes unasked.
message TermSignal {
  uint32 link = 1;
  TermSignalKind kind = 2;
  // OFFER and ANSWER.
  string sdp = 3;
  // CANDIDATE.
  string candidate = 4;
  // B → A END: closed, ice_disconnected, channel_closed, dtls_failed,
  // timeout, no_address, bad_offer or error (docs/terminal-wire.md).
  string reason = 5;
}

// Exactly one terminal frame of the link on the relay path, both ways.
// Never answered: a bad frame or an unknown link ends the link with
// TermStatus(CLOSED).
message TermData {
  uint32 link = 1;
  // At most 65536 bytes.
  bytes data = 2;
}

enum TermPath {
  TERM_PATH_UNSPECIFIED = 0;
  // An offer is being answered and tried.
  TERM_PATH_CONNECTING = 1;
  // Frames go over WebRTC.
  TERM_PATH_DIRECT = 2;
  // Frames go as TermData over this connection.
  TERM_PATH_RELAY = 3;
  // The link ended (reason says why).
  TERM_PATH_CLOSED = 4;
}

// B → A, unasked: the path a link uses now. DIRECT may come twice, the
// second time with rtt_ms.
message TermStatus {
  uint32 link = 1;
  TermPath path = 2;
  // DIRECT: the ICE round trip in milliseconds; 0 until measured.
  float rtt_ms = 3;
  // CLOSED: expired, closed, revoked, agent_gone, transport_closed,
  // shutdown, bad_frame, overflow or unavailable.
  string reason = 4;
}
